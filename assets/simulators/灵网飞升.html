<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灵网飞升 · 赛博修仙AI角色扮演</title>
<meta name="description" content="血肉苦弱，灵根永存——但别忘了，云端之上，天道正在看着你。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 10v12L16 29 5 22V10z' fill='none' stroke='%233fe0c6' stroke-width='2'/%3E%3Cpath d='M16 10v12M10 13l12 6M22 13 10 19' stroke='%23ff6b9d' stroke-width='2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;background:var(--bg);color:var(--t);overflow:hidden;-webkit-font-smoothing:antialiased;text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
svg{display:block}

/* ============ 主题 ============ */
:root{color-scheme:dark}
[data-theme="neon"]{
  --bg:#0a0e15;--bg2:#0d1320;--surface:#111826;--elev:#182136;--hover:#1f2b40;
  --line:rgba(130,180,255,.14);--line2:rgba(130,180,255,.30);
  --t:#e8eef8;--t2:#a4b4c9;--t3:#6d7d95;
  --accent:#3fe0c6;--accent-soft:rgba(63,224,198,.14);--accent2:#ff6b9d;
  --gold:#e8c46a;--red:#ff6b6b;--green:#4cd7a0;--blue:#5aa7ff;--purple:#b58cff;
  --on-accent:#06201a;--shadow:0 12px 44px rgba(0,0,0,.5);--input:#0d1420;
  --overlay:rgba(4,8,14,.66);
}
[data-theme="ink"]{
  --bg:#0e0e12;--bg2:#131318;--surface:#17171d;--elev:#1f1f27;--hover:#292933;
  --line:rgba(232,196,106,.16);--line2:rgba(232,196,106,.32);
  --t:#f0ece2;--t2:#b8b0a0;--t3:#7e7769;
  --accent:#e8c46a;--accent-soft:rgba(232,196,106,.14);--accent2:#c98a5a;
  --gold:#e8c46a;--red:#e06555;--green:#7fc98a;--blue:#8fa8d8;--purple:#b89ce0;
  --on-accent:#171206;--shadow:0 12px 44px rgba(0,0,0,.58);--input:#131318;
  --overlay:rgba(6,6,10,.7);
}
[data-theme="jade"]{
  color-scheme:light;
  --bg:#eef3ef;--bg2:#e6ede8;--surface:#ffffff;--elev:#f4f8f5;--hover:#e9f1ec;
  --line:rgba(29,74,63,.14);--line2:rgba(29,74,63,.30);
  --t:#182420;--t2:#48605a;--t3:#7d918b;
  --accent:#1d6b56;--accent-soft:rgba(29,107,86,.12);--accent2:#b7791f;
  --gold:#a06a15;--red:#c2413b;--green:#2e8b63;--blue:#3a6ea5;--purple:#7a5aa8;
  --on-accent:#ffffff;--shadow:0 12px 36px rgba(30,60,50,.16);--input:#fbfdfc;
  --overlay:rgba(25,45,38,.35);
}
[data-theme="snow"]{
  color-scheme:light;
  --bg:#f4f6fa;--bg2:#eef1f7;--surface:#ffffff;--elev:#f6f8fc;--hover:#e8edf6;
  --line:rgba(37,64,110,.14);--line2:rgba(37,64,110,.30);
  --t:#182238;--t2:#4d5c78;--t3:#8593a8;
  --accent:#2f6bd8;--accent-soft:rgba(47,107,216,.12);--accent2:#d63c74;
  --gold:#a9740e;--red:#c23b3b;--green:#2f8f5b;--blue:#2f6bd8;--purple:#7a5aa8;
  --on-accent:#ffffff;--shadow:0 12px 36px rgba(30,50,90,.14);--input:#fbfcfe;
  --overlay:rgba(28,40,60,.35);
}

/* ============ 基础组件 ============ */
h1,h2,h3,h4{line-height:1.3}
.small{font-size:12px;color:var(--t3)}
.hint{font-size:12px;color:var(--t3);line-height:1.65}
.val{font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid var(--line2);background:var(--elev);color:var(--t);font-size:14px;transition:background .14s,border-color .14s,transform .08s}
.btn:hover{background:var(--hover);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:8px;border-radius:10px}
.btn.icon svg{width:18px;height:18px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn-row.right{justify-content:flex-end}
.btn-row.grow .btn{flex:1}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}

input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{
  width:100%;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;transition:border-color .14s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:64px;line-height:1.6}
select{cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:var(--line2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:6px;font-weight:600}
.field label .val{float:right;font-weight:400;color:var(--t3)}
.f-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.f-label span{font-size:12.5px;color:var(--t2);font-weight:600}

.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--elev);font-size:13px;color:var(--t2);transition:all .12s}
.seg button:hover{border-color:var(--line2);color:var(--t)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--t);font-weight:600}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--elev);font-size:11.5px;color:var(--t2);cursor:pointer;transition:all .12s}
.chip:hover{border-color:var(--accent);color:var(--t)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--t)}
.chip.solid{background:var(--accent-soft);border-color:var(--accent);color:var(--t);cursor:default}

/* ============ 创建向导 ============ */
#setup{position:fixed;inset:0;overflow-y:auto;background:var(--bg);z-index:60}
#setup::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 320px at 12% -5%,var(--accent-soft),transparent 60%),radial-gradient(520px 300px at 92% 108%,rgba(255,107,157,.07),transparent 60%)}
.setup-inner{max-width:720px;margin:0 auto;padding:30px 20px calc(120px + env(safe-area-inset-bottom));min-height:100%;position:relative}
.wiz-title{text-align:center;margin-bottom:22px}
.wiz-logo{font-size:34px;font-weight:800;letter-spacing:6px;color:var(--t)}
.wiz-logo b{color:var(--accent);font-weight:800}
.wiz-tagline{font-size:12.5px;color:var(--t3);margin-top:8px;letter-spacing:1px}
.step-dots{display:flex;justify-content:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.step-dots .dot{display:flex;flex-direction:column;align-items:center;gap:5px;width:auto;height:auto;background:none;border-radius:0}
.step-dots .dot .dn{width:24px;height:24px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);color:var(--t3);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .2s}
.step-dots .dot .dl{font-size:11px;color:var(--t3);white-space:nowrap;transition:color .2s}
.step-dots .dot.on .dn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step-dots .dot.on .dl{color:var(--t);font-weight:600}
.step-dots .dot.done .dn{background:var(--accent-soft);border-color:var(--accent);color:transparent}
.step-dots .dot.done .dn::after{content:"✓";color:var(--accent);font-size:13px;font-weight:700}
.step-dots .dot.done .dl{color:var(--t2)}
.wiz-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.wiz-card h3{font-size:18px;margin-bottom:4px}
.wiz-sub{font-size:12.5px;color:var(--t3);margin-bottom:18px;line-height:1.6}
.wiz-foot{display:flex;justify-content:space-between;gap:8px;margin-top:20px}
.wiz-foot .btn{min-width:96px}

.talent-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.talent-card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:all .13s;background:var(--elev)}
.talent-card:hover{border-color:var(--line2)}
.talent-card.on{border-color:var(--accent);background:var(--accent-soft)}
.talent-card.cheat{border-color:rgba(232,196,106,.45)}
.talent-card.cheat.on{border-color:var(--gold);background:rgba(232,196,106,.10)}
.tc-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px}
.tc-tag{font-size:10px;font-weight:600;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 7px}
.tc-desc{font-size:11.5px;color:var(--t3);margin-top:4px;line-height:1.55}

.origin-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.origin-card{border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:all .13s;background:var(--elev)}
.origin-card:hover{border-color:var(--line2)}
.origin-card.on{border-color:var(--accent);background:var(--accent-soft)}
.oc-name{font-size:13.5px;font-weight:700}
.oc-desc{font-size:11.5px;color:var(--t3);margin-top:4px;line-height:1.55}

.diff-card{border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:all .13s;background:var(--elev);margin-bottom:8px}
.diff-card:hover{border-color:var(--line2)}
.diff-card.on{border-color:var(--accent);background:var(--accent-soft)}
.diff-card .dc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-name{font-size:14.5px;font-weight:700}
.dc-alias{font-size:11px;color:var(--t2);border:1px solid var(--line2);border-radius:99px;padding:1px 8px}
.dc-tag{font-size:10.5px;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 8px}
.dc-desc{font-size:12px;color:var(--t2);margin-top:6px;line-height:1.6}

.cf-grid{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.cf-row{display:flex;padding:9px 13px;font-size:13px;gap:12px}
.cf-row:nth-child(odd){background:var(--elev)}
.cf-row .k{color:var(--t3);flex:none;width:76px}
.cf-row .v{color:var(--t);white-space:pre-wrap;word-break:break-word}
.cf-row .v b{color:var(--accent)}

/* ============ 游戏主界面 ============ */
#app{display:flex;flex-direction:column;height:100dvh}
#topbar{flex:none;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:30}
.top-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;color:var(--t2);font-size:13px;transition:all .12s;position:relative}
.top-btn:hover{background:var(--hover);color:var(--t)}
.top-btn .ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.top-btn .ico svg{width:19px;height:19px}
.top-btn .badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:99px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
#top-avatar{width:26px;height:26px;border-radius:9px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.top-title{flex:1;display:flex;align-items:center;gap:8px;min-width:0;justify-content:center}
.tt-name{font-size:15px;font-weight:800;letter-spacing:2px;white-space:nowrap}
.tt-chip{font-size:11px;color:var(--t2);border:1px solid var(--line2);border-radius:99px;padding:2px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.top-right{display:flex;align-items:center;gap:2px}

#center-panel{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0}
#game-log{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.msg{display:flex;margin:0 0 14px;gap:8px}
.msg .bubble{max-width:min(82%,760px);padding:11px 15px;border-radius:14px;font-size:14.5px;line-height:1.78;word-break:break-word;white-space:normal}
.msg .bubble p{margin:0 0 8px}
.msg .bubble p:last-child{margin-bottom:0}
.msg .bubble ul{margin:4px 0 8px;padding-left:20px}
.msg .bubble li{margin-bottom:3px}
.msg .bubble h4{font-size:14px;margin:8px 0 4px}
.msg .bubble b{color:var(--t);font-weight:700}
.msg .bubble i{color:var(--t2)}
.msg .bubble code{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.msg .bubble pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;overflow-x:auto;margin:6px 0;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--accent-soft);border:1px solid var(--accent);border-top-right-radius:5px;color:var(--t);font-weight:500}
.msg.assistant{justify-content:flex-start;flex-direction:column;align-items:flex-start}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--line);border-top-left-radius:5px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.think{margin:0 0 8px;border:1px dashed var(--line2);border-radius:10px;background:var(--bg2);font-size:12px;min-width:min(320px,70%)}
.think summary{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;color:var(--t3);list-style:none;user-select:none}
.think summary::-webkit-details-marker{display:none}
.think summary svg{width:13px;height:13px;color:var(--gold);flex:none}
.think summary span{font-weight:600}
.think summary small{margin-left:auto;font-size:10.5px;color:var(--t3)}
.think[open] summary{border-bottom:1px dashed var(--line2)}
.think-body{padding:8px 12px;color:var(--t3);line-height:1.7;white-space:pre-wrap;max-height:240px;overflow-y:auto;font-size:12px}
.msg.system{justify-content:center}
.msg.system .bubble{background:transparent;border:1px dashed var(--line2);color:var(--t3);font-size:12px;padding:5px 13px;border-radius:99px;max-width:92%;text-align:center}
.msg.system .bubble p{margin:0}
.msg.dead .bubble{border-color:var(--red);background:rgba(255,107,107,.07)}

#input-area{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.quick-actions{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.quick-actions::-webkit-scrollbar{display:none}
.qa-btn{flex:none;font-size:12px;color:var(--t2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--elev);transition:all .12s}
.qa-btn:hover{color:var(--t);border-color:var(--accent)}
.input-row{display:flex;gap:8px;align-items:flex-end}
#user-input{flex:1;resize:none;min-height:44px;max-height:140px;border-radius:12px;line-height:1.5;font-size:14.5px;padding:11px 14px}
#send-btn{flex:none;height:44px;padding:0 22px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;transition:filter .12s}
#send-btn:hover{filter:brightness(1.08)}
#send-btn:disabled{opacity:.5;cursor:not-allowed}
#send-btn svg{width:17px;height:17px}
.gen-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--elev);color:var(--t2);display:flex;align-items:center;justify-content:center}
.gen-btn:hover{color:var(--red);border-color:var(--red)}
.gen-btn svg{width:18px;height:18px}
#loading-indicator{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:6px 16px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:5}
.dots{display:inline-flex;gap:3px}
.dots span{width:5px;height:5px;border-radius:99px;background:var(--accent);animation:blink 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s}
.dots span:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,70%,100%{opacity:.25}35%{opacity:1}}
.lock-hint{text-align:center;font-size:12px;color:var(--red);padding:6px 0 2px}

/* ============ 抽屉（角色） ============ */
#left-panel{position:fixed;left:0;top:0;bottom:0;width:min(360px,90vw);background:var(--surface);z-index:80;transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--line2);box-shadow:8px 0 30px rgba(0,0,0,.35);display:flex;flex-direction:column}
#left-panel.open{transform:none}
.drawer-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:13px 14px 10px;border-bottom:1px solid var(--line)}
.dh-title{font-size:15px;font-weight:800;letter-spacing:1px}
.tabs{flex:none;display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .tab{flex:none;font-size:12.5px;color:var(--t2);padding:7px 12px;border-radius:9px;transition:all .12s}
.tabs .tab:hover{color:var(--t)}
.tabs .tab.on{background:var(--accent-soft);color:var(--t);font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
.drawer-backdrop{position:fixed;inset:0;background:var(--overlay);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}

.char-head{display:flex;align-items:center;gap:12px;padding:4px 2px 14px}
.char-av{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.char-nm{font-size:17px;font-weight:800}
.char-sub{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.5}
.char-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

.sec{background:var(--elev);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.sec-title{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sec-title .val{font-weight:400}
.realm-line{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.realm-nm{font-size:15px;font-weight:800}
.realm-lv{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}

.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.stat-row:last-child{margin-bottom:0}
.stat-label{width:74px;flex:none;font-size:12px;color:var(--t2);display:flex;justify-content:space-between;align-items:center}
.stat-label b{color:var(--t);font-weight:600;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .5s ease,background .3s}
.bar-fill.warn{animation:barpulse 1.2s infinite}
@keyframes barpulse{0%,100%{opacity:1}50%{opacity:.55}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-cell{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.info-cell .k{font-size:11px;color:var(--t3)}
.info-cell .v{font-size:13px;font-weight:600;margin-top:2px;word-break:break-word;font-variant-numeric:tabular-nums}
.scene-box{background:var(--bg2);border-left:3px solid var(--accent);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--t2);line-height:1.65}
.item-chips{display:flex;gap:5px;flex-wrap:wrap}
.item-chips .chip{cursor:default}
.attr-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.attr-row:last-child{border-bottom:none}
.attr-row .k{color:var(--t3)}
.attr-row .v{font-weight:500;text-align:right;max-width:65%;word-break:break-word}

.mem-item{display:flex;gap:8px;align-items:flex-start;background:var(--elev);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.mem-item .mt{font-size:12.5px;line-height:1.6;flex:1;color:var(--t2)}
.mem-item .mx{flex:none;color:var(--t3);padding:2px;border-radius:6px;display:flex}
.mem-item .mx:hover{color:var(--red)}
.mem-item .mx svg{width:14px;height:14px}
.mem-add{display:flex;gap:6px;margin-bottom:12px}
.mem-add input{flex:1}

.en-cat{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.en-cat .chip.on{font-weight:600}
.en-item{background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px}
.en-item .en-t{font-size:13px;font-weight:700;margin-bottom:3px}
.en-item .en-d{font-size:12px;color:var(--t2);line-height:1.65}
.en-ask{display:flex;gap:6px;margin-top:12px}
.en-ask input{flex:1}
.en-answer{background:var(--bg2);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--t2);line-height:1.7;margin-top:10px}

/* ============ 弹窗 ============ */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal{width:min(580px,94vw);max-height:88vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);transform:translateY(10px);transition:transform .18s}
.modal-overlay.open .modal{transform:none}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:16px 16px 0 0}
.m-head h3{font-size:16px;letter-spacing:1px}
.m-body{padding:12px 20px 20px}

.set-sec{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px}
.set-sec.danger{border-color:rgba(255,107,107,.35)}
.set-title{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:1px;margin-bottom:11px;display:flex;align-items:center;gap:6px}
.set-title svg{width:15px;height:15px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:13px}
.set-row .lbl{color:var(--t2)}
.set-row .val{color:var(--t)}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;transition:all .13s;background:var(--elev)}
.theme-card:hover{border-color:var(--line2)}
.theme-card.on{border-color:var(--accent);background:var(--accent-soft)}
.tc-row{display:flex;align-items:center;gap:8px}
.tc-swatches{display:flex;gap:3px}
.tc-swatches i{width:13px;height:13px;border-radius:4px;display:block}
.tc-name{font-size:13px;font-weight:700}
.tc-desc{font-size:11px;color:var(--t3);margin-top:3px}

.switch{position:relative;width:40px;height:22px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .15s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px)}

.death-banner{display:flex;align-items:center;gap:10px;background:rgba(255,107,107,.1);border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.death-banner .db-num{font-size:22px;font-weight:800;color:var(--red)}
.death-banner .db-txt{font-size:12.5px;color:var(--t2);line-height:1.6}
.death-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--elev)}
.death-card .dc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.death-card .dc-h .n{font-weight:800;font-size:14px;color:var(--red)}
.death-card .dc-h .meta{font-size:11px;color:var(--t3);text-align:right;line-height:1.5}
.death-card .dc-sec{font-size:12px;margin-bottom:7px;line-height:1.65}
.death-card .dc-sec .k{color:var(--t3);font-weight:600}
.death-card .dc-sec .v{color:var(--t2)}
.death-card .dc-sec.review .v{color:var(--t)}
.death-card .dc-btn{display:flex;justify-content:flex-end;margin-top:4px}

/* ============ Toast ============ */
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);background:var(--surface);border:1px solid var(--line2);color:var(--t);font-size:13px;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s;z-index:200;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--green)}
#toast.error{border-color:var(--red)}
#toast.warn{border-color:var(--gold)}

/* ============ 响应式 ============ */
@media (max-width:860px){
  .btn-txt{display:none}
  .top-btn{padding:8px}
  .top-title{justify-content:flex-start;margin-left:2px}
  .tt-name{font-size:13.5px}
  .talent-grid,.origin-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .setup-inner{padding:20px 14px calc(110px + env(safe-area-inset-bottom))}
  .wiz-logo{font-size:27px}
  .wiz-card{padding:18px 15px}
  .talent-grid,.origin-grid{grid-template-columns:1fr}
  .msg .bubble{max-width:88%;font-size:14px}
  #game-log{padding:12px 10px 6px}
  .modal .m-body{padding:10px 14px 16px}
  .m-head{padding:14px 14px 0}
  #send-btn{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>

<style>
/* ============ 补充样式（向导/面板/设置/死亡） ============ */

/* ---------- 轻量 Markdown 渲染 ---------- */
function md(t){
 t=esc(t);
 t=t.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.trim()+'</pre>');
 t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
 t=t.split('\n').map(l=>{
   const h=l.match(/^(#{1,3})\s+(.*)$/);
   if(h){const n=h[1].length+2;return '<h'+n+'>'+h[2]+'</h'+n+'>';}
   return l;
 }).join('\n');
 t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
 t=t.replace(/\*([^*]+)\*/g,'<i>$1</i>');
 const blocks=t.split(/\n\n+/).filter(b=>b.trim());
 return blocks.map(b=>{
   const lines=b.split('\n');
   if(lines.length>1&&lines.every(l=>/^[-•]\s/.test(l))) return '<ul>'+lines.map(l=>'<li>'+l.replace(/^[-•]\s/,'')+'</li>').join('')+'</ul>';
   return b.replace(/\n/g,'<br>');
 }).join('\n\n');
}

async function fetchModels(base,key){
  const res=await fetch(base.replace(/\/+$/,'')+'/models',{headers:{'Authorization':'Bearer '+key}});
  if(!res.ok){let m='HTTP '+res.status;try{const j=await res.json();m=(j&&j.error&&j.error.message)||m;}catch(e){}throw new Error(m);}
  const j=await res.json();
  const ids=(j&&j.data||[]).map(x=>x.id).filter(Boolean);
  if(!ids.length)throw new Error('接口未返回模型');
  return ids;
}
async function doFetchModels(sel){
  const base=($(sel+'-base')?$(sel+'-base').value.trim():cfg.base)||DEFAULTS.base;
  const key=($(sel+'-key')?$(sel+'-key').value.trim():cfg.key)||cfg.key;
  const btn=$(sel+'-fetch'),hint=$(sel+'-hint');
  if(!key){toast('请先填写 API Key','error');return;}
  if(btn){btn.disabled=true;btn.textContent='拉取中…';}
  if(hint)hint.innerHTML='正在连接…';
  try{
    const ids=await fetchModels(base,key);
    const dl=$(sel+'-model-list');
    if(dl)dl.innerHTML=ids.map(i=>`<option value="${esc(i)}">`).join('');
    const cur=$(sel+'-model');
    if(cur&&!ids.includes(cur.value.trim()))cur.value=ids[0];
    if(hint)hint.innerHTML='<span class="ok">获取到 '+ids.length+' 个模型：</span>'+esc(ids.join('、'));
    toast('已获取 '+ids.length+' 个模型','success');
  }catch(e){
    if(hint)hint.innerHTML='<span class="err">拉取失败：'+esc(e.message)+'</span>（若为跨域限制，可改用 CORS 代理或本地中转地址）';
    toast('模型拉取失败','error',3600);
  }
  if(btn){btn.disabled=false;btn.textContent='拉取模型列表';}
}

/* =====================================================
 * 游戏核心引擎 · B：请求层
 * ===================================================== */
function historyLimit(){
  const v=cfg.context;
  if(v==='')return 0;
  return parseInt(v)||40;
}
function buildMessages(){
  const sys={role:'system',content:systemPrompt()};
  let hist=state.messages;
  const lim=historyLimit();
  if(lim>0)hist=hist.slice(-lim);
  return [sys].concat(hist);
}

async function streamChat(messages,onDelta,onThink,signal){
  const base=cfg.base.replace(/\/+$/,'');
  const body={model:cfg.model,messages:messages,stream:true,temperature:cfg.temperature};
  if(cfg.maxTokens!=='')body.max_tokens=parseInt(cfg.maxTokens);
  const res=await fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify(body),signal:signal
  });
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const j=await res.json();msg=(j&&j.error&&j.error.message)||msg;}catch(e){}
    throw new Error(msg);
  }
  const ct=res.headers.get('content-type')||'';
  let full='',reasoning='';
  if(ct.indexOf('text/event-stream')>=0){
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const r=await reader.read();
      if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      let nl;
      while((nl=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,nl).trim();
        buf=buf.slice(nl+1);
        if(line.indexOf('data:')!==0)continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]'){buf='';break;}
        try{
          const j=JSON.parse(data);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(d&&typeof d.reasoning_content==='string'&&d.reasoning_content){reasoning+=d.reasoning_content;if(onThink)onThink(d.reasoning_content);}
          if(d&&typeof d.content==='string'&&d.content){full+=d.content;if(onDelta)onDelta(d.content);}
        }catch(e){}
      }
    }
  }else{
    full=await res.text();
    try{
      const j=JSON.parse(full);
      const m=j.choices&&j.choices[0]&&j.choices[0].message;
      if(m&&typeof m.reasoning_content==='string'){reasoning=m.reasoning_content;if(onThink)onThink(reasoning);}
      if(m&&typeof m.content==='string')full=m.content;
    }catch(e){}
    if(onDelta)onDelta(full);
  }
  return {content:full,reasoning:reasoning};
}

async function chatOnce(messages){
  const base=cfg.base.replace(/\/+$/,'');
  const body={model:cfg.model,messages:messages,stream:false,temperature:cfg.temperature};
  if(cfg.maxTokens!=='')body.max_tokens=parseInt(cfg.maxTokens);
  const res=await fetch(base+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body:JSON.stringify(body)
  });
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const j=await res.json();msg=(j&&j.error&&j.error.message)||msg;}catch(e){}
    throw new Error(msg);
  }
  const j=await res.json();
  const c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(typeof c!=='string')throw new Error('响应格式异常');
  return c;
}
/* =====================================================
 * 游戏核心引擎 · C：发送与流式演出
 * ===================================================== */
function send(text,opts){
  if(busy)return;
  const msg=(text!==undefined?text:$('user-input').value).trim();
  if(!msg){toast('先输入一点什么吧');return;}
  if(state.status.alive===false){toast('角色已死亡——请点右上角「回档」','error');return;}
  $('user-input').value='';autosizeInput();
  state.messages.push({role:'user',content:msg,ts:Date.now(),hidden:!!(opts&&opts.hidden)});
  state.turn++;
  renderLog();scrollLog();
  askAI();
}

async function askAI(){
  busy=true;showLoading(true);
  abortCtrl=new AbortController();
  const msgs=buildMessages();
  streamEl=addMsgEl('assistant','…');
  streamRaw='';
  let thinkEl=null,thinkText='';
  const ensureThink=function(){
    if(!thinkEl&&cfg.showThink){
      thinkEl=document.createElement('details');
      thinkEl.className='think';
      thinkEl.innerHTML='<summary>'+ico('spark')+'<span>天道推演</span><small>点击展开</small></summary><div class="think-body"></div>';
      const msgNode=streamEl.closest('.msg');
      msgNode.insertBefore(thinkEl,streamEl);
    }
    return thinkEl;
  };
  try{
    const res=await streamChat(msgs,function(delta){
      if(abortCtrl.signal.aborted)return;
      streamRaw+=delta;
      const i=streamRaw.indexOf('<<<');
      streamEl.innerHTML=md(i>=0?streamRaw.slice(0,i):streamRaw)||'…';
      scrollLog();
    },function(tk){
      if(abortCtrl.signal.aborted)return;
      thinkText+=tk;
      ensureThink();
      if(thinkEl){thinkEl.open=true;thinkEl.querySelector('.think-body').textContent=thinkText;}
    },abortCtrl.signal);
    streamRaw=res.content;
    const parsed=extractBlocks(res.content);
    streamEl.innerHTML=md(parsed.clean)||'（无内容）';
    if(res.reasoning&&cfg.showThink){
      ensureThink();
      if(thinkEl){thinkEl.querySelector('.think-body').textContent=res.reasoning;thinkEl.open=false;}
    }else if(thinkEl){
      thinkEl.remove();thinkEl=null;
    }
    if(parsed.state)applyStatus(parsed.state);
    if(parsed.memo&&parsed.memo.length)addMemos(parsed.memo);
    state.messages.push({role:'assistant',content:parsed.clean,reasoning:cfg.showThink?res.reasoning:'',ts:Date.now()});
    if(parsed.checkpoint){saveCheckpoint(parsed.checkpoint,true);}
    else if(state.turn>0&&state.turn%6===0){saveCheckpoint('第'+state.turn+'回合',true);}
    renderCharPanel();updateTopChip();
    saveGame(true);
    if(parsed.state&&(parsed.state.alive===false||(typeof parsed.state.hp==='number'&&parsed.state.hp<=0))){
      state.status.alive=false;updateInputLock();renderQuickActions();
      setTimeout(handleDeath,800);
    }
  }catch(err){
    if(thinkEl){thinkEl.remove();}
    streamEl.remove();
    const last=state.messages.pop();
    if(last&&last.role==='user'){state.turn--;$('user-input').value=last.content;autosizeInput();}
    if(abortCtrl.signal.aborted){toast('已停止生成','warn');}
    else{toast('生成失败：'+err.message+'（输入已恢复）','error',4500);}
  }finally{
    busy=false;showLoading(false);abortCtrl=null;streamEl=null;streamRaw='';
  }
}

/* =====================================================
 * 游戏核心引擎 · D：协议解析
 * ===================================================== */
function extractBlocks(text){
  const out={state:null,memo:[],checkpoint:null,clean:''};
  const st=text.match(/<<<STATE>>>([\s\S]*?)<<<END>>>/);
  if(st){try{out.state=JSON.parse(st[1].trim());}catch(e){}}
  const mo=text.match(/<<<MEMO>>>([\s\S]*?)<<<END>>>/);
  if(mo){out.memo=mo[1].split('|').map(function(x){return x.trim();}).filter(Boolean);}
  const cp=text.match(/<<<CHECKPOINT>>>([\s\S]*?)<<<END>>>/);
  if(cp)out.checkpoint=cp[1].trim();
  out.clean=text.replace(/<<<(?:STATE|MEMO|CHECKPOINT)>>>[\s\S]*?<<<END>>>/g,'').trim();
  return out;
}

function applyStatus(s){
  if(!state)return;
  const cur=state.status;
  const num=function(v,d){return typeof v==='number'&&isFinite(v)?v:d;};
  cur.hp=num(s.hp,cur.hp);cur.maxHp=num(s.maxHp,cur.maxHp);
  cur.mp=num(s.mp,cur.mp);cur.maxMp=num(s.maxMp,cur.maxMp);
  if(typeof s.realm==='string'&&s.realm)cur.realm=s.realm;
  cur.level=num(s.level,cur.level);
  cur.purity=clamp(num(s.purity,cur.purity),0,100);
  cur.cyber=clamp(num(s.cyber,cur.cyber),0,100);
  cur.mark=clamp(num(s.mark,cur.mark),0,200);
  cur.xinmo=clamp(num(s.xinmo,cur.xinmo),0,100);
  cur.lingshi=num(s.lingshi,cur.lingshi);
  cur.lingbi=num(s.lingbi,cur.lingbi);
  if(typeof s.location==='string'&&s.location)cur.location=s.location;
  if(typeof s.time==='string'&&s.time)cur.time=s.time;
  if(typeof s.scene==='string')cur.scene=s.scene;
  if(typeof s.school==='string')cur.school=s.school;
  if(Array.isArray(s.items))cur.items=s.items.slice(0,20).map(String);
  if(typeof s.alive==='boolean')cur.alive=s.alive;
}

function addMemos(list){
  if(!state)return;
  for(let i=0;i<list.length;i++){
    const raw=list[i];
    if(!raw||raw==='空')continue;
    if(raw.indexOf('百科：')===0){
      const body=raw.slice(3).trim();
      const sep=body.indexOf('|');
      const title=sep>0?body.slice(0,sep).trim():body.slice(0,24);
      const text=sep>0?body.slice(sep+1).trim():body;
      if(title&&!state.ency.some(function(e){return e.title===title;})){
        state.ency.push({title:title,body:text,ts:Date.now()});
      }
    }else{
      if(state.memory.some(function(m){return m.text===raw;}))continue;
      state.memory.push({id:uid(),text:raw,ts:Date.now()});
    }
  }
  if(state.memory.length>60)state.memory=state.memory.slice(-60);
  if(state.ency.length>40)state.ency=state.ency.slice(-40);
}
/* =====================================================
 * 游戏核心引擎 · E：回档点 / 死亡 / 回档
 * ===================================================== */
function saveCheckpoint(label,force){
  if(!state)return;
  const last=state.checkpoints[state.checkpoints.length-1];
  if(!force&&label==null)return;
  if(!force&&last&&(state.turn-last.turn)<6)return;
  state.checkpoints.push({
    id:uid(), ts:Date.now(),
    label:label||('第'+state.turn+'回合'),
    turn:state.turn,
    messages:state.messages.map(function(m){return {role:m.role,content:m.content,ts:m.ts,reasoning:m.reasoning,hidden:m.hidden};}),
    memory:state.memory.map(function(m){return {id:m.id,text:m.text,ts:m.ts};}),
    ency:state.ency.map(function(m){return {title:m.title,body:m.body,ts:m.ts};}),
    status:JSON.parse(JSON.stringify(state.status)),
    meta:JSON.parse(JSON.stringify(state.meta))
  });
  const keep=14;
  if(state.checkpoints.length>keep)state.checkpoints=state.checkpoints.slice(-keep);
}
function lastCpBefore(turn){
  const cps=state.checkpoints.filter(function(c){return c.turn<turn;});
  return cps.length?cps[cps.length-1]:(state.checkpoints[0]||null);
}

async function handleDeath(){
  if(!state||state.meta.pendingDeath)return;
  state.meta.pendingDeath={turn:state.turn};
  updateInputLock();
  saveGame(true);
  const cp=lastCpBefore(state.turn);
  toast('角色死亡，正在生成死亡档案…','info',4000);
  let rec=null;
  try{
    const content=await requestDeathReview();
    const m=content.match(/<<<DEATH>>>([\s\S]*?)<<<END>>>/);
    if(m){try{rec=JSON.parse(m[1].trim());}catch(e){rec=null;}}
    if(!rec){rec={cause:'不明',review:content.slice(0,180),advice:'——'};}
  }catch(e){
    rec={cause:'不明',review:'（死亡档案生成失败：'+e.message+'）',advice:'请检查 API 配置后重试。'};
  }
  const record={
    id:uid(),ts:Date.now(),turn:state.turn,
    realm:state.status.realm+'·'+state.status.level+'层',
    location:state.status.location,
    cause:String(rec.cause||'不明'),
    review:String(rec.review||''),
    advice:String(rec.advice||''),
    cpId:cp?cp.id:null
  };
  state.deaths.push(record);
  if(state.deaths.length>30)state.deaths=state.deaths.slice(-30);
  saveGame(true);
  renderDeathsTab();updateDeathBadge();
  openDeathModal();
}

async function requestDeathReview(){
  const msgs=[{role:'system',content:deathPrompt()}];
  const hist=state.messages.slice(-14);
  for(let i=0;i<hist.length;i++){
    const m=hist[i];
    if(m.role==='system')continue;
    msgs.push({role:m.role,content:m.content});
  }
  msgs.push({role:'user',content:'（主角已死亡。请以「灵网系统」的口吻输出死亡档案数据块：<<<DEATH>>>{"cause":"死因概述，30字内","review":"对玩家这一世行为的点评，60-120字，具体、犀利、有洞察，不鸡汤","advice":"对下一世的建议，50-100字，可操作"}<<<END>>>）'});
  return await chatOnce(msgs);
}

function rollbackTo(cpId){
  if(!state)return;
  const cp=state.checkpoints.find(function(c){return c.id===cpId;});
  if(!cp){toast('未找到该时间点','error');return;}
  state.messages=cp.messages.map(function(m){return {role:m.role,content:m.content,ts:m.ts,reasoning:m.reasoning,hidden:m.hidden};});
  state.memory=cp.memory.map(function(m){return {id:m.id,text:m.text,ts:m.ts};});
  state.ency=cp.ency.map(function(m){return {title:m.title,body:m.body,ts:m.ts};});
  state.status=JSON.parse(JSON.stringify(cp.status));
  state.meta=JSON.parse(JSON.stringify(cp.meta));
  state.meta.pendingDeath=null;
  state.turn=cp.turn;
  state.status.alive=true;
  state.messages.push({role:'system',content:'【时间回档】你回到了「'+cp.label+'」这一时刻，命运从此刻重新书写。',ts:Date.now()});
  saveGame(true);
  closeModal('death-modal');closeDrawer();
  renderAll();updateInputLock();
  toast('已回到关键时间点「'+cp.label+'」','success',3000);
}

    h+='<div class="death-card hot">';
    h+='<div class="dc-line"><span class="dc-k">死因</span>'+esc(latest.cause)+'</div>';
    h+='<div class="dc-line"><span class="dc-k">点评</span>'+esc(latest.review)+'</div>';
    h+='<div class="dc-line"><span class="dc-k">建议</span>'+esc(latest.advice)+'</div>';
    h+='<button class="btn primary block" data-rollback="'+(latest.cpId||'')+'">回到关键时间点，继续游戏</button>';
    h+='</div>';
  }
  h+='<div class="p-sub" style="margin:14px 0 8px">全部死亡记录</div>';
  h+=deathListHTML(deaths);
  $('death-content').innerHTML=h;
  bindRollbackBtns($('death-content'));
  openModal('death-modal');
}
/* =====================================================
 * 设置 / 存档 / 初始化
 * ===================================================== */
function renderSettings(){
  const c=cfg;
  const s=$('settings-content');
  let h='<div class="set-sec"><div class="set-title">API 设置</div>';
  h+='<div class="field"><label>API 地址</label><input id="s-base" value="'+esc(c.base)+'"></div>';
  h+='<div class="field"><label>API Key</label><input id="s-key" type="password" value="'+esc(c.key)+'"><div class="hint" style="margin-top:6px">仅保存在本机浏览器 localStorage。</div></div>';
  h+='<div class="field"><label>模型</label><div class="row gap"><input id="s-model" list="s-model-list" style="flex:1" value="'+esc(c.model)+'"><datalist id="s-model-list"></datalist><button class="btn" id="s-fetch">拉取模型</button></div><div class="hint" id="s-hint" style="margin-top:6px"></div></div>';
  h+='<div class="grid2">';
  h+='<div class="field"><label>单次回复 Token 上限</label><select id="s-maxtokens">';
  h+=[512,1024,2048,4096,8192].map(function(v){return '<option value="'+v+'"'+(c.maxTokens===String(v)?' selected':'')+'>'+v+'</option>';}).join('');
  h+='<option value=""'+(c.maxTokens===''?' selected':'')+'>无限制</option></select></div>';
  h+='<div class="field"><label>上下文保留</label><select id="s-context">';
  h+=[['24','最近24条消息'],['40','最近40条消息'],['60','最近60条消息'],['','无限制（长会话可能超出上下文）']].map(function(o){return '<option value="'+o[0]+'"'+(c.context===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
  h+='</select></div></div>';
  h+='<div class="field"><label>温度（创作随机性）<span class="val" id="s-tempv">'+c.temperature.toFixed(2)+'</span></label><input type="range" id="s-temp" min="0.3" max="1.3" step="0.05" value="'+c.temperature+'"></div>';
  h+='<div class="btn-row"><button class="btn primary" id="s-save">保存设置</button><button class="btn" id="s-test">测试连接</button></div></div>';
  h+='<div class="set-sec"><div class="set-title">界面风格</div><div class="theme-grid">';
  h+=THEMES.map(function(t){
    return '<button class="theme-card '+(c.theme===t.id?'on':'')+'" data-theme="'+t.id+'"><span class="th-dots">'+t.colors.map(function(col){return '<i style="background:'+col+'"></i>';}).join('')+'</span><b>'+t.name+'</b><span class="th-desc">'+t.desc+'</span></button>';
  }).join('');
  h+='</div>';
  h+='<div class="row between" style="margin-top:12px"><span class="small">显示思考过程（天道推演）</span><button class="switch '+(c.showThink?'on':'')+'" id="s-think"><span></span></button></div></div>';
  h+='<div class="set-sec"><div class="set-title">存档管理</div>';
  h+='<div class="row between" style="margin-bottom:10px"><span class="small">自动存档</span><button class="switch '+(c.autoSave?'on':'')+'" id="s-autosave"><span></span></button></div>';
  h+='<div class="row gap" style="flex-wrap:wrap"><button class="btn sm" id="s-manual">手动存档</button><button class="btn sm" id="s-export">导出存档</button><button class="btn sm" id="s-import">导入存档</button></div>';
  h+='<div class="hint" style="margin-top:8px" id="s-savetime"></div></div>';
  h+='<div class="set-sec danger"><div class="set-title">危险区</div><button class="btn danger block" id="s-restart">重新开始（清除本局全部进度）</button></div>';
  s.innerHTML=h;
  $('s-temp').addEventListener('input',function(){ $('s-tempv').textContent=parseFloat($('s-temp').value).toFixed(2); });
  $('s-fetch').onclick=function(){doFetchModels('s');};
  $('s-test').onclick=function(){doFetchModels('s');};
  $('s-save').onclick=function(){
    cfg.base=$('s-base').value.trim()||DEFAULTS.base;
    cfg.key=$('s-key').value.trim();
    cfg.model=$('s-model').value.trim()||cfg.model;
    cfg.maxTokens=$('s-maxtokens').value;
    cfg.context=$('s-context').value;
    cfg.temperature=parseFloat($('s-temp').value);
    saveCfg();applyTheme(cfg.theme);
    toast('设置已保存','success');
  };
  $('s-autosave').onclick=function(){
    cfg.autoSave=!cfg.autoSave;
    saveCfg();
    $('s-autosave').classList.toggle('on',cfg.autoSave);
    toast(cfg.autoSave?'自动存档已开启':'自动存档已关闭');
  };
  $('s-think').onclick=function(){
    cfg.showThink=!cfg.showThink;
    saveCfg();
    $('s-think').classList.toggle('on',cfg.showThink);
    renderLog();
    toast(cfg.showThink?'思考过程已显示':'思考过程已隐藏');
  };
  $('s-manual').onclick=function(){
    saveCheckpoint('手动存档',true);
    saveGame();
  };
  $('s-export').onclick=exportSave;
  $('s-import').onclick=importSave;
  $('s-restart').onclick=restartGame;
  s.querySelectorAll('[data-theme]').forEach(function(b){
    b.onclick=function(){
      cfg.theme=b.dataset.theme;
      saveCfg();applyTheme(cfg.theme);
      s.querySelectorAll('[data-theme]').forEach(function(x){x.classList.toggle('on',x===b);});
    };
  });
  $('s-savetime').textContent='上次存档：'+(state?fmtFull(state.saved):'—');
}
/* =====================================================
 * 导出 / 导入 / 重开 / 启动
 * ===================================================== */
function exportSave(){
  if(!state){toast('还没有游戏进度','warn');return;}
  const data={v:1,cfg:cfg,state:state,exported:Date.now()};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='灵网飞升存档_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('存档已导出','success');
}
function importSave(){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='.json,application/json';
  inp.onchange=function(){
    const f=inp.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=function(){
      try{
        const d=JSON.parse(r.result);
        if(!d||!d.state||!d.state.player)throw new Error('bad');
        confirmBox('导入存档','导入将覆盖当前进度（含记忆、死亡记录与回档点），确定继续吗？',function(){
          if(d.cfg)cfg=Object.assign({},DEFAULTS,d.cfg);
          saveCfg();applyTheme(cfg.theme);
          state=d.state;
          state.saved=Date.now();
          saveGame(true);
          enterGame();
          toast('存档导入成功','success');
        });
      }catch(e){
        toast('存档格式不正确','error');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}
function restartGame(){
  confirmBox('重新开始','将清除本局全部进度（含记忆、死亡记录、回档点），回到角色创建页。此操作不可撤销。',function(){
    try{localStorage.removeItem(LS_SAVE);}catch(e){}
    state=null;
    charDraft=null;
    charTab='status';
    showSetup();
    toast('已清除进度','warn');
  },'清除并重开');
}

function enterGame(){
  $('setup').classList.add('hidden');
  $('app').classList.remove('hidden');
  initGameUI();
  renderAll();
  if(state.messages.length===0){
    openingScene();
  }else{
    toast('已读取存档，继续冒险','success');
  }
}
function initGameUI(){
  renderQuickActions();
  const input=$('user-input');
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
  });
  input.addEventListener('input',autosizeInput);
}
function bindGlobal(){
  $('btn-char').onclick=function(){openDrawer('status');};
  $('btn-deaths').onclick=function(){
    if(state&&state.deaths.length)openDeathModal();
    else toast('还没有死亡记录');
  };
  $('btn-ency').onclick=function(){openDrawer('ency');};
  $('btn-settings').onclick=function(){renderSettings();openModal('settings-modal');};
  $('drawer-close').onclick=closeDrawer;
  $('drawer-backdrop').onclick=closeDrawer;
  $('send-btn').onclick=function(){send();};
  $('stop-btn').onclick=stopGen;
  $('cf-ok').onclick=function(){
    closeModal('confirm-modal');
    const f=cfOk;cfOk=null;
    if(f)f();
  };
  $('cf-cancel').onclick=function(){closeModal('confirm-modal');cfOk=null;};
  $('ico-deaths').innerHTML=ico('skull');
  $('ico-ency').innerHTML=ico('book');
  $('ico-settings').innerHTML=ico('sliders');
  $('stop-btn').innerHTML=ico('x');
  $('drawer-close').innerHTML=ico('x');
  document.querySelectorAll('[data-close]').forEach(function(b){
    b.innerHTML=ico('x');
  });
  window.addEventListener('pagehide',function(){
    if(state){
      try{localStorage.setItem(LS_SAVE,JSON.stringify({v:1,saved:Date.now(),state}));}catch(e){}
    }
  });
}

function init(){
  applyTheme(cfg.theme);
  bindGlobal();
  const saved=loadSave();
  if(saved&&saved.started){
    state=saved;
    enterGame();
  }else{
    showSetup();
  }
}
init();

/* 调试钩子（供测试/排障） */
window.__lwf={
  getState:function(){return state;},
  getCfg:function(){return cfg;},
  die:function(){handleDeath();},
  rollback:rollbackTo,
  applyStatus:applyStatus,
  send:send,
  reset:function(){try{localStorage.removeItem(LS_SAVE);}catch(e){}location.reload();}
};
</script>
</body>
