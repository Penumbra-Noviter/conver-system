<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f15">
<title>恋樱学园 · 校园恋爱AI</title>
<style>
/* ============ Tokens ============ */
:root{
  --topbar-h:46px; --drawer-w:330px; --rad:8px; --rad2:12px; --tr:180ms ease;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code",Consolas,monospace;
}
body[data-theme="night"]{
  --bg-deep:#0f0f15; --bg-surface:#17171f; --bg-elevated:#1e1e29; --bg-hover:#272735;
  --border:#2b2b3a; --border-active:#41415c;
  --t:#ececf3; --t2:#a9a9bd; --t3:#74748e;
  --accent:#ff5c8a; --accent-dim:#cf4470; --accent-glow:rgba(255,92,138,.14);
  --gold:#ffb454; --gold-dim:#b87f2e; --gold-glow:rgba(255,180,84,.14);
  --jade:#45cfa8; --jade-dim:#238a6e; --jade-glow:rgba(69,207,168,.13);
  --r:#e85058; --gr:#35c878; --purple:#a070f0;
  --shadow:0 8px 40px rgba(0,0,0,.55);
  --glow:radial-gradient(65% 42% at 50% 0%, rgba(255,92,138,.09), transparent 70%);
}
body[data-theme="sakura"]{
  --bg-deep:#f7f2f4; --bg-surface:#ffffff; --bg-elevated:#fdf3f6; --bg-hover:#f8e3e9;
  --border:#ecd9e0; --border-active:#d9b6c2;
  --t:#3b2a31; --t2:#7e6871; --t3:#a8909a;
  --accent:#e0557f; --accent-dim:#c2406a; --accent-glow:rgba(224,85,127,.12);
  --gold:#cf8a2e; --gold-dim:#a86c22; --gold-glow:rgba(207,138,46,.13);
  --jade:#1f9e7a; --jade-dim:#177a5f; --jade-glow:rgba(31,158,122,.12);
  --r:#d64550; --gr:#2fa76a; --purple:#8a5fd0;
  --shadow:0 8px 40px rgba(120,60,80,.16);
  --glow:radial-gradient(65% 42% at 50% 0%, rgba(224,85,127,.10), transparent 70%);
}
body[data-theme="starlight"]{
  --bg-deep:#0b0f1c; --bg-surface:#121830; --bg-elevated:#1a2140; --bg-hover:#232c50;
  --border:#2c3760; --border-active:#42508a;
  --t:#e9edfb; --t2:#a4aed0; --t3:#6d77a0;
  --accent:#5aa7ff; --accent-dim:#3f7fd6; --accent-glow:rgba(90,167,255,.15);
  --gold:#ffd166; --gold-dim:#c49a35; --gold-glow:rgba(255,209,102,.14);
  --jade:#3ecfa8; --jade-dim:#2a8f74; --jade-glow:rgba(62,207,168,.13);
  --r:#e85058; --gr:#35c878; --purple:#a070f0;
  --shadow:0 8px 40px rgba(0,0,0,.55);
  --glow:radial-gradient(65% 42% at 50% 0%, rgba(90,167,255,.10), transparent 70%);
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg-deep);color:var(--t);line-height:1.55;-webkit-font-smoothing:antialiased;user-select:none;font-size:13px}
body::before{content:'';position:fixed;inset:0;background:var(--glow);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-active);border-radius:3px}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{background:var(--bg-surface);border:1px solid var(--border);color:var(--t);border-radius:var(--rad);padding:8px 12px;outline:none;transition:border var(--tr)}
input:focus,textarea:focus,select:focus{border-color:var(--accent-dim)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
textarea{resize:vertical}
.hidden{display:none!important}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ============ App layout ============ */
#app{display:grid;grid-template-columns:1fr;grid-template-rows:var(--topbar-h) 1fr;height:100vh;height:100dvh;position:relative;z-index:1}
#topbar{grid-row:1;background:var(--bg-surface);display:flex;align-items:center;padding:0 10px;gap:8px;border-bottom:1px solid var(--border);z-index:20}
#topbar .logo{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--accent);white-space:nowrap}
#topbar .logo span{color:var(--t3);font-weight:400;font-size:10px;margin-left:6px}
#topbar .spacer{flex:1}
.top-btn{padding:5px 12px;border-radius:var(--rad);font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--t2);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all var(--tr)}
.top-btn:hover{background:var(--bg-hover);color:var(--t);border-color:var(--border-active)}
.top-btn.accent{border-color:var(--accent-dim);color:var(--accent)}
.top-btn.accent:hover{background:var(--accent-glow)}
.top-chip{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid var(--border);font-size:10.5px;color:var(--t2);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.adult-badge{font-size:9px;font-weight:800;color:#fff;background:var(--r);border-radius:4px;padding:1px 5px;letter-spacing:0.5px;box-shadow:0 0 8px rgba(232,80,88,.5)}
#center-panel{grid-row:2;background:var(--bg-deep);display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ============ Game log ============ */
#game-log{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.log-entry{padding:10px 14px;border-radius:var(--rad2);font-size:13px;line-height:1.75;animation:fadeIn 250ms ease;user-select:text;word-break:break-word}
.log-entry.narrative{background:var(--bg-elevated);border-left:3px solid var(--accent-dim)}
.log-entry.action{background:var(--bg-elevated);border-left:3px solid var(--jade-dim);color:var(--t2)}
.log-entry.action b{color:var(--t);font-weight:600}
.log-entry.system{background:var(--bg-surface);border-left:3px solid var(--t3);font-size:10.5px;color:var(--t3);font-family:var(--mono);line-height:1.6}
.log-entry.stat{background:var(--bg-surface);border-left:3px solid var(--gold-dim);font-size:11px;color:var(--gold)}
.log-entry.think{background:var(--bg-surface);border:1px solid var(--border);border-left:3px solid var(--purple);font-size:11.5px;color:var(--t2);white-space:pre-wrap;word-break:break-word}
.log-entry.think summary{color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;user-select:none}
.log-entry.think .think-body{margin-top:6px;line-height:1.7}
.log-entry .who{font-weight:600}
.log-entry .who.ai{color:var(--accent)}
.log-entry .who.pl{color:var(--jade)}
.log-entry.streaming .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 0.9s infinite;border-radius:1px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ============ Input ============ */
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px 0}
.quick-action{padding:5px 12px;background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--t2);transition:all var(--tr)}
.quick-action:hover{background:var(--bg-hover);color:var(--t);border-color:var(--accent-dim)}
#input-area{padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--bg-surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
#input-area textarea{flex:1;resize:none;min-height:42px;max-height:110px;font-size:13.5px;line-height:1.5;background:var(--bg-deep);padding:10px 13px;border-radius:var(--rad2)}
#input-area textarea::placeholder{color:var(--t3)}
#send-btn{padding:10px 20px;background:var(--accent);color:#fff;border-radius:var(--rad2);font-weight:600;font-size:13px;transition:all var(--tr);white-space:nowrap;box-shadow:0 2px 12px var(--accent-glow)}
#send-btn:hover{filter:brightness(1.1)}
#send-btn:disabled{opacity:0.35;cursor:not-allowed;box-shadow:none}
.gen-btn{padding:10px 11px;background:var(--bg-elevated);color:var(--t2);border:1px solid var(--border);border-radius:var(--rad2);font-size:13px;line-height:1;white-space:nowrap;transition:all var(--tr);cursor:pointer}
.gen-btn:hover{background:var(--bg-hover);color:var(--t)}
.gen-btn:disabled{opacity:.35;cursor:not-allowed}
#stop-btn{background:var(--r);border-color:transparent;color:#fff}
#stop-btn:hover{filter:brightness(1.1);color:#fff}
#loading-indicator{display:none;align-items:center;gap:7px;padding:8px 12px;font-size:11px;color:var(--t3)}
#loading-indicator.show{display:flex}
#loading-indicator .dots{display:flex;gap:3px}
#loading-indicator .dots span{width:5px;height:5px;background:var(--accent);border-radius:50%;animation:bounce 1s infinite}
#loading-indicator .dots span:nth-child(2){animation-delay:0.15s}
#loading-indicator .dots span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,80%,100%{transform:scale(0.5)}40%{transform:scale(1)}}

/* ============ Drawer (角色页面) ============ */
#left-panel{position:fixed;left:0;top:0;bottom:0;width:var(--drawer-w);max-width:92vw;background:var(--bg-surface);z-index:60;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px;transform:translateX(-102%);transition:transform 240ms ease;border-right:1px solid var(--border);box-shadow:6px 0 28px rgba(0,0,0,.35)}
#left-panel.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 4px}
.drawer-head .tt{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:1px}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
.drawer-backdrop.show{display:block}
.panel-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:11px}
.panel-card h2{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--t3);margin-bottom:8px}
.char-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.avatar.sm{width:34px;height:34px;font-size:15px}
.char-name{font-size:14px;font-weight:700}
.char-sub{font-size:10px;color:var(--t3);margin-top:1px}
.stat-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.stat-row .lbl{font-size:10px;color:var(--t3);width:34px;flex-shrink:0}
.stat-row .sbar{flex:1;height:8px;background:var(--bg-deep);border-radius:4px;overflow:hidden}
.stat-row .sbar div{height:100%;border-radius:4px;transition:width 500ms ease}
.stat-row .val{font-size:10px;color:var(--t2);width:42px;text-align:right;font-family:var(--mono);flex-shrink:0}
.info-line{font-size:10.5px;color:var(--t2);padding:2px 0;line-height:1.6}
.info-line .k{color:var(--t3)}
/* 攻略对象卡片 */
.tg-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:10px;margin-bottom:8px;transition:border var(--tr)}
.tg-card.open{border-color:var(--accent-dim)}
.tg-head{display:flex;align-items:center;gap:9px;cursor:pointer}
.tg-head .tg-info{flex:1;min-width:0}
.tg-name{font-size:12.5px;font-weight:700}
.tg-stage{display:inline-block;font-size:9px;padding:1px 7px;border-radius:10px;margin-left:5px;vertical-align:1px;background:var(--accent-glow);color:var(--accent);border:1px solid var(--accent-dim)}
.tg-mood{font-size:9.5px;color:var(--t3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aff-bar{height:9px;background:var(--bg-deep);border-radius:5px;overflow:hidden;margin-top:7px;position:relative}
.aff-bar div{height:100%;border-radius:5px;transition:width 500ms ease}
.aff-nums{display:flex;justify-content:space-between;font-size:9.5px;color:var(--t3);margin-top:3px;font-family:var(--mono)}
.aff-nums b{color:var(--t2)}
.tg-detail{display:none;margin-top:9px;border-top:1px dashed var(--border);padding-top:8px}
.tg-card.open .tg-detail{display:block}
.tg-detail .d-row{font-size:10.5px;color:var(--t2);padding:2px 0;line-height:1.6}
.tg-detail .d-row .k{color:var(--t3)}
.ev-item{font-size:10px;color:var(--t2);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:6px;line-height:1.5}
.ev-item:last-child{border-bottom:none}
.ev-item .ev-t{color:var(--t3);font-family:var(--mono);font-size:9px;white-space:nowrap;flex-shrink:0}
.ev-item .ev-d{color:var(--gold)}
.ev-item .ev-m{color:var(--r)}
.ev-item .ev-n{color:var(--t3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:7px 15px;border-radius:var(--rad);font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--t2);transition:all var(--tr);white-space:nowrap}
.btn:hover{background:var(--bg-hover);color:var(--t);border-color:var(--border-active)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 12px var(--accent-glow)}
.btn.accent:hover{filter:brightness(1.1);background:var(--accent)}
.btn.gold{background:var(--gold);color:#000;border-color:var(--gold)}
.btn.gold:hover{filter:brightness(1.08)}
.btn.danger{color:var(--r);border-color:var(--r)}
.btn.danger:hover{background:var(--r);color:#fff}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.btn-row.right{justify-content:flex-end}

/* ============ Modal ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;display:none;align-items:center;justify-content:center;animation:fadeIn 200ms ease;padding:14px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:16px;padding:20px;width:500px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal h2{font-size:15px;color:var(--accent);margin-bottom:13px;letter-spacing:0.5px}
.modal label{font-size:10px;color:var(--t3);display:block;margin-bottom:3px;letter-spacing:0.6px;text-transform:uppercase}
.modal input,.modal select,.modal textarea{width:100%;margin-bottom:11px;padding:8px 11px;font-size:12.5px}
.modal .row2{display:flex;gap:6px}
.modal .row2 input{flex:1}
.modal .row2 .btn{flex-shrink:0;margin-bottom:11px}
.modal .hint{font-size:9.5px;color:var(--t3);margin-top:-8px;margin-bottom:11px;line-height:1.6}
.modal .divider{margin:14px 0 12px;border-top:1px solid var(--border)}
.mem-tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.mem-tab{padding:4px 10px;border-radius:14px;font-size:10px;border:1px solid var(--border);color:var(--t2);transition:all var(--tr)}
.mem-tab.active{border-color:var(--accent-dim);color:var(--accent);background:var(--accent-glow)}
.mem-item{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;color:var(--t2);line-height:1.65;border-left:2px solid transparent}
.mem-item:hover{background:var(--bg-hover);border-radius:var(--rad)}
.mem-item .m-meta{font-size:9px;color:var(--t3);font-family:var(--mono)}
.mem-empty{font-size:11px;color:var(--t3);text-align:center;padding:16px}

/* ============ Setup ============ */
#setup-overlay{position:fixed;inset:0;background:var(--bg-deep);z-index:300;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:26px 12px 60px}
#setup-overlay.hidden{display:none}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{position:absolute;top:-4%;width:11px;height:11px;background:var(--accent);opacity:.22;border-radius:60% 40% 55% 45%;animation:petalFall linear infinite}
@keyframes petalFall{0%{transform:translateY(-4vh) translateX(0) rotate(0)}100%{transform:translateY(104vh) translateX(60px) rotate(320deg)}}
.setup-wrap{width:470px;max-width:94vw;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
#setup-overlay h1{font-size:27px;color:var(--accent);letter-spacing:5px;margin-bottom:3px;font-weight:800}
#setup-overlay .sub{font-size:11px;color:var(--t3);margin-bottom:14px;letter-spacing:1px}
.step-dots{display:flex;gap:7px;margin-bottom:16px}
.step-dots .dot{width:9px;height:9px;border-radius:50%;background:var(--border);transition:all var(--tr)}
.step-dots .dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent-glow);transform:scale(1.25)}
.setup-box{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.create-step{display:none;flex-direction:column;gap:11px}
.create-step.active{display:flex}
.create-step .step-title{font-size:14px;font-weight:700;color:var(--t);text-align:center;letter-spacing:0.5px}
.create-step .step-hint{font-size:10.5px;color:var(--t3);text-align:center;line-height:1.6}
.create-step input[type=text],.create-step input:not([type]),.create-step input[type=password],.create-step select,.create-step textarea{width:100%;font-size:13px;padding:9px 13px;background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad2)}
.create-step textarea{resize:vertical;min-height:54px}
.create-step label{font-size:10px;color:var(--t3);display:block;margin-bottom:3px;letter-spacing:0.5px}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.option-card{padding:12px 8px;text-align:center;background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--rad2);cursor:pointer;transition:all var(--tr);font-size:11.5px;line-height:1.4}
.option-card:hover{border-color:var(--accent-dim);background:var(--bg-hover)}
.option-card.selected{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}
.option-card .oc-icon{font-size:20px;display:block;margin-bottom:3px}
.option-card .oc-name{font-weight:600}
.option-card .oc-desc{font-size:8.5px;color:var(--t3);margin-top:2px}
.seg{display:flex;gap:6px;width:100%;margin-bottom:11px}
.seg .seg-btn{flex:1;padding:8px 6px;text-align:center;background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--rad2);font-size:12px;color:var(--t2);transition:all var(--tr)}
.seg .seg-btn.selected{border-color:var(--accent);background:var(--accent-glow);color:var(--accent);font-weight:600}
.trait-setup .trait-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.trait-setup .trait-row .t-icon{font-size:16px;width:24px;text-align:center}
.trait-setup .trait-row .t-info{flex:1}
.trait-setup .trait-row .t-name{font-size:11.5px;font-weight:600}
.trait-setup .trait-row .t-desc{font-size:8.5px;color:var(--t3)}
.trait-setup .trait-row .t-ctrl{display:flex;align-items:center;gap:7px}
.trait-setup .trait-row .t-ctrl button{width:27px;height:27px;border-radius:50%;border:1px solid var(--border-active);color:var(--accent);font-size:15px;font-weight:700;line-height:1;transition:all var(--tr)}
.trait-setup .trait-row .t-ctrl button:hover{background:var(--accent-glow);border-color:var(--accent)}
.trait-setup .trait-row .t-ctrl button:disabled{opacity:0.25;cursor:not-allowed}
.trait-setup .trait-row .t-val{width:24px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--t)}
.points-left{font-size:12px;color:var(--accent);font-weight:700;text-align:center}
.cheat-toggle{padding:4px 12px;border-radius:14px;font-size:10.5px;border:1px dashed var(--gold-dim);color:var(--gold);transition:all var(--tr);cursor:pointer}
.cheat-toggle:hover{background:var(--gold-glow)}
.cheat-toggle.on{background:var(--gold);color:#000;border-style:solid;font-weight:700;box-shadow:0 0 10px var(--gold-glow)}
.create-nav{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.create-nav button{padding:10px 26px;border-radius:var(--rad2);font-size:13px;font-weight:600;transition:all var(--tr)}
.create-nav .btn-prev{background:transparent;border:1px solid var(--border);color:var(--t2)}
.create-nav .btn-prev:hover{background:var(--bg-hover);color:var(--t)}
.create-nav .btn-next{background:var(--accent);color:#fff;border:1px solid var(--accent);box-shadow:0 2px 14px var(--accent-glow)}
.create-nav .btn-next:hover{filter:brightness(1.1)}
/* 攻略对象 */
#target-list{display:flex;flex-direction:column;gap:7px}
.tg-edit{display:flex;align-items:center;gap:9px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:9px 11px;font-size:11.5px}
.tg-edit .tg-e-info{flex:1;min-width:0}
.tg-edit .tg-e-name{font-weight:700;font-size:12px}
.tg-edit .tg-e-sub{font-size:9.5px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg-edit .rm{color:var(--r);font-size:13px;padding:4px 7px;border-radius:50%}
.tg-edit .rm:hover{background:var(--r);color:#fff}
.target-form{background:var(--bg-elevated);border:1px dashed var(--border-active);border-radius:var(--rad2);padding:13px;display:none;flex-direction:column;gap:8px}
.target-form.show{display:flex}
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tf-grid .full{grid-column:1/-1}
.tf-grid label{font-size:9.5px;color:var(--t3);display:block;margin-bottom:2px}
.tf-grid input,.tf-grid select,.tf-grid textarea{width:100%;font-size:12px;padding:7px 10px;margin-bottom:9px;background:var(--bg-deep);border:1px solid var(--border);border-radius:var(--rad)}
.tf-grid textarea{min-height:44px}
.tf-grid .seg{margin-bottom:9px}
.tf-grid .seg .seg-btn{padding:6px 4px;font-size:11px}
/* 开始页 */
.ready-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:11px;font-size:11px;line-height:1.7;color:var(--t2)}
.ready-card b{color:var(--t)}
.ready-card .rc-h{font-size:10px;color:var(--accent);font-weight:700;letter-spacing:1px;margin-bottom:5px}

/* ============ Toast ============ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--border-active);padding:9px 18px;border-radius:20px;font-size:12.5px;z-index:500;pointer-events:none;opacity:0;transition:opacity 300ms,transform 300ms;box-shadow:var(--shadow);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast.success{border-color:var(--gr);color:var(--gr)}
#toast.error{border-color:var(--r);color:var(--r)}

/* ============ Responsive ============ */
@media (max-width:720px){
  #topbar{padding:0 8px;gap:6px}
  #topbar .logo span{display:none}
  .btn-txt{display:none}
  .top-btn{padding:6px 10px}
  #game-log{padding:12px 12px}
  .quick-actions{flex-wrap:nowrap;overflow-x:auto;padding:8px 12px 0;-webkit-overflow-scrolling:touch}
  .quick-actions::-webkit-scrollbar{display:none}
  .quick-action{flex-shrink:0}
  #left-panel{width:min(94vw,var(--drawer-w))}
  .chip-loc{display:none}
  .tf-grid{grid-template-columns:1fr}
  input,textarea,select{font-size:16px}
  .create-step input[type=text],.create-step input:not([type]),.create-step input[type=password],.create-step select,.create-step textarea{font-size:16px}
}
</style>

/* ================= 工具 ================= */

const RP_RULES=`【角色扮演质量规则】

/* ================= 日志 ================= */
function scrollLog(){const g=$('game-log');g.scrollTop=g.scrollHeight;}
function appendEntry(type,html,cls){
  // 思考过程使用 <details> 原生折叠
  const tag=type==='think'?'details':'div';
  const div=document.createElement(tag);
  div.className='log-entry '+type+(cls?' '+cls:'');
  if(type==='think')div.open=true;
  if(html!==undefined)div.innerHTML=html;
  $('game-log').appendChild(div);
  scrollLog();
  return div;
}
function pushLog(type,html){state.log.push({type,html});if(state.log.length>400)state.log.splice(0,state.log.length-400);}
function addLog(type,html){const el=appendEntry(type,html);pushLog(type,html);return el;}
function removeLastEntry(){const g=$('game-log');const el=g.lastElementChild;if(el&&el.classList.contains('log-entry'))el.remove();state.log.pop();}
function renderLog(){
  const g=$('game-log');g.innerHTML='';
  state.log.forEach(l=>{
    const tag=l.type==='think'?'details':'div';
    const div=document.createElement(tag);
    div.className='log-entry '+l.type;
    if(l.type==='think')div.open=true;
    div.innerHTML=l.html;
    g.appendChild(div);
  });
  scrollLog();
}

/* ================= 好感度 / 状态更新 ================= */
function findTarget(name){
  if(!name)return null;
  const n=String(name).trim();
  return state.targets.find(t=>t.name===n)||state.targets.find(t=>t.name.includes(n)||n.includes(t.name));
}
function stageOf(a){
  if(a<15)return '陌生人';
  if(a<35)return '初识';
  if(a<55)return '同学';
  if(a<70)return '朋友';
  if(a<85)return '好友';
  return '暧昧';
}
function affColor(v){return v<20?'var(--t3)':v<40?'#5aa7ff':v<60?'#ffb454':v<85?'var(--accent)':'#ff2e63';}
function addMemory(type,text){
  if(!text)return;
  const t=String(text).trim();
  if(state.memories.some(m=>m.text===t||(t.length>16&&m.text.includes(t.slice(0,16)))))return;
  state.memories.unshift({type,text:t,time:state.time});
  if(state.memories.length>200)state.memories.length=200;
}
function targetEvent(t,text,delta){
  t.events=t.events||[];
  t.events.unshift({time:state.time,text,delta});
  if(t.events.length>60)t.events.length=60;
}
function applyStatus(d){
  if(!d||typeof d!=='object')return;
  const targetName=k=>{const t=findTarget(k);return t?t.name:null;};
  // 好感/信任/熟悉
  ['affection','trust','familiar'].forEach(field=>{
    const map=d[field];
    if(!map||typeof map!=='object')return;
    for(const k in map){
      const t=findTarget(k);
      if(!t)continue;
      const dlt=Math.round(Number(map[k])||0);
      if(!dlt)continue;
      const old=t[field];
      t[field]=clamp(old+dlt,0,100);
      const real=t[field]-old;
      if(!real)continue;
      const labels={affection:'好感度',trust:'信任',familiar:'熟悉'};
      const f=labels[field];
      targetEvent(t,`${f} ${real>0?'+':''}${real}（${t[field]}）`,real);
      if(field==='affection'){
        const oldStage=stageOf(old),newStage=stageOf(t[field]);
        if(newStage!==oldStage){
          t.stage=newStage;
          targetEvent(t,`关系阶段 →「${newStage}」`,0);
          addMemory('关系',`与${t.name}的关系阶段变为「${newStage}」`);
          addLog('stat',`💗 与${esc(t.name)}的关系阶段变为「${esc(newStage)}」`);
        }
        if(Math.abs(real)>=5)UI.toast(`💗 ${t.name} ${f} ${real>0?'+':''}${real}（${t[field]}）`,'success');
      }
    }
  });
  // 关系阶段（AI直接指定）
  if(d.stage&&typeof d.stage==='object'){
    for(const k in d.stage){
      const t=findTarget(k);
      if(!t)continue;
      const ns=String(d.stage[k]).trim();
      if(ns&&ns!==t.stage){
        t.stage=ns;
        targetEvent(t,`关系阶段 →「${ns}」`,0);
        addMemory('关系',`与${t.name}的关系阶段变为「${ns}」`);
        addLog('stat',`💗 与${esc(t.name)}的关系阶段变为「${esc(ns)}」`);
      }
    }
  }
  // 心情
  if(d.mood&&typeof d.mood==='object'){
    for(const k in d.mood){const t=findTarget(k);if(t)t.mood=String(d.mood[k]).trim()||t.mood;}
  }
  // 时间地点
  if(d.time&&typeof d.time==='string'&&d.time.trim()){
    state.time=d.time.trim();
    const m=state.time.match(/第(\d+)天/);
    if(m)state.day=parseInt(m[1]);
  }
  if(d.location&&typeof d.location==='string'&&d.location.trim())state.location=d.location.trim();
  // 记忆
  if(Array.isArray(d.memory)){
    d.memory.forEach(m=>{
      const s=String(m).trim();if(!s)return;
      let type='事件';
      if(/约定|答应|说好|约好|承诺/.test(s))type='约定';
      else if(/秘密|不告诉|别让/.test(s))type='人物';
      else if(/喜欢|讨厌|害怕|开心|难过|心动|害羞/.test(s))type='情感';
      else if(/礼物|买了|收到|丢|找到|送/.test(s))type='物品';
      else if(/在|去了|来到|离开/.test(s)&&/教室|食堂|操场|天台|图书馆|校门|社团/.test(s))type='地点';
      addMemory(type,s);
    });
  }
  // 故事摘要
  if(d.summary&&typeof d.summary==='string'){
    const s=d.summary.trim();
    if(s){state.storySummary=(state.storySummary?state.storySummary+'\n':'')+`（${state.time}）${s}`;if(state.storySummary.length>4000)state.storySummary=state.storySummary.slice(-4000);}
  }
  updateChips();
}
function updateChips(){
  $('time-chip').textContent='📅 '+state.time;
  $('loc-chip').textContent='📍 '+state.location;
}

/* ================= API ================= */
async function callAI(messages,opts={}){
  const c=Object.assign({},DEFAULTS,cfg);
  if(!c.apiKey){if(!opts.silent)addLog('system','❌ 请先在设置中配置 API Key。');return null;}
  const body={model:c.model,messages,temperature:0.9,stream:!!opts.onChunk};
  const mt=c.maxTokens;
  if(mt&&mt!=='unlimited')body.max_tokens=parseInt(mt);
  if(/reasoner/.test(c.model))body.reasoning_effort=c.reasoningEffort||'medium';
  try{
    const r=await fetch(c.apiEndpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.apiKey},
      body:JSON.stringify(body),
      signal:opts.signal
    });
    if(!r.ok){
      let msg='HTTP '+r.status;
      try{const e=await r.text();try{msg=JSON.parse(e).error?.message||msg}catch(_){msg=e.slice(0,200)||msg}}catch(_){}
      if(!opts.silent)addLog('system','❌ API错误：'+esc(msg));
      return null;
    }
    if(opts.onChunk)return readStream(r,opts.onChunk);
    const d=await r.json();
    const ch=d.choices&&d.choices[0];
    if(!ch){if(!opts.silent)addLog('system','❌ API返回空响应。');return null;}
    return {reasoning:ch.message?.reasoning_content||'',content:ch.message?.content||''};
  }catch(e){
    if(opts.signal&&opts.signal.aborted)return null; // 用户主动停止，静默返回
    if(!opts.silent)addLog('system','❌ 网络错误：'+esc(e.message||e));
    return null;
  }
}
async function readStream(response,onChunk){
  const reader=response.body.getReader();
  const decoder=new TextDecoder();
  let full='',buf='';
  try{
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop()||'';
      for(const line of lines){
        const s=line.trim();
        if(!s||s==='[DONE]')continue;
        let data='';
        if(s.startsWith('data: '))data=s.slice(6);
        else if(s.startsWith('data:'))data=s.slice(5);
        else continue;
        if(data==='[DONE]')continue;
        try{
          const j=JSON.parse(data);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(d){
            if(d.reasoning_content){full+='';onChunk({type:'reasoning',text:d.reasoning_content});}
            if(d.content){full+=d.content;onChunk({type:'content',text:d.content});}
          }
        }catch(e){}
      }
    }
  }finally{try{reader.releaseLock()}catch(e){}}
  return {reasoning:'',content:full};
}

/* ================= 状态块解析 ================= */
function parseStatus(content){
  let data=null,clean=content;
  const re=/⟦STATUS⟧([\s\S]*?)⟦\/STATUS⟧/g;
  const parts=content.split(re);
  if(parts.length>1){
    clean=parts.filter((_,i)=>i%2===0).join('').trim();
    for(let i=1;i<parts.length;i+=2){
      try{data=JSON.parse(parts[i].trim());if(data&&typeof data==='object')break;}catch(e){}
    }
  }
  if(!data){
    const mm=content.match(/\{[\s\S]*\}\s*$/);
    if(mm){
      try{
        const o=JSON.parse(mm[0]);
        if(o&&typeof o==='object'&&(o.affection||o.memory||o.time||o.stage||o.mood)){
          data=o;clean=content.slice(0,mm.index).trim();
        }
      }catch(e){}
    }
  }
  return {clean,data};
}

/* ================= 记忆压缩 ================= */
async function compressHistory(){
  if(compressing||!state||state.history.length<=MAX_HISTORY)return;
  compressing=true;
  try{
    const keep=state.history.slice(-16);
    const old=state.history.slice(0,-16);
    const oldText=old.map(m=>(m.role==='user'?'【你】':'【对方】')+m.content).join('\n').slice(-14000);
    addLog('system','📎 记忆整理中：长对话正在压缩进故事摘要…');
    const res=await callAI([
      {role:'system',content:'你是故事摘要整理器。根据旧摘要与新增对话，生成更新后的故事摘要：保留人物关系、好感度变化、重要事件、约定、秘密与情绪变化，用第三人称简洁叙述，300字以内，只输出摘要正文，不要任何解释。'},
      {role:'user',content:'旧摘要：\n'+(state.storySummary||'(无)')+'\n\n新增对话：\n'+oldText}
    ],{silent:true});
    if(res&&res.content&&res.content.trim()){
      const c=res.content.trim().replace(/⟦STATUS⟧[\s\S]*?⟦\/STATUS⟧/g,'').trim();
      if(c)state.storySummary=c;
      addLog('system','✅ 记忆整理完成，故事摘要已更新。');
    }else{
      state.storySummary=(state.storySummary?state.storySummary+'\n':'')+'（对话过多，较早的日常细节已归档到记忆档案）';
      addLog('system','⚠️ 摘要整理失败，较早对话已归档。');
    }
    state.history=keep;
    saveState();
  }finally{compressing=false;}
}

    if(!isRegen)addLog('action','<span class="who pl">你</span>：'+nl2br(text));

    this.setBusy(true);
    const streamEl=appendEntry('narrative','','streaming');

    }}).then(res=>{
      const aborted=this.genController?this.genController.signal.aborted:false;
      this.genController=null;
      this.setBusy(false);

        // 失败或停止：撤销本条玩家动作，保持剧情一致
        if(streamThinkEl){streamThinkEl.remove();streamThinkEl=null;}
        streamEl.remove();
        if(!isRegen)removeLastEntry(); // action
        state.history.pop();
        $('user-input').value=this.lastUserText||'';

        UI.toast(aborted?'⏹ 已停止生成':'❌ 生成失败，输入已恢复');

      }
      const {clean,data}=parseStatus(res.content);

      streamEl.classList.remove('streaming');
      streamEl.innerHTML='<span class="who ai">✦ 场景</span><br>'+finalHtml;

  fetchSettingsModels(){
    const key=$('s-apikey').value.trim();
    if(!key){this.toast('请先填写 API Key','error');return;}
    const ep=($('s-endpoint').value.trim()||DEFAULTS.apiEndpoint).replace(/\/+$/,'');
    fetch(ep.replace(/\/chat\/completions$/,'/models'),{headers:{'Authorization':'Bearer '+key}})
      .then(async r=>{
        if(!r.ok)throw new Error('HTTP '+r.status);
        const d=await r.json();
        const list=(d.data||[]).map(m=>m.id);
        if(!list.length)throw new Error('empty');
        const sel=$('s-model');
        sel.value=list.includes($('s-model').value)?$('s-model').value:list[0];
        this.toast('✅ 已获取 '+list.length+' 个模型，请选择','success');
        sel.placeholder=list.slice(0,8).join(', ');
        sel.title=list.join('\n');
      })
      .catch(e=>this.toast('❌ 拉取失败：'+e.message,'error'));
  },
  saveSettings(){
    cfg.apiEndpoint=$('s-endpoint').value.trim()||DEFAULTS.apiEndpoint;
    cfg.apiKey=$('s-apikey').value.trim();
    cfg.model=$('s-model').value.trim()||'deepseek-chat';
    cfg.reasoningEffort=$('s-reasoning').value;
    cfg.maxTokens=$('s-maxtokens').value;
    cfg.theme=$('s-theme').value;
    cfg.contentMode=$('s-contentmode').value;
    lsSet('sakura_cfg',cfg);
    this.applyTheme(cfg.theme);
    this.updateAdultBadge();
    this.closeModal('settings-modal');
    this.toast('✅ 设置已保存','success');
  }
};

/* ================= 输入框 ================= */
function autoGrow(){
  const el=$('user-input');
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,110)+'px';
}
$('user-input').addEventListener('input',autoGrow);
$('user-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();Game.send();}
});
$('import-file').addEventListener('change',e=>Game.handleImport(e));
$('cf-ok').addEventListener('click',()=>{
  UI.closeModal('confirm-modal');
  if(window._cfOk){const fn=window._cfOk;window._cfOk=null;fn();}
});

/* ================= 启动 ================= */
(function boot(){
  UI.applyTheme(cfg.theme);
  UI.updateAdultBadge();
  UI.initSetup();
  const saved=lsGet('sakura_state',null);
  if(saved&&saved.player&&Array.isArray(saved.targets)){
    state=saved;
    state.history=state.history||[];
    state.memories=state.memories||[];
    state.log=state.log||[];
    state.storySummary=state.storySummary||'';
    state.targets.forEach(t=>{t.events=t.events||[];t.color=t.color||AVATAR_COLORS[0];});
    UI.enterGame();
    setTimeout(()=>UI.toast('🌸 已恢复上次的游戏进度','success'),400);
  }else{
    UI.goStep(0);
  }
})();
</script>
