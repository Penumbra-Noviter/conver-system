<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>《混社会模拟器》AI角色扮演游戏</title>
<style>
/* ============ 主题变量 ============ */
:root,[data-theme="neon"]{--bg:#08081a;--bg2:#0c0f24;--panel:#0e1128;--card:#121636;--border:#1e2447;--border2:#2a3158;--t:#e8ecff;--t2:#9aa3cc;--t3:#5f6894;--accent:#00d4f0;--accent-dim:rgba(0,212,240,.13);--on-accent:#06121a;--gold:#f0b429;--good:#2ee6a8;--bad:#ff4d6d;--bad-dim:rgba(255,77,109,.09);--user-bg:#13304a;--rad:10px}
[data-theme="casino"]{--bg:#0a0812;--bg2:#0f0d1a;--panel:#12101f;--card:#181528;--border:#2a2340;--border2:#3a3058;--t:#f0e9d8;--t2:#a89fc0;--t3:#6b6390;--accent:#f0a828;--accent-dim:rgba(240,168,40,.13);--on-accent:#221500;--gold:#f0a828;--good:#40c8a0;--bad:#ff5d5d;--bad-dim:rgba(255,93,93,.09);--user-bg:#2a1f10;--rad:10px}
[data-theme="ink"]{--bg:#0e0d0f;--bg2:#141317;--panel:#17161b;--card:#1e1c24;--border:#2b2833;--border2:#3b3747;--t:#e8e2d4;--t2:#a49c8a;--t3:#6d6657;--accent:#e05a4e;--accent-dim:rgba(224,90,78,.13);--on-accent:#fff;--gold:#d9b36c;--good:#7fb069;--bad:#c0392b;--bad-dim:rgba(192,57,43,.1);--user-bg:#2b1a16;--rad:10px}
[data-theme="paper"]{--bg:#f2f0ea;--bg2:#eae7df;--panel:#faf9f5;--card:#fff;--border:#d8d4c8;--border2:#c4bfb0;--t:#23201a;--t2:#6d675c;--t3:#9a9387;--accent:#9a3412;--accent-dim:rgba(154,52,18,.09);--on-accent:#fff;--gold:#a16207;--good:#1f7a4d;--bad:#b91c1c;--bad-dim:rgba(185,28,28,.07);--user-bg:#efe5d4;--rad:10px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);font-size:14px;overflow:hidden}
button{font-family:inherit}
input,select,textarea{font-family:inherit;background:var(--bg2);color:var(--t);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:92px;line-height:1.6}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.btn{padding:7px 15px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--t);font-size:12.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-accent);font-weight:600}
.btn.gold:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.bad:hover{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center}
.row .btn{flex:0 0 auto}
.hint{font-size:11px;color:var(--t3);margin:2px 0 8px;line-height:1.6}
label{font-size:11px;color:var(--t2);display:block;margin:10px 0 4px;letter-spacing:.4px}
.check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--t2);cursor:pointer;margin:0}
.check input{width:auto;margin:0}
/* ============ 顶栏 ============ */
.topbar{position:fixed;top:0;left:0;right:0;height:50px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:60}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0}
.tb-btn{display:flex;align-items:center;gap:5px;background:var(--accent-dim);border:1px solid var(--border2);color:var(--accent);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.tb-btn:hover{border-color:var(--accent)}
.tb-title{font-weight:800;font-size:15px;letter-spacing:1px;color:var(--t);line-height:1.1}
.tb-title .sub{display:block;font-size:8.5px;color:var(--t3);font-weight:400;letter-spacing:2.5px}
.tb-chips{display:flex;gap:6px;margin-left:auto;overflow:hidden}
.chip{font-size:11px;color:var(--t2);background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.hot{color:var(--bad);border-color:var(--bad)}
.chip.gold{color:var(--gold);border-color:var(--border2)}
.tb-right{display:flex;gap:2px}
.tb-right .tb-btn{padding:6px 9px;font-size:12px;font-weight:500;background:transparent;border-color:transparent;color:var(--t2)}
.tb-right .tb-btn:hover{color:var(--t);background:var(--bg2);border-color:var(--border)}
/* ============ 抽屉 ============ */
.drawer{position:fixed;top:0;bottom:0;width:340px;max-width:88vw;background:var(--panel);border-right:1px solid var(--border);z-index:80;transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:8px 0 40px rgba(0,0,0,.35)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 11px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.drawer-head button{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:4px}
.drawer-head button:hover{color:var(--bad)}
.drawer-body{overflow-y:auto;padding:14px 16px;flex:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
/* ============ 聊天区 ============ */
.chat-wrap{position:fixed;top:50px;left:0;right:0;bottom:0;display:flex;flex-direction:column}
.chat-header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--border);background:var(--bg2);font-size:12px;color:var(--t2);flex-wrap:wrap}
.chat-header b{color:var(--t)}
.chat{flex:1;overflow-y:auto;padding:16px 14px 10px}
.chat-inner{max-width:840px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg.ai{display:flex;flex-direction:column;gap:4px}
.msg.ai .tag{font-size:10.5px;color:var(--t3);letter-spacing:.5px}
.msg.ai .ai-body{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--rad);padding:12px 15px;line-height:1.85;font-size:13.5px}
.msg.ai .ai-body b{color:var(--accent)}
.msg.ai .ai-body code{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:0 5px;font-size:12px;color:var(--gold)}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--user-bg);border:1px solid var(--border2);border-radius:12px 12px 3px 12px;padding:9px 14px;max-width:80%;line-height:1.7;font-size:13.5px}
.msg.sys{display:flex;justify-content:center}
.msg.sys div{display:inline-block;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:4px 14px;font-size:11.5px;color:var(--t3)}
.typing{display:inline-flex;gap:4px;align-items:center;margin-left:8px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--t3);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:1}}
/* ============ 输入区 ============ */
.input-bar{background:var(--bg2);border-top:1px solid var(--border);padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q-btn{flex:0 0 auto;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--border);color:var(--t2);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .12s}
.q-btn:hover{color:var(--accent);border-color:var(--accent)}
.q-btn.cheat-q{color:var(--gold)}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:11px 14px;border-radius:var(--rad);font-size:14px}
.input-row .send{background:var(--accent);color:var(--on-accent);font-weight:700;border:none;border-radius:var(--rad);padding:0 22px;font-size:14px;cursor:pointer;flex:0 0 auto}
.input-row .send:disabled{opacity:.5;cursor:not-allowed}
/* ============ 弹窗 ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:14px}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:14px;padding:18px;width:540px;max-width:97vw;max-height:88vh;overflow-y:auto;box-shadow:0 12px 50px rgba(0,0,0,.55);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h2{font-size:15px;margin-bottom:12px}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sep{border-top:1px solid var(--border);margin:14px 0;padding-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{font-size:11.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--t2);cursor:pointer}
.tab.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.ency-body{font-size:12.5px;line-height:1.85;color:var(--t2)}
.ency-body h4{color:var(--accent);margin:12px 0 4px;font-size:13px}
.ency-body table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11.5px}
.ency-body th,.ency-body td{border:1px solid var(--border);padding:5px 7px;text-align:left}
.ency-body th{background:var(--bg2);color:var(--t2);font-weight:600}
.ency-body b{color:var(--t)}
/* ============ 向导 ============ */
.wizard{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:18px}
.wiz-inner{width:660px;max-width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.wiz-head{text-align:center;padding-top:14px}
.wiz-title{font-size:28px;font-weight:900;letter-spacing:5px;color:var(--accent)}
.wiz-sub{font-size:12px;color:var(--t3);margin-top:5px;letter-spacing:2.5px}
.wiz-steps{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.wiz-step{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t3);background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:4px 11px}
.wiz-step span{width:17px;height:17px;border-radius:50%;background:var(--border2);color:var(--bg);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.wiz-step.on{color:var(--accent);border-color:var(--accent)}
.wiz-step.on span{background:var(--accent);color:var(--on-accent)}
.wiz-step.done{color:var(--good);border-color:var(--good)}
.wiz-step.done span{background:var(--good);color:var(--on-accent)}
.wiz-body{display:flex;flex-direction:column;gap:12px}
.wiz-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}
.wiz-card h3{font-size:16px;margin-bottom:4px}
.wiz-desc{font-size:12px;color:var(--t3);line-height:1.75;margin-bottom:4px}
.wiz-foot{display:flex;justify-content:space-between;gap:10px}
.wiz-foot .btn{padding:10px 28px;font-size:14px}
.attr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin-top:8px}
.attr-row{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
.attr-name{font-size:12px;flex:1;white-space:nowrap}
.attr-val{font-size:13px;font-weight:700;min-width:26px;text-align:center;color:var(--accent)}
.stepper{width:23px;height:23px;border-radius:6px;border:1px solid var(--border);background:var(--panel);color:var(--t2);cursor:pointer;font-size:15px;line-height:1;flex:0 0 auto}
.stepper:hover{color:var(--accent);border-color:var(--accent)}
.budget{font-size:12px;color:var(--t2);margin-top:8px}
.budget b{color:var(--gold);font-size:14px}
.talent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:8px;margin-top:8px}
.talent{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;cursor:pointer;transition:all .12s}
.talent:hover{border-color:var(--accent)}
.talent.on{border-color:var(--accent);background:var(--accent-dim)}
.talent.dis{opacity:.35;pointer-events:none}
.t-name{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.t-cost{font-size:10px;color:var(--gold);font-weight:600}
.t-eff{font-size:11.5px;color:var(--t2);line-height:1.5;margin-top:3px}
.t-g{font-size:10px;color:var(--t3);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{font-size:12px;border:1px solid var(--border);background:var(--bg2);color:var(--t2);border-radius:999px;padding:4px 13px;cursor:pointer;transition:all .12s}
.tchip.on{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.diff-card{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 15px;cursor:pointer;margin-bottom:8px;transition:all .12s}
.diff-card:hover{border-color:var(--border2)}
.diff-card.on{border-color:var(--accent);background:var(--accent-dim)}
.diff-name{font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.diff-desc{font-size:12px;color:var(--t2);margin:3px 0 6px}
.diff-params{font-size:11px;color:var(--t3);line-height:1.85}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;font-size:12.5px}
.sum-grid .k{color:var(--t3)}
.sum-grid .v{color:var(--t);font-weight:600;word-break:break-all}
/* ============ 角色面板 ============ */
.cp-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--gold));color:var(--on-accent);font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cp-name{font-size:17px;font-weight:800}
.cp-sub{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.5}
.cp-rank{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px;margin-left:auto;white-space:nowrap}
.cp-sec{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.cp-sec h4{font-size:12px;color:var(--accent);margin-bottom:9px;letter-spacing:1px}
.cp-sec p{font-size:12px;line-height:1.7;color:var(--t2)}
.bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.stat-row .lb{width:46px;color:var(--t2);flex:0 0 auto}
.stat-row .vl{width:36px;text-align:right;font-weight:700;font-size:11.5px;flex:0 0 auto}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 11px}
.res-item .rv{font-size:15px;font-weight:800;color:var(--gold)}
.res-item .rk{font-size:10.5px;color:var(--t3);margin-top:1px}
.skill-row,.rel-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:7px}
.skill-row .lb{width:66px;color:var(--t2);flex:0 0 auto}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border2)}
.dots i.on{background:var(--gold)}
.rel-name{font-weight:600;white-space:nowrap}
.rel-tag{font-size:10px;color:var(--t3)}
.rel-note{font-size:11px;color:var(--t3);margin-left:auto;text-align:right;max-width:46%;line-height:1.5}
.badge{display:inline-block;font-size:10.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--border2);color:var(--t2)}
.badge.good{color:var(--good);border-color:var(--good)}
.badge.bad{color:var(--bad);border-color:var(--bad)}
/* ============ 死亡/回档 ============ */
.death-title{color:var(--bad);font-size:19px;text-align:center;letter-spacing:3px}
.death-card{border:1px solid var(--bad);border-radius:12px;background:var(--bad-dim);padding:12px 14px;margin-top:10px}
.death-card h4{font-size:12px;color:var(--bad);margin-bottom:6px}
.death-card p{font-size:12.5px;line-height:1.8;color:var(--t)}
.d-review{border:1px solid var(--gold);border-radius:12px;background:rgba(240,180,41,.07);padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.8}
.d-review h4{font-size:12px;color:var(--gold);margin-bottom:6px}
.death-list .rec{border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:9px;background:var(--bg2)}
.rec-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t2);margin-bottom:5px}
.rec-head b{color:var(--bad)}
.rec-reason{font-size:13px;font-weight:700;color:var(--t);margin-bottom:4px}
.rec-review{font-size:12px;color:var(--t2);line-height:1.7;margin-bottom:8px}
.cp-item{border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-bottom:8px;background:var(--bg2)}
.cp-item .t{font-size:13px;font-weight:700;color:var(--accent)}
.cp-item .s{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.6}
/* ============ Toast ============ */
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--border2);color:var(--t);font-size:12.5px;padding:8px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:pop .18s ease;max-width:92vw;transition:opacity .3s}
.toast.ok{border-color:var(--good);color:var(--good)}
.toast.err{border-color:var(--bad);color:var(--bad)}
.toast.warn{border-color:var(--gold);color:var(--gold)}
/* ============ 移动端 ============ */
@media(max-width:760px){
.tb-title{font-size:13px}
.tb-title .sub{display:none}
.chip.hide-m{display:none}
.tb-right .tb-btn span{display:none}
.tb-right .tb-btn{padding:6px 8px}
.drawer{width:87vw}
.msg.user .bubble{max-width:88%}
.wiz-title{font-size:22px;letter-spacing:3px}
.sum-grid{grid-template-columns:1fr}
.modal{padding:14px}
.attr-grid{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
.talent-grid{grid-template-columns:1fr 1fr}
.talent-grid .talent{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ============ v2 视觉优化 ============ */
.topbar{height:52px;padding:0 14px;gap:6px}
.tb-btn{border-radius:9px;padding:6px 10px;font-size:12px}
.tb-right .tb-btn{background:transparent;border:1px solid transparent;color:var(--t2);padding:6px 9px;font-weight:500}
.tb-right .tb-btn:hover{background:var(--bg2);border-color:var(--border);color:var(--t)}
.tb-title{font-size:14px;letter-spacing:2px}
.tb-title .sub{font-size:8px;letter-spacing:3px}
.chip{background:var(--bg2);border:1px solid var(--border);padding:3px 10px;font-size:10.5px}
.chip.gold{color:var(--gold)}
.chat-header{background:transparent;padding:7px 18px;font-size:11.5px;border-bottom:1px solid var(--border)}
.chat-inner{max-width:860px;gap:16px}

.cp-sec h4::after{content:'';display:block;width:22px;height:2px;background:var(--accent);opacity:.55;border-radius:2px;margin-top:5px}
.stat-row .lb{color:var(--t3)}
.bar{background:var(--bg)}
.st-desc{font-size:10px;color:var(--t3);white-space:nowrap}
.res-item{background:var(--bg2)}

<script>
'use strict';
/* ============================================================
   《混社会模拟器》AI 角色扮演游戏 —— 单文件版
   世界观与设定：设计文档 v1.0（临江市 · 三面世界 · 帮派 · 行动 · 结局）
   ============================================================ */

/* ---------- 常量 ---------- */
const LS_CFG='hsh_cfg_v1', LS_SAVE='hsh_save_v1';
const NAMES=['陈默','林小北','周铁','阿豪','李飞','王胖子','赵六','韩东','沈青','顾言','吴畏','方一鸣','许大壮','小五','何斌'];

const RULES='【角色扮演质量规则】保持现实逻辑与人物边界感。NPC只能依据亲眼所见、亲耳所闻、公开信息或合理信息来源获取情报，禁止全知视角、读心、监视和未观察先知晓。禁止代替玩家行动、发言、思考或做出选择。禁止时间错乱、空间错位、人物瞬移、物品分身和设定遗忘。禁止重复使用网络小说模板动作、套路台词、霸总文学、解释性旁白和自我感动式抒情。禁止通过反复强调塑造人设。剧情应通过人物行为、对话和事件自然推进，不得依赖酒会、会议、晚宴、应酬、出差等强行推动。人物情绪应通过具体行为和对话体现，而非旁白解释。\n以上守则必须严格遵守，违反即失败。';

const WORLD='【临江市（架空城市，与现实无关）】东南沿海现代大都市，人口约850万，港口贸易发达、贫富差距巨大。移动支付普及、天网监控覆盖、外卖与短视频直播盛行——方便与危险并存。城区：市中心CBD（白面核心）；老城区（传统江湖，青龙帮地盘）；城中村（底层聚集，鱼龙混杂）；工业区（物流、走私通道）；港口码头（货运、黑市入口）；大学城（年轻人、白面机会）；郊区（半公开"赌城"，灰色地带）。\n【三面世界】白面=秩序世界（写字楼/商场/学校/警局），赚得少但安全，开局即有；灰面=人情与利益交织（夜总会/棋牌室/大排档/劳务市场），多数玩家的主战场，开局即有；黑面=法外之地（地下赌场/黑市/码头仓库/废弃厂房），暴利与暴死并存，声望达到"小有名气"后解锁。\n【底层逻辑】1.钱是通行证：没钱寸步难行，但钱分黑钱与白钱，黑钱不能直接买房买车，需要洗白（开公司、买店铺、赌博走账，有损耗）。2.关系是护身符：认识谁比你有理更有用，一个人干不成大事。3.拳头是最后的道理：但现代社会拳头代价极高——监控、报警、扫黑除恶。4.名声是复利：好名声让资源自动找上门，坏名声让警察自动找上门。\n【时间线】玩家18岁开局：起步期18~20挣扎求生；上升期21~25站住脚；巅峰期26~35一方大佬；结局期35+终局。\n【江湖四大帮派】青龙帮=老派传统讲规矩讲辈分，赌场/码头/货运，地盘老城区与码头；城南帮=新生代敢打敢拼没底线，夜场/暴力收债，地盘城南与城中村；金链会=半黑半商有钱有势，夜总会/KTV/娱乐，CBD外围；沙帮=移民抱团走私高手，走私/黑市，港口与郊区。玩家开局不属于任何帮派：可加入一方（庇护+任务+分红，但受帮规约束）、保持独立（自由但危险）或后期称霸（策反、火并、吞并）。\n【官方力量】辖区派出所（威胁★）：日常盘查、打架斗殴；刑警队（★★★）：命案大案必出动；缉毒缉私队（★★★★）：碰毒碰私必遭重拳；扫黑除恶专案组（★★★★★）：后期大Boss，会清剿整个江湖。非法路线越走越窄，逼玩家转型（洗白/经营/跑路）是本作核心张力。\n【中立势力】马爷=放贷人（急用钱，高利息，还不上会被上门）；铁嘴张=律师（捞人打官司，收费极高）；白神医=黑医（治刀伤枪伤不报警，收费贵欠人情）；孙姐=中介（买房洗白介绍生意，抽成）；猴三=情报贩子（买消息买删监控，贵且真假难辨）；陈记者=媒体人（捧你或毁你，可能反噬）。\n【常见行动】合法：打工（外卖/快递/保安，少而稳定）、摆摊开网店（需本金）、考文凭学技能。灰色：看场子（涨义气声望）、当中间人赚中介费（靠口才）、收小额保护费（涨恶名）、放高利贷（收不回来就得打人）、黄牛倒票代排队、乞讨（掉尊严攒情报）。非法：扒窃偷盗（敏捷判定）、抢劫（可能直接上大案）、收债打手（结仇）、地下赌场（可能输到欠债）、走私（缉私队盯着）、毒品（红线：一旦碰，警察永追到底）。收益越大风险越大：风险=被抓概率+结仇概率+声望影响+道德/压力影响。\n【犯罪与惩罚闭环】非法行动→通缉热度上升→街面盘查变多→被抓判定→审讯三选一：老实认罪（刑期减半，帮派信任大降）/找律师硬扛（花大钱可能翻案）/找关系捞人（消耗人情）→坐牢：时间流逝、属性退化、地盘被抢、声望下跌（狱中可能结识大佬）。\n【职业线】劫匪线：踩点→定方案（硬抢/智取/内应）→备装备→执行（潜入→得手→撤离分段判定）→销赃跑路（黑市60%/典当40%/孙姐80%），案后进入风头期（非法行动风险+50%），赃物带记号需切割重铸或跨城出手，防同行黑吃黑（城府判定）。乞丐线：尊严值是隐藏核心（乞讨掉尊严，行善卖艺恢复；过低破罐破摔，高尊严解锁特殊剧情）；乞丐是城市最好的眼睛：情报网、完美伪装（蹲点/跟踪/避风头零成本）、免盘查（热度涨极慢）、黑面通行证；有"乞讨公司"非法控制乞丐抽成50%，可加入/独立/揭发/吞并。\n【结局】由因果值+声望+地位+关键选择判定，共18个结局三档：巅峰档（一代枭雄/商业大亨/地下皇帝/传奇卧底/惊天大盗/丐帮帮主/逆袭之王）；平凡档（金盆洗手/回头是岸/江湖隐士/体面隐退）；堕落档（铁窗余生/横死街头/众叛亲离/瘾君子末路/枪决/法外狂徒/底层沉沦）。\n【叙事要求】剧情通过人物行为、对话与事件自然推进；背景是现代中国城市质感；所有违法情节必须有现实代价（被抓、结仇、热度、心理压力）。';

const PROTOCOL='【输出协议】\n1. 用第二人称"你"叙述，每次回复推进剧情：日常场景150~400字，重大事件（战斗/大案/转折）300~600字；不要一次性长篇总结，也不要每次都写超长。\n2. 每次回复结尾必须附加一个 JSON 代码块（```json ... ```）用于同步游戏状态。只填本次确实发生变化的字段，格式示例：\n```json\n{"day":2,"time":"下午","location":"老城区·大排档","money":430,"blackMoney":0,"fame":"无人知晓","rank":"无","heat":8,"stress":22,"dignity":55,"injury":0,"addiction":0,"karma":0,"attributes":{"武力":43},"skills":{"格斗术":1},"relations":[{"name":"刀疤刘","trust":40,"note":"点头之交"}],"memoryAdd":["刀疤刘让我明天去码头搬货"],"dead":false,"deathReason":""}\n```\n3. 数值规则：money=白钱现金，blackMoney=黑钱；fame只能是 无人知晓/小有名气/名声在外/恶名昭彰/威震一方/传说 之一；rank只能是 无/小弟/打手/头目/堂主/副帮主/龙头 之一；heat 通缉热度0~120；stress压力/dignity尊严/injury伤病/addiction依赖 均为0~100；karma因果值 -100~100（善为正恶为负）；attributes/skills 只在真正提升或下降时给出；relations 是主角认识并有交集的人（信任0~100，可增删）；memoryAdd 每次最多3条值得长期记住的新记忆。\n4. 只有角色真正死亡时才把 dead 设为 true，并在 deathReason 写明死因，其余情况恒为 false。\n5. 玩家没说的不要替玩家做；NPC不知道的不要告诉玩家；数值变化必须与剧情一致，不得无理由变动。';

const ATTRS=['武力','体力','敏捷','智力','口才','城府','胆识','义气','威望'];
const ATTR_GROUPS=[['身体','武力','体力','敏捷'],['头脑','智力','口才','城府'],['社会','胆识','义气','威望']];

ions=S.relations||[];j.day=S.res.day;j.time=S.res.time;text='你和街坊聊了半天。老陈压低声音告诉你：青龙帮最近在码头缺人手，刀疤刘放话要招几个能打的小子，工钱日结。他冲你挤了挤眼："你要是真缺钱，可以去试试。"'}else if(/手机|刷|新闻|视频/.test(last)){j.day=S.res.day;j.time=S.res.time;text='你刷了半天短视频和本地新闻：郊区赌城昨晚被端了窝点，警方通报抓了十几个人；城东拆迁补偿又上热搜了。手机这玩意儿，既是商机，也是监控——你顺手把几个本地号都关注了。'}else{j.day=S.res.day;j.time=S.res.time;if(R()>0.5)j.money=(S.res.money||0)+Math.round(R()*50);text='你在街上晃了一圈。临江市的傍晚，霓虹灯刚亮起来，外卖骑手在车流里穿行，天网探头在头顶无声地转着。这座城市机会多得是，陷阱也不少——关键看你怎么走。'}const nt=advanceTime();j.day=nt.day;j.time=nt.time;return {content:text+'\n\n```json\n'+JSON.stringify(j)+'\n```',think:demoThink(last)}} function demoThink(act){const T='【模拟推理】第'+S.res.day+'天'+S.res.time+'，现金¥'+fmt(S.res.money)+'，热度'+S.res.heat+'。';let r='推演要点：';if(/打工|零工/.test(act))r+='安排体力劳动，收益中等偏低、压力小涨，保持"钱难挣"的现实感，为灰色路线铺垫。';else if(/棋牌|赌/.test(act))r+='小赌五五开，输赢控制在百元级，避免早期数值失衡；棋牌室是结识灰面人脉的入口。';else if(/打听|交谈/.test(act))r+='借街坊之口放出"码头缺人"的信息钩子，让玩家自然接触青龙帮，不强行推剧情。';else if(/锻炼/.test(act))r+='成长型行动：武力小幅提升，符合"练出来的本事"，不给免费午餐。';else if(/休息/.test(act))r+='恢复行动：减压疗伤，必要的生活节奏。';else if(/吃|大排档/.test(act))r+='生活流场景：花小钱听江湖闲话，丰富世界观，不产生实质收益。';else if(/手机/.test(act))r+='信息流：用新闻侧写城市动态，让世界活着，不直接给好处。';else if(/死亡/.test(act))r+='触发死亡流程：记录死因、生成点评、给出回档建议。';else r+='延续场景，给环境细节与一个小冲突，让玩家自己选择。';return T+r} function advanceTime(){const order=['上午','下午','晚上'];let d=S.res.day,t=S.res.time;const i=order.indexOf(t);if(i<order.length-1)t=order[i+1];else{t='上午';d+=1}S.res.day=d;S.res.time=t;return{d:d,time:t}} /*__PART_C__*/

function splitJSON(raw){
  let json=null,text=String(raw||'');
  const re=/```(?:json)?\s*([\s\S]*?)```/g;let m,last=null;
  while((m=re.exec(text)))last=m;
  if(last){text=text.slice(0,last.index)+text.slice(last.index+last[0].length);try{json=JSON.parse(last[1].trim())}catch(e){json=null}}
  if(!json){const a=text.indexOf('{'),b=text.lastIndexOf('}');if(a>=0&&b>a+1){const sub=text.slice(a,b+1);try{const o=JSON.parse(sub);if(o&&typeof o==='object'){json=o;text=(text.slice(0,a)+text.slice(b+1)).trim()}}catch(e){}}}
  return {text:text.trim(),json:json};
}
const JKEYS=['day','time','location','money','blackMoney','fame','rank','heat','stress','dignity','injury','addiction','karma','attributes','skills','relations','memoryAdd','dead','deathReason','deathReview'];
function applyJSON(j){
  if(!j||typeof j!=='object')return;
  if(!JKEYS.some(k=>j[k]!==undefined))return;
  const r=S.res,st=S.status;
  if(j.day!==undefined)r.day=clamp(Math.round(j.day),1,9999);
  if(j.time!==undefined&&['上午','下午','晚上','深夜'].indexOf(j.time)>=0)r.time=j.time;
  if(j.location!==undefined)r.location=String(j.location).slice(0,30);
  if(j.money!==undefined)r.money=clamp(Math.round(j.money),0,1e9);
  if(j.blackMoney!==undefined)r.blackMoney=clamp(Math.round(j.blackMoney),0,1e9);
  if(j.fame!==undefined&&FAME_LEVELS.indexOf(j.fame)>=0)r.fame=j.fame;
  if(j.rank!==undefined&&RANK_LEVELS.indexOf(j.rank)>=0)r.rank=j.rank;
  if(j.heat!==undefined)r.heat=clamp(Math.round(j.heat),0,120);
  if(j.stress!==undefined)st.stress=clamp(Math.round(j.stress),0,100);
  if(j.dignity!==undefined)st.dignity=clamp(Math.round(j.dignity),0,100);
  if(j.injury!==undefined)st.injury=clamp(Math.round(j.injury),0,100);
  if(j.addiction!==undefined)st.addiction=clamp(Math.round(j.addiction),0,100);
  if(j.karma!==undefined)r.karma=clamp(Math.round(j.karma),-100,100);
  if(j.attributes&&typeof j.attributes==='object'){ATTRS.forEach(k=>{if(j.attributes[k]!==undefined)c_attrs()[k]=clamp(Math.round(j.attributes[k]),0,100)})}
  if(j.skills&&typeof j.skills==='object'){Object.keys(j.skills).forEach(k=>{if(typeof j.skills[k]==='number')S.char.skills[k]=clamp(Math.round(j.skills[k]),0,10)})}
  if(Array.isArray(j.relations)){S.relations=j.relations.slice(0,40).map(x=>({name:String(x.name||'?').slice(0,12),tag:String(x.tag||'关系').slice(0,8),trust:clamp(x.trust,0,100),note:String(x.note||'').slice(0,30)}))}
  if(Array.isArray(j.memoryAdd)){j.memoryAdd.forEach(f=>{f=String(f).trim();if(f&&f.length<80&&S.memFacts.indexOf(f)<0)S.memFacts.push(f)});if(S.memFacts.length>40)S.memFacts.splice(0,S.memFacts.length-40)}
}

async function handleDeath(text,json){
  S.dead=true;
  const cid=S.checkpoints.length?S.checkpoints[S.checkpoints.length-1].id:null;
  const death={id:uid(),day:S.res.day,time:S.res.time,date:new Date().toLocaleString('zh-CN'),reason:json.deathReason||'不明',narrative:String(text).slice(0,320),review:json.deathReview||'',cid:cid};
  S.deaths.push(death);S.lastDeath=death;
  saveGame();renderDeathOverlay(death);
  document.getElementById('death-overlay').classList.add('show');
  if(!death.review){try{await fetchReview(death)}catch(e){death.review='（点评获取失败）';renderDeathOverlay(death)}}
  document.getElementById('msg').disabled=true;document.getElementById('btn-send').disabled=true;
}
async function fetchReview(death){
  const sys='你是《混社会模拟器》的AI主持人。请用180字以内给这位死去的玩家写一段"江湖点评"：1)客观评价其一生的关键行为；2)点出最致命的失误或转折点；3)给重来一次的具体建议。语气像看透世事的江湖老前辈，不煽情、不说教。';
  const msg='玩家死亡记录：第'+death.day+'天·'+death.time+'，死因：'+death.reason+'。死亡经过：'+death.narrative;
  if(cfg.demo){death.review='（本地演示点评）这一世，你输在"贪"字上——有了本钱就想一步登天，忘了临江市的规矩：先站住脚，再谈野心。重来一次，先把关系喂熟，再碰大生意。';}
  else{const rr=await callAI([{role:'system',content:sys},{role:'user',content:msg}],{short:true});death.review=typeof rr==='object'?rr.content:rr;}
  saveGame();renderDeathOverlay(death);
}
function renderDeathOverlay(death){
  const c=document.getElementById('death-content');
  const mems=(S.memFacts||[]).slice(-6).map(f=>'· '+f).join('<br>')||'· 这一生，还没有留下什么值得记住的事。';
  c.innerHTML='<div class="death-card"><h4>死亡档案 · 第'+death.day+'天 '+death.time+'（'+death.date+'）</h4><p><b>死因：</b>'+esc(death.reason)+'</p><p style="margin-top:6px"><b>经过：</b>'+esc(death.narrative)+'</p></div>'
    +'<div class="d-review"><h4>📜 人生回顾</h4><div style="font-size:12px;color:var(--t2);line-height:1.8">'+mems+'</div></div>'
    +'<div class="d-review"><h4>🧓 AI 江湖点评</h4><div id="death-review-text">'+(death.review?esc(death.review):'<span class="typing"><i></i><i></i><i></i></span> AI 正在回顾你的一生…')+'</div></div>';
}
function rewindTo(cid){
  if(S.dead&&S.diff==='hard'&&(S.rewindLeft||0)<=0){toast('☠️ 硬核模式回档次数已用完','err');return}
  const cp=S.checkpoints.find(c=>c.id===cid);if(!cp){toast('未找到该时间点','err');return}
  let d;try{d=JSON.parse(cp.data)}catch(e){toast('时间点数据损坏','err');return}
  S.char=d.char;S.res=d.res;S.status=d.status;S.relations=d.relations;S.memFacts=d.memFacts;S.notes=d.notes;S.history=d.history;
  if(S.diff==='hard')S.rewindLeft=Math.max(0,(S.rewindLeft||1)-1);
  S.dead=false;S.rewindNote='时间线已回拨至 第'+cp.day+'天'+cp.time+'。';
  S.history.push({role:'system',content:'【系统】时间线回拨：你回到了 第'+cp.day+'天'+cp.time+'。之前的悲剧已被改写，江湖仍在继续。'});
  closeAllOverlays();enterGame();saveGame();toast('⏪ 已回档至 第'+cp.day+'天'+cp.time,'ok');
}

function statDesc(k,v){
  if(k==='stress')return v<20?'从容':v<50?'有些烦闷':v<80?'焦躁易怒':'濒临崩溃';
  if(k==='heat')return v<=0?'无人注意':v<=20?'有人议论':v<=40?'被盯上了':v<=60?'频繁盘查':v<=80?'高危目标':'全城缉捕';
  if(k==='dignity')return v<30?'落魄潦倒':v<60?'平凡无奇':'体面从容';
  if(k==='injury')return v<=0?'无伤':v<30?'轻伤':v<60?'重伤(行动受限)':'濒死';
  if(k==='addiction')return v<=0?'滴酒不沾':v<30?'有点瘾头':v<60?'依赖加重':'重度依赖';
  return '';
}
function moneyDesc(n){return n<=0?'身无分文':n<1000?'捉襟见肘':n<10000?'勉强温饱':n<100000?'小有积蓄':'财大气粗'}

const Game={
async send(){
  if(!S||S.dead||loading)return;
  const el=document.getElementById('msg');
  const text=el.value.trim();
  if(!text)return;
  el.value='';
  newCheckpoint('行动：'+text.slice(0,24));
  S.history.push({role:'user',content:text,day:S.res.day,time:S.res.time});
  loading=true;
  renderChat();
  try{
    const sys=buildSystem();
    const msgs=[{role:'system',content:sys}].concat(S.history.slice(-24).map(m=>({role:m.role==='user'?'user':'assistant',content:m.content})));
    const raw=await callAI(msgs);
    const think=raw&&typeof raw==='object'?(raw.think||''):'';
    const cont=raw&&typeof raw==='object'?raw.content:raw;
    const {text:t,json}=splitJSON(cont);
    S.history.push({role:'assistant',content:t,think:think||'',day:S.res.day,time:S.res.time,loc:S.res.location});
    loading=false;
    applyJSON(json);
    renderChat();updateChips();renderCharPanel();
    if(json&&json.dead){await handleDeath(t,json);}
    else{saveGame();}
  }catch(e){
    loading=false;
    renderChat();
    toast('❌ '+e.message,'err');
  }
},
quick(i){
  if(i<QUICK.length)this.sendWith(QUICK[i].a);
  else{const c=CQUICK[i-QUICK.length];if(c)this.sendWith(c.a);}
},
sendWith(text){
  const el=document.getElementById('msg');
  el.value=text;
  this.send();
},
toggleGold(){

async opening(){

  loading=true;

  const budget=this.W.cheat?300:150;

    '<div class="attr-row"><span class="attr-name">'+k+'</span>'

},
renderTalGrid(){
  const used=this.W.talents.reduce((s,id)=>{const t=TALENTS.find(x=>x.id===id);return s+(t?t.cost:0)},0);

    const sel=this.W.talents.indexOf(t.id)>=0;
    const dis=!this.W.cheat&&!sel&&(this.W.talents.length>=4||left<t.cost);
    return '<div class="talent '+(sel?'on':'')+(dis?' dis':'')+'" onclick="Wiz.talent(\''+t.id+'\')">'
      +'<div class="t-name">'+t.name+'<span class="t-cost">'+t.cost+'点</span></div>'

},

   +'</div>';
},
renderSummary(){
  const w=this.W;
  const o=ORIGINS.find(x=>x.id===w.origin)||ORIGINS[5];
  const baseSum=ATTRS.reduce((s,k)=>s+(w.attrAlloc[k]||0),0);
  const usedTal=w.talents.reduce((s,id)=>{const t=TALENTS.find(x=>x.id===id);return s+(t?t.cost:0)},0);
  const rows=[
    ['姓名',w.name||'（未填写）'],['性别',w.gender],
    ['出身',w.origin==='custom'?(w.originCustom||'自定义'):o.name],
    ['性格',w.traits.join('、')||'无'],['目标',w.goal==='自定义目标'?(w.goalCustom||'自定义'):w.goal],
    ['属性加点',baseSum+' 点（基础随出身）'],
    ['天赋','已选 '+w.talents.length+' 个 · 消耗 '+usedTal+' 点'+(w.cheat?'（作弊模式·无限）':'')],
    ['作弊模式',w.cheat?'🏴 开启（+10万资金·全技能Lv.1·金手指）':'关闭'],
    ['备注',w.note?w.note.slice(0,40)+'…':'无'],
    ['难度',DIFFS[w.diff].icon+DIFFS[w.diff].name],
    ['初始资金',w.cheat?'¥'+(100000+o.money).toLocaleString():'¥'+o.money.toLocaleString()],
    ['初始人脉',(o.rel||[]).map(x=>x.name).join('、')||'无']
  ];
  document.getElementById('w-sum').innerHTML=rows.map(r=>'<div class="k">'+r[0]+'</div><div class="v">'+esc(r[1])+'</div>').join('');
},
trait(t){
  const i=this.W.traits.indexOf(t);
  if(i>=0)this.W.traits.splice(i,1);
  else{if(this.W.traits.length>=3){toast('最多选择3个性格标签','warn');return}this.W.traits.push(t);}
  this.renderChips();
},
attr(k,d){
  const cur=this.W.attrAlloc[k]||0;
  const budget=this.W.cheat?300:150;
  const used=ATTRS.reduce((s,x)=>s+(this.W.attrAlloc[x]||0),0);
  if(d>0&&used>=budget){toast('属性点已用完','warn');return}
  const next=clamp(cur+d,0,60);
  if(next===cur)return;
  this.W.attrAlloc[k]=next;
  this.renderAttrGrid();
},
talent(id){
  const i=this.W.talents.indexOf(id);
  if(i>=0){this.W.talents.splice(i,1);}
  else{
    if(!this.W.cheat){
      const t=TALENTS.find(x=>x.id===id);
      const used=this.W.talents.reduce((s,x)=>{const tt=TALENTS.find(y=>y.id===x);return s+(tt?tt.cost:0)},0);
      if(this.W.talents.length>=4){toast('非作弊模式最多选4个天赋','warn');return}
      if(used+(t?t.cost:0)>20){toast('天赋点不足','warn');return}
    }
    this.W.talents.push(id);
  }
  this.renderTalGrid();
},
cheat(){
  this.W.cheat=document.getElementById('w-cheat').checked;
  this.renderAttrGrid();this.renderTalGrid();
},

},

},

},
refresh(){this.saveStep();fetchModels();},
aiName(){
  const o=ORIGINS.find(x=>x.id===this.W.origin)||ORIGINS[5];
  const doSet=n=>{this.W.name=n;const el=document.getElementById('w-name');if(el)el.value=n;};
  if(cfg.demo||!cleanKey(cfg.apiKey)){doSet(NAMES[Math.floor(Math.random()*NAMES.length)]);return}
  const self=this;
  callAI([{role:'user',content:'请为一位临江市'+o.name+'出身的年轻主角起一个名字（2~4个汉字，符合现代都市气质），只回复名字本身，不要任何解释。'}],{short:true}).then(r=>{
    let n=String((r&&typeof r==='object'?r.content:r)||'').trim().slice(0,8);
    n=n.split('').filter(ch=>{const c=ch.charCodeAt(0);return c>=0x4e00&&c<=0x9fa5}).join('').slice(0,4);
    if(n)doSet(n);else doSet(NAMES[Math.floor(Math.random()*NAMES.length)]);
  }).catch(()=>doSet(NAMES[Math.floor(Math.random()*NAMES.length)]));
},
saveStep(){
  if(this.wizStep===0){
    cfg.apiEndpoint=document.getElementById('w-endpoint').value.trim()||CFG_DEFAULT.apiEndpoint;
    cfg.apiKey=cleanKey(document.getElementById('w-apikey').value);
    cfg.model=document.getElementById('w-model').value||cfg.model;
    cfg.maxTokens=document.getElementById('w-maxtokens').value;
    cfg.reasoningEffort=document.getElementById('w-reasoning').value;
    cfg.demo=document.getElementById('w-demo').checked;
    saveCfg();
  }
  if(this.wizStep===1){
    this.W.name=document.getElementById('w-name').value.trim();
    this.W.gender=document.getElementById('w-gender').value;
    this.W.origin=document.getElementById('w-origin').value;
    this.W.originCustom=document.getElementById('w-origin-custom-v').value.trim();
    this.W.goal=document.getElementById('w-goal').value;
    this.W.goalCustom=document.getElementById('w-goal-custom-v').value.trim();
    this.W.backstory=document.getElementById('w-backstory').value.trim();
  }
  if(this.wizStep===2)this.W.note=document.getElementById('w-note').value.trim();
},
next(){
  if(this.wizStep===4){this.startGame();return}
  this.saveStep();
  if(this.wizStep===0&&!cfg.demo&&!cleanKey(cfg.apiKey)){toast('请先填写 API Key，或勾选「本地演示模式」','warn');return}
  if(this.wizStep===1&&!this.W.name){toast('请先给主角起个名字','warn');return}
  this.wizStep++;
  this.render();
},
prev(){
  if(this.wizStep>0){this.saveStep();this.wizStep--;this.render();}
},
startGame(){
  this.saveStep();
  const o=ORIGINS.find(x=>x.id===this.W.origin)||ORIGINS[5];
  const attrs={};
  ATTRS.forEach(k=>{attrs[k]=clamp((ATTR_BASE[k]||0)+(o.mods[k]||0)+(this.W.attrAlloc[k]||0),0,100)});
  const skills={};SKILL_NAMES.forEach(k=>skills[k]=0);
  if(this.W.cheat)skills['格斗术']=2;
  S={
    char:{name:this.W.name,gender:this.W.gender,origin:this.W.origin==='custom'?(this.W.originCustom||'自定义'):o.name,traits:this.W.traits.slice(),goal:this.W.goal==='自定义目标'?(this.W.goalCustom||'自定义目标'):this.W.goal,backstory:this.W.backstory,cheat:this.W.cheat,attributes:attrs,talents:this.W.talents.slice(),skills:skills},
    res:{day:1,time:'上午',location:o.loc,money:o.money+(this.W.cheat?100000:0),blackMoney:0,fame:'无人知晓',rank:'无',heat:o.heat||0,karma:0},
    status:{stress:10,dignity:55,injury:0,addiction:0},
    relations:(o.rel||[]).map(x=>Object.assign({},x)),
    memFacts:[],notes:this.W.note,
    history:[],checkpoints:[],deaths:[],dead:false,goldfinger:false,rewindLeft:this.W.diff==='hard'?1:999,
    diff:this.W.diff,rewindNote:'',lastDeath:null
  };
  cpid=1;
  saveGame();enterGame();
  toast('🎮 江湖开演！','ok');
  Game.opening();
}
};

    +'<button class="btn" style="font-size:11px;padding:4px 10px" onclick="rewindFromDeathId(\''+d.id+'\')">⏪ 回到死前关键点</button></div>').join('')
    :'<p style="font-size:12px;color:var(--t3)">还没有死亡记录。江湖路远，且行且珍惜。</p>';
  const cps=S.checkpoints.slice().reverse().map(cp=>'<div class="cp-item"><div class="t">第'+cp.day+'天 · '+cp.time+'</div><div class="s">'+esc(cp.summary||'')+'</div><button class="btn gold" style="font-size:11px;padding:4px 10px;margin-top:6px" onclick="rewindTo('+cp.id+')">⏪ 回档至此</button></div>').join('');
  const left=S.diff==='hard'?(S.rewindLeft||0)+' 次':'∞ 次';
  document.getElementById('deaths-content').innerHTML=
    '<label>☠️ 死亡记录（每次死亡都有 AI 点评，永久保留）</label><div class="death-list">'+recs+'</div>'
    +'<label style="margin-top:12px">📌 可选时间点（自动存档，保留最近 '+S.checkpoints.length+' 个）</label><div>'+cps+'</div>'
    +'<div class="hint" style="margin-top:8px">当前回档机会：'+left+'（硬核模式仅1次）。回档后，未来发生的悲剧将被改写。</div>';
  this.openModal('deaths-modal');
},
closeDeath(){
  this.closeModal('death-overlay');
  this.openDeaths();
}
};
function rewindFromDeathId(id){
  const d=(S.deaths||[]).find(x=>x.id===id);
  if(!d||!d.cid){toast('未找到该死亡对应的时间点','err');return}
  rewindTo(d.cid);
}
function init(){
  document.body.dataset.theme=cfg.theme;
  document.getElementById('import-file').addEventListener('change',e=>{
    const f=e.target.files&&e.target.files[0];
    if(f)applyImportFile(f);
    e.target.value='';
  });
  const saved=loadGame();
  if(saved){
    S=saved;
    if(S.rewindLeft===undefined)S.rewindLeft=S.diff==='hard'?1:999;
    cpid=(S.checkpoints&&S.checkpoints.length)?S.checkpoints[S.checkpoints.length-1].id+1:1;
    enterGame();
    if(S.dead&&S.lastDeath){renderDeathOverlay(S.lastDeath);document.getElementById('death-overlay').classList.add('show');}
    toast('💾 已自动恢复上次存档','ok');
  }else{
    Wiz.render();
  }
  document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')Game.send()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      UI.closeDrawers();
      document.querySelectorAll('.modal-overlay.show').forEach(o=>o.classList.remove('show'));
    }
  });
}
init();
</script>
</body>
</html>
