<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conver System — 角色对话</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ─── 侧栏 ─── -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <h1 class="logo">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" class="logo-icon">
                    <rect x="2" y="2" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M6 10L9 13L14 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Conver
            </h1>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-btn active" data-view="chat" title="聊天">
                <span class="nav-icon">💬</span>
                <span class="nav-label">聊天</span>
            </button>
            <button class="nav-btn" data-view="characters" title="角色管理">
                <span class="nav-icon">👤</span>
                <span class="nav-label">角色</span>
            </button>
            <button class="nav-btn" data-view="search" title="搜索">
                <span class="nav-icon">🔍</span>
                <span class="nav-label">搜索</span>
            </button>
            <button class="nav-btn" data-view="settings" title="设置">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">设置</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-icon btn-collapse-sidebar" id="btn-collapse-sidebar" title="收起侧栏">◀</button>
            <span class="version">v0.1.0</span>
            <button class="btn-icon theme-toggle" id="btn-theme-toggle" title="切换主题">🌙</button>
        </div>
    </aside>

    <!-- ─── 侧栏展开按钮（收起时显示） ─── -->
    <button class="floating-expand" id="btn-expand-sidebar" style="display:none" title="展开侧栏">▶</button>

    <!-- ─── 主内容区 ─── -->
    <main id="main-content">
        <!-- 聊天视图（默认） -->
        <section id="view-chat" class="view active">
            <div class="chat-layout">
                <!-- 对话列表 -->
                <div class="chat-sidebar">
                    <div class="chat-sidebar-header">
                        <h2>对话</h2>
                        <div class="chat-sidebar-header-actions">
                            <button class="btn-icon btn-collapse-chat" id="btn-collapse-chat" title="收起侧栏">◀</button>
                            <button class="btn-icon" id="btn-new-chat" title="新对话">✏️</button>
                        </div>
                    </div>
                    <div class="conversation-list" id="conversation-list">
                        <p class="empty-hint">暂无对话</p>
                    </div>
                </div>
                <!-- 对话列表展开按钮（收起时显示） -->
                <button class="chat-floating-expand" id="btn-expand-chat" style="display:none" title="展开侧栏">▶</button>

                <!-- 聊天区域 -->
                <div class="chat-main">
                    <div class="chat-header" id="chat-header">
                        <span class="chat-title">选择一个角色开始对话</span>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="empty-state">
                            <p>选择左侧对话或创建新对话开始聊天</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <div class="input-wrapper">
                            <textarea
                                id="chat-input"
                                placeholder="输入消息… (Enter 发送, Shift+Enter 换行)"
                                rows="1"
                            ></textarea>
                            <button class="btn-send" id="btn-send" title="发送">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M2 8L14 2L10 14L7 9L2 8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="currentColor"/>
                </svg>
            </button>
                        </div>
                        <div class="input-options">
                            <label class="option-toggle">
                                <input type="checkbox" id="toggle-stream" checked>
                                <span>流式输出</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 角色管理视图 -->
        <section id="view-characters" class="view">
            <div class="view-header">
                <h2>角色管理</h2>
                <div class="view-header-actions">
                    <button class="btn-secondary" id="btn-import-character" title="从 SillyTavern V2 角色卡 JSON 导入">📥 导入角色</button>
                    <button class="btn-primary" id="btn-create-character">＋ 创建角色</button>
                    <input type="file" id="character-import-input" accept=".json,application/json" style="display:none">
                </div>
            </div>
            <div class="character-grid" id="character-grid">
                <p class="empty-hint">暂无角色，点击上方按钮创建</p>
            </div>
        </section>

        <!-- 搜索视图 -->
        <section id="view-search" class="view">
            <div class="view-header search-view-header">
                <h2>搜索消息</h2>
            </div>
            <div class="search-container">
                <div class="search-input-wrapper">
                    <span class="search-input-icon">🔍</span>
                    <input type="text" id="search-input" class="search-input" placeholder="搜索消息内容…" autocomplete="off">
                    <button class="btn-icon btn-search-clear" id="btn-search-clear" title="清空">✕</button>
                </div>
                <div class="search-results" id="search-results">
                    <p class="search-hint">输入关键词搜索所有对话中的消息</p>
                </div>
            </div>
        </section>

        <!-- 设置视图 -->
        <section id="view-settings" class="view">
            <div class="view-header">
                <h2>设置</h2>
            </div>
            <div class="settings-form">
                <div class="settings-group">
                    <h3>API 密钥</h3>
                    <div class="form-field">
                        <label for="setting-claude-key">Claude API Key</label>
                        <input type="password" id="setting-claude-key" placeholder="sk-ant-...">
                    </div>
                    <div class="form-field">
                        <label for="setting-claude-url">Claude 兼容 API 地址</label>
                        <input type="url" id="setting-claude-url" placeholder="https://api.anthropic.com（可选，第三方兼容服务用）">
                    </div>
                    <div class="form-field">
                        <label for="setting-openai-key">OpenAI / 国产模型 API Key</label>
                        <input type="password" id="setting-openai-key" placeholder="sk-...">
                    </div>
                    <div class="form-field">
                        <label for="setting-openai-url">OpenAI 兼容 API 地址</label>
                        <input type="url" id="setting-openai-url" placeholder="https://api.openai.com/v1（国产模型填对应地址）">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>默认模型</h3>
                    <div class="form-field">
                        <label for="setting-default-provider">默认 Provider</label>
                        <select id="setting-default-provider">
                            <option value="claude">Claude</option>
                            <option value="openai">OpenAI</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="setting-default-model">默认模型</label>
                        <select id="setting-default-model">
                            <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
                        </select>
                        <input type="text" id="setting-custom-model" class="custom-model-input" style="display:none" placeholder="输入模型名称（如 deepseek-chat、qwen-plus 等）">
                    </div>
                </div>

                <div class="settings-group">
                    <h3>对话</h3>
                    <div class="form-field">
                        <label for="setting-sliding-window">上下文保留轮数</label>
                        <input type="number" id="setting-sliding-window" value="30" min="5" max="100">
                    </div>
                    <div class="form-field danger-zone">
                        <label class="danger-label">危险操作</label>
                        <button class="btn-danger" id="btn-clear-all-convs">🗑️ 清空所有对话</button>
                        <p class="settings-hint">将删除所有对话和消息记录，此操作不可撤销。</p>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>主题</h3>
                    <div class="form-field">
                        <label for="setting-theme">主题模式</label>
                        <select id="setting-theme">
                            <option value="auto">跟随系统</option>
                            <option value="light">浅色</option>
                            <option value="dark">深色</option>
                        </select>
                    </div>
                </div>

                <div class="settings-group">
                    <h3>模板变量</h3>
                    <div class="form-field">
                        <label for="setting-user-name">用户昵称</label>
                        <input type="text" id="setting-user-name" placeholder="User" value="">
                        <p class="settings-hint">在角色设定中使用 <code>{{user}}</code> 和 <code>{{char}}</code> 模板变量，系统将自动替换为用户昵称和角色名称。</p>
                    </div>
                </div>

                <button class="btn-primary" id="btn-save-settings">保存设置</button>
                <p class="settings-hint">API Key 仅存储于本地数据库，不会上传</p>
            </div>
        </section>
    </main>

    <!-- ─── 移动端底部导航 ─── -->
    <nav class="mobile-bottom-nav">
        <button class="mobile-nav-btn active" data-view="chat">
            <span class="nav-icon">💬</span>
            <span>聊天</span>
        </button>
        <button class="mobile-nav-btn" data-view="characters">
            <span class="nav-icon">👤</span>
            <span>角色</span>
        </button>
        <button class="mobile-nav-btn" data-view="search">
            <span class="nav-icon">🔍</span>
            <span>搜索</span>
        </button>
        <button class="mobile-nav-btn" data-view="settings">
            <span class="nav-icon">⚙️</span>
            <span>设置</span>
        </button>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>
</html>
