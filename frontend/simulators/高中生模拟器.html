<!doctype html>
<html lang="zh-CN" data-theme="world">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:,">
<title>AI 角色扮演游戏</title>
<style>
:root{
  --bg:#0d1322; --bg2:#121a2c; --panel:#172036; --card:#1e2942; --card2:#273352;
  --text:#e9edf6; --muted:#93a2bd; --border:#2b3855; --accent:#4f8cff; --accent2:#ffb84d;
  --ok:#3ddc84; --bad:#ff5d6c; --gold:#ffd76a; --shadow:0 8px 30px rgba(0,0,0,.45);
}
html[data-theme="night"]{ --bg:#080a10; --bg2:#0d1017; --panel:#12151f; --card:#181c29; --card2:#202635; --text:#dbe2ef; --muted:#7c89a3; --border:#222a3c; --accent:#5b8def; --accent2:#9ece6a; }
html[data-theme="paper"]{ --bg:#f2ede1; --bg2:#ebe4d2; --panel:#f8f4e9; --card:#fdfaf2; --card2:#f0ead8; --text:#37322a; --muted:#746b58; --border:#d9d0ba; --accent:#94491f; --accent2:#2a628c; }
html[data-theme="neon"]{ --bg:#0b0919; --bg2:#100d24; --panel:#151033; --card:#1c1546; --card2:#262060; --text:#e9e3ff; --muted:#9d92d4; --border:#2e2670; --accent:#00d9ff; --accent2:#ff2ec4; }
html[data-theme="ink"]{ --bg:#0e1318; --bg2:#131920; --panel:#181f28; --card:#1f2833; --card2:#283440; --text:#e2e8ea; --muted:#83949f; --border:#2b3945; --accent:#4aa393; --accent2:#c9a86a; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.65;overflow-y:auto;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--panel);color:var(--text)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
label{font-size:13px;color:var(--muted);display:block;margin:10px 0 5px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-size:14px;transition:.15s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:rgba(255,93,108,.12);color:var(--bad);border-color:rgba(255,93,108,.4)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== 主界面 ===== */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;max-width:980px;margin:0 auto}
#topbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:nowrap;min-height:54px}
.tb-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 8px;border-radius:10px;font-size:11px;color:var(--muted);position:relative;min-height:40px}
.tb-btn:hover{background:var(--card);color:var(--text)}
.tb-btn .ic{font-size:17px;line-height:1.2}
.tb-badge{position:absolute;top:-3px;right:-3px;background:var(--bad);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#tb-mid{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-width:0;flex-shrink:1}
#tb-title{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw;line-height:1.3}
#tb-sub{font-size:10.5px;color:var(--gold);background:rgba(255,215,106,.1);border:1px solid rgba(255,215,106,.3);padding:0 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw;line-height:1.7;margin-top:1px}
#tb-mini{display:flex;gap:7px;align-items:center;flex-wrap:nowrap;overflow:hidden;margin-left:auto;padding:0 4px}
.mini{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.mini b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.mini .mb{width:38px;height:5px;background:var(--card2);border-radius:3px;overflow:hidden;display:inline-block}
.mini .mb i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s}
#tb-nav{display:flex;align-items:center;gap:1px;flex:0 0 auto}
#chat{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
.msg{max-width:92%;margin:0 auto 14px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .bubble{padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);font-size:14.5px;word-break:break-word}
.msg.narr .bubble{border-left:3px solid var(--accent)}
.msg.sys .bubble{background:var(--panel);color:var(--muted);font-size:12.5px;text-align:center;max-width:70%;margin:0 auto;border:none}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bubble{background:var(--accent);color:#fff;border-color:transparent;border-bottom-right-radius:4px}
.msg.assist .bubble{border-left:3px solid var(--accent2)}
.msg.err .bubble{border-left:3px solid var(--bad)}
.msg b{color:inherit;font-weight:700}
.msg i{font-style:italic}
.msg code{background:var(--card2);padding:1px 6px;border-radius:6px;font-size:13px}
.typing .bubble{color:var(--muted);font-style:italic}
.msg .r-box{background:var(--panel);border:1px dashed var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.msg .r-head{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--accent2)}
.msg .r-body{white-space:pre-wrap;margin-top:6px;max-height:200px;overflow-y:auto;line-height:1.6}
.msg .r-fold .r-body{display:none}
.msg .r-tri{transition:transform .2s}
.msg .r-fold .r-tri{transform:rotate(-90deg)}
#quick-wrap{padding:6px 12px 2px;overflow-x:auto;display:flex;gap:8px}
#quick-wrap::-webkit-scrollbar{height:4px}
.qchip{flex:0 0 auto;padding:6px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--border);font-size:13px;color:var(--text);transition:.15s}
.qchip:hover{border-color:var(--accent);color:var(--accent)}
#input-bar{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));align-items:flex-end}
#input{flex:1;max-height:120px;min-height:44px;font-size:15px}
#send{flex:0 0 auto;height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
#send:disabled{opacity:.55}
#send .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== 抽屉 ===== */
.drawer{position:fixed;top:0;bottom:0;width:320px;max-width:88vw;background:var(--panel);z-index:60;box-shadow:var(--shadow);transition:transform .28s ease;display:flex;flex-direction:column}
.drawer.left{left:0;transform:translateX(-105%)}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.drawer-body{flex:1;overflow-y:auto;padding:12px 14px 30px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.show{opacity:1;pointer-events:auto}

/* ===== 角色面板 ===== */
.c-sec{margin-bottom:18px}
.c-sec h4{font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.c-sec h4::after{content:"";flex:1;height:1px;background:var(--border)}
.c-id{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.c-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto}
.c-name{font-weight:800;font-size:17px}
.c-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.c-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.c-tag.diff{background:rgba(255,215,106,.12);color:var(--gold);border-color:rgba(255,215,106,.35)}
.stat-row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.stat-row .lb{width:56px;color:var(--muted);flex:0 0 auto;display:flex;align-items:center;gap:4px}
.stat-row .bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.stat-row .bar i{display:block;height:100%;border-radius:4px;transition:width .6s}
.stat-row .vl{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{color:var(--text);word-break:break-all}
.tal-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(79,140,255,.12);background:color-mix(in srgb, var(--accent) 12%, transparent);border:1px solid rgba(79,140,255,.35);border-color:color-mix(in srgb, var(--accent) 35%, transparent);color:var(--accent);margin:3px 4px 0 0}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.status-cell{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 11px}
.status-cell .k{font-size:11px;color:var(--muted)}
.status-cell .v{font-size:15px;font-weight:700;margin-top:2px}
.status-cell .v.small{font-size:13px;font-weight:600;word-break:break-all}
.log-line{font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--border);display:flex;gap:8px}
.log-line .t{color:var(--accent2);flex:0 0 auto}
.inv-item,.rel-item{font-size:13px;padding:5px 0;border-bottom:1px dashed var(--border);display:flex;justify-content:space-between;gap:8px}
.empty{color:var(--muted);font-size:12.5px;padding:6px 0}

/* ===== 弹窗 ===== */
#modal-root .ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#modal-root .modal{width:560px;max-width:96vw;max-height:86vh;background:var(--panel);border-radius:18px;border:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
#modal-root .m-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
#modal-root .m-body{flex:1;overflow-y:auto;padding:14px 16px}
#modal-root .m-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.x-btn{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.x-btn:hover{background:var(--card);color:var(--text)}
.set-sec{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--card)}
.set-sec h5{font-size:13px;margin-bottom:6px;color:var(--accent)}
.set-row{display:flex;align-items:center;gap:8px;margin:7px 0}
.set-row label{flex:0 0 86px;margin:0}
.set-row input,.set-row select{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.switch{position:relative;width:40px;height:22px;background:var(--card2);border:1px solid var(--border);border-radius:999px;transition:.2s;flex:0 0 auto}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch.on::after{left:20px}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--muted)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ency-item{padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer;transition:.15s}
.ency-item:hover{border-color:var(--accent)}
.ency-item .t{font-weight:700;font-size:14px}
.ency-item .d{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ency-detail .d{font-size:14px;line-height:1.8}
.mem-item{padding:9px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:var(--card);font-size:13px}
.mem-item .cat{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(79,140,255,.15);background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent);margin-right:8px}
.mem-item .tm{font-size:11px;color:var(--muted);margin-left:6px}
.death-item{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--card);overflow:hidden}
.death-item .hd{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer}
.death-item .hd .no{font-size:12px;color:var(--bad);font-weight:700;background:rgba(255,93,108,.12);padding:2px 8px;border-radius:999px}
.death-item .bd{display:none;padding:0 12px 12px;border-top:1px dashed var(--border)}
.death-item.open .bd{display:block}
.death-item .bd .eval{font-size:13px;margin-top:8px}
.death-item .bd .eval b{color:var(--accent2)}
.ask-bar{display:flex;gap:8px;margin-top:10px}

/* ===== 死亡覆盖层 ===== */
#death-overlay{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#12070c,#1a0d16 55%,#0d0a1f);display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
#death-box{width:640px;max-width:96vw;background:var(--panel);border:1px solid rgba(255,93,108,.35);border-radius:20px;padding:26px;box-shadow:var(--shadow);animation:fadeUp .4s ease}
#death-box h2{color:var(--bad);font-size:22px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.d-stat{font-size:13px;color:var(--muted);margin-bottom:16px}
.d-cause{background:rgba(255,93,108,.08);border:1px solid rgba(255,93,108,.3);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.d-eval{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.d-eval h4{color:var(--accent2);font-size:13px;margin-bottom:6px;letter-spacing:1px}
.d-eval p{font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.d-eval p b{color:var(--accent2)}
.d-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.cp-list{display:grid;gap:8px;margin-top:12px}
.cp-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);font-size:13px}
.cp-item .tm{color:var(--muted);font-size:11px;flex:0 0 auto}

/* ===== 向导 ===== */
#wizard{min-height:100vh;min-height:100dvh;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
#wz-inner{max-width:720px;margin:0 auto;padding:26px 18px 80px}
#wz-head{text-align:center;margin-bottom:18px}
#wz-logo{font-size:40px}
#wz-title{font-size:24px;font-weight:800;margin-top:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
#wz-sub{font-size:13px;color:var(--muted);margin-top:4px}
#wz-steps{display:flex;gap:6px;justify-content:center;margin:16px 0 6px;flex-wrap:wrap}
.wz-dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--panel)}
.wz-dot.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.wz-dot.done{border-color:var(--accent);color:var(--accent)}
#wz-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px;margin-top:10px;box-shadow:var(--shadow)}
#wz-card h3{font-size:17px;margin-bottom:4px}
#wz-card .desc{font-size:13px;color:var(--muted);margin-bottom:14px}
#wz-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.talent-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px}
.talent-item .inf{flex:1;min-width:0}
.talent-item .nm{font-weight:700;font-size:14px}
.talent-item .cs{font-size:11px;color:var(--gold);margin-left:6px}
.talent-item .ds{font-size:12px;color:var(--muted);margin-top:2px}
.talent-item .add,.talent-item .sub{width:30px;height:30px;border-radius:9px;flex:0 0 auto;font-size:16px;font-weight:700;background:var(--card2);border:1px solid var(--border)}
.talent-item .add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.talent-item .sub:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.talent-item .cnt{font-size:14px;font-weight:700;width:26px;text-align:center;flex:0 0 auto}
.talent-item.sel{border-color:var(--accent);background:rgba(79,140,255,.08);background:color-mix(in srgb, var(--accent) 8%, transparent)}
.talent-item{cursor:pointer;user-select:none}
.talent-item .mark{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);flex:0 0 auto;background:var(--card2)}
.talent-item.sel .mark{background:var(--accent);color:#fff;border-color:var(--accent)}
.attr-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px}
.attr-row .lb{width:96px;flex:0 0 auto;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.attr-row .bar{flex:1;height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.attr-row .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
.attr-row .add,.attr-row .sub{width:30px;height:30px;border-radius:9px;flex:0 0 auto;font-size:16px;font-weight:700;background:var(--card2);border:1px solid var(--border)}
.attr-row .add:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.attr-row .sub:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.attr-row .cnt{width:46px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;flex:0 0 auto}
.points-bar{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px;flex-wrap:wrap}
.points-bar .pts{font-size:18px;font-weight:800;color:var(--accent)}
.cheat{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--accent2);cursor:pointer;user-select:none}
.diff-card{border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:.15s}
.diff-card:hover{border-color:var(--accent)}
.diff-card.sel{border-color:var(--accent);background:rgba(79,140,255,.08);background:color-mix(in srgb, var(--accent) 8%, transparent);box-shadow:0 0 0 1px var(--accent)}
.diff-card .nm{font-weight:800;font-size:15px}
.diff-card .ds{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6}

function addMsg(role, content, opts={}){
  const reasoning = opts.reasoning || '';
  state.messages.push({role, content, t: opts.t || nowStr(), reasoning});
  const m = document.createElement('div');
  m.className = 'msg ' + role + (opts.typing?' typing':'') + (opts.err?' err':'');
  const rHtml = reasoning ? `<div class="r-box"><div class="r-head"><span>💭 思考过程</span><span class="r-tri">▾</span></div><div class="r-body">${esc(reasoning)}</div></div>` : '';
  m.innerHTML = `<div class="who">${opts.who||''}</div>${rHtml}<div class="bubble"></div>`;
  $('#chat').appendChild(m);
  $('#chat').scrollTop = $('#chat').scrollHeight;
  const rb = m.querySelector('.r-box');
  if(rb) rb.onclick = ()=> rb.classList.toggle('r-fold');
  const bubble = m.querySelector('.bubble');
  if(opts.typing){
    let i=0;
    const step = Math.max(6, Math.floor(content.length/140));
    const iv = setInterval(()=>{
      i = Math.min(content.length, i+step);
      bubble.innerHTML = fmt(content.slice(0,i)) + (i<content.length?'<span style="opacity:.5">▍</span>':'');
      $('#chat').scrollTop = $('#chat').scrollHeight;
      if(i>=content.length){ clearInterval(iv); m.classList.remove('typing'); }
    }, ui.anim?24:0);
    if(!ui.anim){ i=content.length; bubble.innerHTML=fmt(content); clearInterval(iv); }
  } else {
    bubble.innerHTML = fmt(content);
  }
  return m;
}
function addSystem(text){ addMsg('system', text); }

/* ==================== AI 调用 ==================== */
async function callAI(msgs, opts={}){
  const api = opts.api || cfg;
  if(!api.endpoint) throw new Error('未配置 API 端点');
  if(!api.key) throw new Error('未配置 API Key，请在【设置】中填写');
  let model = api.model || 'deepseek-chat';
  if(api.reasoning && api.reasoning!=='off' && model==='deepseek-chat' && (api.endpoint||'').includes('deepseek.com')) model='deepseek-reasoner';
  const body = { model, messages: msgs, stream:false };
  if(api.maxTokens && api.maxTokens!=='unlimited') body.max_tokens = Number(api.maxTokens);
  if(!String(model).includes('reasoner')) body.temperature = (opts.temp!=null?opts.temp:0.9);
  if(api.reasoning && api.reasoning!=='off' && !(api.endpoint||'').includes('deepseek.com')) body.reasoning_effort = api.reasoning;
  const ctrl = new AbortController();
  const tm = setTimeout(()=>ctrl.abort(), opts.timeout||120000);
  try{
    const res = await fetch(api.endpoint, { method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.key},
      body: JSON.stringify(body), signal: ctrl.signal });
    if(!res.ok){
      let msg = 'HTTP '+res.status;
      try{ const e = await res.json(); msg = e.error?.message || e.message || msg; }catch(_){}
      if(res.status===400 && body.reasoning_effort){
        delete body.reasoning_effort;
        const retry = await fetch(api.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+api.key},body:JSON.stringify(body),signal:ctrl.signal});
        if(retry.ok){ const d=await retry.json(); const m=d.choices?.[0]?.message||{}; return {content:m.content||'', reasoning:m.reasoning_content||''}; }
      }
      throw new Error(msg);
    }
    const data = await res.json();
    const m = data.choices?.[0]?.message || {};
    return { content: m.content || '', reasoning: m.reasoning_content || '' };
  }catch(err){
    if(err.name==='AbortError') throw new Error('请求超时（'+(opts.timeout||120)/1000+'秒）。请检查网络或 API 配置');
    throw err;
  }finally{ clearTimeout(tm); }
}
async function fetchModels(){
  const ep = cfg.endpoint || '';
  const candidates = [];
  candidates.push(ep.replace(/\/chat\/completions\/?$/,'/models'));
  try{ const u=new URL(ep); candidates.push(u.origin+'/v1/models'); candidates.push(u.origin+'/models'); }catch(_){}
  if(cfg.modelsUrl) candidates.unshift(cfg.modelsUrl);
  let lastErr;
  for(const u of candidates){
    try{
      const res = await fetch(u, {headers:{'Authorization':'Bearer '+cfg.key}});
      if(res.ok){ const d=await res.json(); const list=(d.data||[]).map(x=>x.id).filter(Boolean); if(list.length){ cfg.modelsUrl=u; return list; } }
    }catch(e){ lastErr=e; }
  }
  throw (lastErr||new Error('拉取模型列表失败'));
}

/* ==================== 状态/记忆/百科/节点/死亡 解析 ==================== */
function extractBalancedJSON(text, marker){
  const i = text.lastIndexOf(marker);
  if(i<0) return null;
  const j = text.indexOf('{', i);
  if(j<0) return null;
  let depth=0, inStr=false, esc=false;
  for(let k=j;k<text.length;k++){
    const c=text[k];
    if(inStr){ if(esc) esc=false; else if(c==='\\') esc=true; else if(c==='"') inStr=false; continue; }
    if(c==='"') inStr=true;
    else if(c==='{') depth++;
    else if(c==='}' && --depth===0){ try{ return JSON.parse(text.slice(j,k+1)); }catch(e){ return null; } }
  }
  return null;
}
function applyStatus(obj){
  if(!obj || typeof obj!=='object') return;
  CFG.attrs.forEach(a=>{ if(obj[a.key]!=null){ state.attrs[a.key] = clamp(obj[a.key], 0, a.max); delete obj[a.key]; } });
  CFG.statusFields.forEach(f=>{
    if(obj[f.key]==null) return;
    if(f.type==='bar') state.status[f.key] = clamp(obj[f.key], 0, f.max||100);
    else state.status[f.key] = obj[f.key];
    delete obj[f.key];
  });
  if(Array.isArray(obj.inventory)){ state.inventory = obj.inventory.map(String); delete obj.inventory; }
  if(obj.relations && typeof obj.relations==='object'){ Object.assign(state.relations, obj.relations); delete obj.relations; }
  if(obj.flags && typeof obj.flags==='object'){ Object.assign(state.flags, obj.flags); delete obj.flags; }
  if(Array.isArray(obj.log)){ obj.log.forEach(l=>state.statusLog.unshift({t:state.status.time||'此刻', text:String(l)})); delete obj.log; }
  Object.keys(obj).forEach(k=>{ if(obj[k]!=null) state.status[k]=obj[k]; });
  if(state.statusLog.length>40) state.statusLog.length=40;
}

function playerSheet(){

  const tals = (state.talents||[]).map(t=>t.name).concat((state.customTalents||[]).map(t=>t.name));
  let s = '【玩家角色卡】\n' + lines.join('\n');
  if(sup.length) s += '\n【设定补充】\n'+sup.join('\n');
  if(p.custom) s += '\n【自定义补充设定】\n'+p.custom;
  if(tals.length) s += '\n【天赋】\n'+tals.map(t=>'·'+t).join('\n');
  if(p.notes) s += '\n【玩家备注/愿望（务必尊重）】\n'+p.notes;

}
function buildSystemPrompt(){
  const d = CFG.difficulties.find(x=>x.id===state.difficulty) || CFG.difficulties[2];
  const memTxt = state.memories.slice(-40).map(m=>'['+m.cat+'] '+m.text).join('\n') || '（暂无）';
  const encyTop = CFG.ency.map(g=>g.entries[0]).filter(Boolean).slice(0,8).map(e=>'·'+e.t+'：'+e.d.slice(0,60)).join('\n');
  const encyExtraTxt = state.encyExtra.slice(-10).map(e=>'·'+e.t+'：'+e.d.slice(0,60)).join('\n');
  const statusTxt = JSON.stringify({属性:state.attrs, 状态:state.status, 物品:state.inventory, 关系:state.relations, 标记:state.flags});
  return `你是《${CFG.title}》的 AI 主持（Game Master）。你负责：推进剧情、扮演所有NPC、判定事件结果、维护世界观一致性。所有叙述使用第二人称「你」，过去经历与当前处境必须与【记忆档案】【当前状态】一致，绝不允许遗忘设定与已发生的故事。
${CFG.worldLore}
${CFG.rules}
【当前难度】${d.name}：${d.rules}
${ROLE_RULES}
${CFG.deathNote}
${CFG.aiExtras}
${playerSheet()}
【当前状态】${statusTxt}
【记忆档案】
${memTxt}
【早期故事摘要】${state.fusedMemory||'（暂无）'}
【世界百科速览】
${encyTop}${encyExtraTxt?'\n'+encyExtraTxt:''}
【输出协议】（每回合必须遵守）
1. 回复末尾必须输出一行【状态更新】JSON：{"字段key":数值/文本}，字段key按当前状态中的键名，只写发生变化或有意义的字段（如生命/精力/金钱/地点/时间/心情等）；也可带"log":["状态日志1","状态日志2"]。
2. 认识新人物、重要事件、约定、物品时，用【记忆:类别|内容】记录（类别限：人物/地点/事件/物品/关系/其他）。
3. 发现世界新知识时，用【百科:类别|标题|内容】补充百科。
4. 剧情关键转折点，用【节点:描述】标记存档节点。
5. 玩家角色死亡/彻底失败时，在回复末尾输出【死亡:原因】。
6. 单次回复 300~600 字，生动具体；禁止替玩家做决定、发言、思考。`;
}
function buildMessages(userText){
  const msgs = [{role:'system', content:buildSystemPrompt()}];
  const hist = state.messages.slice(-24);
  hist.forEach(m=>{ if(m.role==='system') return; msgs.push({role:m.role==='assistant'?'assistant':'user', content:m.content}); });
  msgs.push({role:'user', content:userText});
  return msgs;
}
async function maybeSummarize(){
  const total = state.messages.length;
  if(total - state.summarizedUntil < 40 || total < 40) return;
  const seg = state.messages.slice(state.summarizedUntil, total-24);
  const to = total-24;
  let summary = '';
  try{
    const sys='你是剧情摘要助手。把下面的对话压缩成150字内的中文摘要，保留：关键人物、事件、约定、物品、状态变化、悬念。只输出摘要正文。';
    const usr = seg.map(m=>(m.role==='user'?'玩家':'AI')+'：'+m.content.slice(0,240)).join('\n');
    summary = (await callAI([{role:'system',content:sys},{role:'user',content:usr}], {timeout:60000, temp:0.3})).content.trim();
  }catch(e){
    summary = seg.filter(m=>m.role==='user').slice(0,6).map(m=>m.content.slice(0,80)).join('；');
  }
  if(summary){
    state.fusedMemory = (state.fusedMemory? state.fusedMemory+'；':'') + summary;
    if(state.fusedMemory.length>1800) state.fusedMemory = state.fusedMemory.slice(-1800);
  }
  state.summarizedUntil = to;
}

/* ==================== 主流程 ==================== */
async function sendMessage(text){
  if(busy) return;
  text = String(text||'').trim();
  if(!text) return;
  if(!cfg.key){ toast('请先在右上角【设置】中配置 API Key'); return; }
  busy = true; setBusyUI(true);
  addMsg('user', text);
  $('#input').value='';
  $('#input').style.height='';
  try{
    await maybeSummarize();
    const ai = await callAI(buildMessages(text));
    applyAIText(ai.content, ai.reasoning);
  }catch(err){
    addMsg('assist', '⚠️ 请求失败：'+err.message+'\n\n请检查右上角【设置】中的 API 配置，然后重试。', {err:true, who:'系统'});
  }finally{
    busy=false; setBusyUI(false);
  }
}
function applyAIText(ai, reasoning){
  const dm = ai.match(/【死亡(?:[：:]([^】]+))?】/);
  const hasDeath = /【死亡/.test(ai);
  const statusObj = extractBalancedJSON(ai, '【状态更新】');
  if(statusObj) applyStatus(statusObj);
  (ai.match(/【记忆[：:]\s*([^|】]{1,8})\|([^】]+)】/g)||[]).forEach(tag=>{ const m=tag.match(/【记忆[：:]\s*([^|】]{1,8})\|([^】]+)】/); if(m) addMemory(m[1].trim(), m[2].trim()); });
  (ai.match(/【百科[：:]\s*([^|】]{1,8})\|([^|】]{1,24})\|([^】]+)】/g)||[]).forEach(tag=>{ const m=tag.match(/【百科[：:]\s*([^|】]{1,8})\|([^|】]{1,24})\|([^】]+)】/); if(m) addEncy(m[1].trim(), m[2].trim(), m[3].trim()); });
  (ai.match(/【节点[：:]([^】]+)】/g)||[]).forEach(tag=>{ const m=tag.match(/【节点[：:]([^】]+)】/); if(m) saveCheckpoint(m[1].trim()); });
  const clean = ai.replace(/【状态更新】\s*\{[\s\S]*?\}\s*/g,'').replace(/【记忆[：:][^】]+】/g,'').replace(/【百科[：:][^】]+】/g,'').replace(/【节点[：:][^】]+】/g,'').replace(/【死亡(?:[：:][^】]+)?】/g,'').replace(/\n{3,}/g,'\n\n').trim();
  if(clean) addMsg('assist', clean, {reasoning: reasoning || ''});
  state.turnCounter++;
  if(state.turnCounter % 6 === 0) saveCheckpoint('第'+state.turnCounter+'回合自动节点');
  renderAll();
  saveNow();
  if(hasDeath){ setTimeout(()=>triggerDeath(dm&&dm[1]?dm[1].trim():'命运在此画上句号'), 600); }
}
function setBusyUI(b){
  const s=$('#send'); s.disabled=b;
  s.innerHTML = b? '<span class="spin"></span> 推演中':'▶ 行动';
}

function exportSave(){
  const data = { app:'wg-ai-rpg', ver:APP_VER, id:CFG.id, title:CFG.title, t:nowStr(), player:state.player, state, cfgApi:{endpoint:cfg.endpoint, model:cfg.model, reasoning:cfg.reasoning, maxTokens:cfg.maxTokens} };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${CFG.title}-${(state.player||{}).name||'存档'}-存档.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast('存档已导出');
}
function importSave(text){
  const d=JSON.parse(text);
  if(!d || d.app!=='wg-ai-rpg' || !d.state) throw new Error('文件格式不正确');
  state = deepClone(d.state);
  state.started = true;
  if(d.cfgApi){ cfg.endpoint=d.cfgApi.endpoint||cfg.endpoint; cfg.model=d.cfgApi.model||cfg.model; cfg.reasoning=d.cfgApi.reasoning||cfg.reasoning; cfg.maxTokens=d.cfgApi.maxTokens||cfg.maxTokens; }
  saveCfg(); saveNow();
  renderAll(); renderChat(); closeModal();
  toast('存档导入成功');
}

function renderWzTalent(body){
  const sel = draft.talentSel || {};
  const ap = draft.attrPoints || {};
  const MAX_TALENTS = 3;
  const baseOf = k => Math.round(((CFG.attrs.find(a=>a.key===k)||{}).max||100)/5);
  const maxOf = k => (CFG.attrs.find(a=>a.key===k)||{}).max||100;
  const totalUsed = () => Object.values(ap).reduce((a,b)=>a+b,0);
  const talentCount = () => Object.keys(sel).filter(k=>sel[k]).length;
  body.innerHTML = `
    <div class="points-bar">
      <span class="pts">${draft.cheat?'∞':draft.points} 点</span>
      <span style="font-size:13px;color:var(--muted)">已用 <b id="wz-used">0</b> · 剩余 <b id="wz-left" style="color:var(--accent)">${draft.points}</b></span>
      <label class="cheat"><input type="checkbox" id="wz-cheat"${draft.cheat?' checked':''}> 🎁 作弊模式：无限天赋点</label>
    </div>
    <label>📊 能力加点（把天赋点分配到六维，影响开局属性）</label>
    <div id="wz-attrs"></div>
    <label>🌟 天赋特长（点击卡片选择，${draft.cheat?'作弊模式不限数量':'最多 '+MAX_TALENTS+' 个'}）</label>
    <div id="wz-talents"></div>
    <label>自定义天赋（每行一条：名称：效果）</label><textarea id="wz-ctal" rows="3" placeholder="例如：&#10;过目不忘：见过的棋谱永远记得">${esc((draft.customTalents||[]).map(t=>t.name+'：'+t.desc).join('\n'))}</textarea>`;
  const attrBox=$('#wz-attrs'), talBox=$('#wz-talents');
  const paint=()=>{ $('#wz-used').textContent=totalUsed(); $('#wz-left').textContent=draft.cheat?'∞':(draft.points-totalUsed()); };
  const renderAttrs=()=>{
    attrBox.innerHTML = CFG.attrs.map(a=>{
      const base=baseOf(a.key), max=maxOf(a.key), val=base+(ap[a.key]||0), pct=Math.min(100,val/max*100);
      return `<div class="attr-row"><span class="lb">${a.icon} ${a.label}</span><span class="bar"><i style="width:${pct}%"></i></span>
        <button class="sub" data-a="${a.key}">−</button><span class="cnt">${val}</span><button class="add" data-a="${a.key}">＋</button></div>`;
    }).join('');
    attrBox.querySelectorAll('.add').forEach(b=>b.onclick=()=>{
      const k=b.dataset.a, max=maxOf(k), base=baseOf(k);
      if(!draft.cheat && totalUsed()+1>draft.points){ toast('天赋点不足（可开启作弊模式获得无限点数）'); return; }
      if(base+(ap[k]||0)+1>max){ toast('该项已达上限 '+max); return; }
      ap[k]=(ap[k]||0)+1; draft.attrPoints=ap; renderAttrs(); paint();
    });
    attrBox.querySelectorAll('.sub').forEach(b=>b.onclick=()=>{
      const k=b.dataset.a;
      if(!ap[k]) return; ap[k]--; if(!ap[k]) delete ap[k]; draft.attrPoints=ap; renderAttrs(); paint();
    });
  };
  const renderTalents=()=>{
    talBox.innerHTML = CFG.talents.map(t=>`
      <div class="talent-item${sel[t.id]?' sel':''}" data-t="${t.id}">
        <div class="inf"><div class="nm">${t.icon} ${esc(t.name)}<span class="cs">${'★'.repeat(Math.min(5,t.cost))}</span></div><div class="ds">${esc(t.desc)}</div></div>
        <div class="mark">${sel[t.id]?'✓':''}</div>
      </div>`).join('');
    talBox.querySelectorAll('.talent-item').forEach(c=>c.onclick=()=>{
      const id=c.dataset.t;
      if(sel[id]){ delete sel[id]; }
      else {
        if(!draft.cheat && talentCount()>=MAX_TALENTS){ toast('最多选择 '+MAX_TALENTS+' 个天赋（开启作弊模式可无限选择）'); return; }
        sel[id]=true;
      }
      draft.talentSel=sel; renderTalents();
    });
  };
  renderAttrs(); renderTalents(); paint();
  $('#wz-cheat').onchange=e=>{ draft.cheat=e.target.checked; renderWzTalent(body); };
  $('#wz-ctal').onchange=e=>{ draft.customTalents = e.target.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const i=l.indexOf('：'); return i>0?{name:l.slice(0,i).trim(),desc:l.slice(i+1).trim()}:{name:l,desc:''}; }); };
}

    <div class="hint">你的备注会写进 AI 的长期设定，每回合都会生效，AI 不会忘记。</div>`;
  $('#wz-notes').onchange=e=>draft.notes=e.target.value.trim();
}
function renderWzDiff(body){
  body.innerHTML = CFG.difficulties.map(d=>`
    <div class="diff-card${draft.diff===d.id?' sel':''}" data-d="${d.id}">
      <div class="nm">${d.icon} ${esc(d.name)}</div>
      <div class="ds">${esc(d.desc)}</div>
      <div class="ru">📌 开局：${esc(d.startHint||'')}</div>
    </div>`).join('');
  body.querySelectorAll('.diff-card').forEach(c=>c.onclick=()=>{ draft.diff=c.dataset.d; renderWzDiff(body); });
}
function renderWzConfirm(body){
  const p=draft.player;
  const d=CFG.difficulties.find(x=>x.id===draft.diff);
  const ap=draft.attrPoints||{};
  const attrSum = CFG.attrs.map(a=>{ const base=Math.round(((a.max)||100)/5); return a.label+':'+(base+(ap[a.key]||0)); }).join('、');
  const tals=Object.keys(draft.talentSel||{}).filter(k=>draft.talentSel[k]).map(id=>{ const t=CFG.talents.find(x=>x.id===id); return t? t.name : ''; }).filter(Boolean);
  const ctals=(draft.customTalents||[]).map(t=>t.name);
  const sup=Object.entries(draft.supplements).filter(([k,v])=>v&&(Array.isArray(v)?v.length:v)).map(([k,v])=>{ const f=CFG.supplements.find(x=>x.key===k); return (f?f.label:k)+'：'+(Array.isArray(v)?v.join('、'):v); });
  const fld=(k,v,full)=>`<div class="fld${full?' full':''}"><div class="k">${k}</div><div class="v">${esc(String(v||'—'))}</div></div>`;
  body.innerHTML = `
    <div class="confirm-grid">
      ${CFG.charFields.map(f=>fld(f.label, p[f.key])).join('')}
      ${p.custom?fld('自定义补充',p.custom,true):''}
      ${fld('能力加点', attrSum, true)}
      ${fld('天赋特长', tals.concat(ctals).join('、')||'无', true)}
      ${sup.length?fld('设定补充', sup.join('；'), true):''}
      ${fld('备注', draft.notes||'无', true)}
      ${fld('难度', d? d.icon+' '+d.name : '未选择', true)}
      ${fld('模型', draft.model, false)}${fld('思考强度', ({off:'关闭',low:'低',medium:'中',high:'高',max:'最大'})[draft.reasoning]||draft.reasoning, false)}${fld('Token限制', draft.maxTokens==='unlimited'?'无限制':draft.maxTokens, false)}
    </div>
    <div class="hint" style="margin-top:12px">点击「🎮 开始游戏」后，AI 将按以上设定与世界观为你展开故事。左上角可随时查看角色与实时状态，右上角可设置/存档。最终属性 = 能力加点与难度起点的较高者。</div>`;
}
async function validateStep(i){
  if(i===0){
    draft.endpoint=$('#wz-endpoint').value.trim(); draft.key=$('#wz-key').value.trim(); draft.model=$('#wz-model').value; draft.reasoning=$('#wz-reasoning').value; draft.maxTokens=$('#wz-tk').value;
    if(!draft.endpoint){ toast('请填写 API 端点'); return false; }
    if(!draft.key){ if(!confirm('尚未填写 API Key，进入游戏后将无法对话。确定继续吗？')) return false; }
    if(!draft.model){ toast('请选择模型'); return false; }
  }
  if(i===1){
    $('#wz-body').querySelectorAll('[data-k]').forEach(el=>{ draft.player[el.dataset.k]=el.value.trim(); });
    const c=$('#wz-custom'); if(c) draft.player.custom=c.value.trim();
    const miss=CFG.charFields.filter(f=>f.required && !(draft.player[f.key]||'').trim());
    if(miss.length){ toast('请填写必填项：'+miss.map(f=>f.label).join('、')); return false; }
  }
  if(i===5 && !draft.diff){ toast('请选择难度'); return false; }
  return true;
}

/* ==================== 开始游戏 ==================== */
async function startGame(){
  if(!draft.diff){ toast('请先选择难度'); renderWizard(); return; }
  state = defaultState(draft.diff);
  state.player = deepClone(draft.player);
  state.player.custom = draft.player.custom||'';
  state.player.notes = draft.notes||'';
  state.talents = Object.keys(draft.talentSel||{}).filter(k=>draft.talentSel[k]).map(id=>CFG.talents.find(t=>t.id===id)).filter(Boolean);
  state.customTalents = draft.customTalents||[];
  state.flags.cheat = !!draft.cheat;
  state.supplements = Object.assign({}, draft.supplements);
  if(draft.supCustom) state.supplements['其他补充'] = draft.supCustom;
  state.difficulty = draft.diff;
  state.started = true;
  cfg.endpoint=draft.endpoint; cfg.key=draft.key; cfg.model=draft.model; cfg.reasoning=draft.reasoning; cfg.maxTokens=draft.maxTokens;
  saveCfg();
  const d0=CFG.difficulties.find(x=>x.id===state.difficulty)||CFG.difficulties[2];
  const ap=draft.attrPoints||{};
  CFG.attrs.forEach(a=>{ let v=Math.round((a.max||100)/5)+(ap[a.key]||0); if(d0.startAttrs && d0.startAttrs[a.key]!=null) v=Math.max(v, d0.startAttrs[a.key]); if(state.attrs[a.key]!=null) state.attrs[a.key]=clamp(v,0,a.max); });
  if(d0.startStatus) Object.assign(state.status, d0.startStatus);
  $('#wizard').classList.add('hidden');
  $('#app').classList.remove('hidden');
  window.scrollTo(0,0);
  renderAll(); renderChat();
  applyTheme();
  document.title = CFG.title+' · AI 角色扮演';
  saveCheckpoint('命运起点');
  addSystem(`🎮 欢迎来到《${CFG.title}》！难度：${d0.name}。正在生成开场…`);
  busy=true; setBusyUI(true);
  try{
    const ai = await callAI([{role:'system',content:buildSystemPrompt()},{role:'user',content:'请现在开始游戏。开场剧情背景：'+CFG.intro+'\n\n请完整展开开场场景（描写环境、人物、氛围），然后停下，等我做出第一个行动。'}], {timeout:120000});
    applyAIText(ai.content, ai.reasoning);
  }catch(err){
    addMsg('assist','⚠️ 开场生成失败：'+err.message+'\n\n请在右上角【设置】中检查 API 配置后，在输入框发送任意内容重试。', {err:true, who:'系统'});
  }finally{ busy=false; setBusyUI(false); }
}

/* ==================== 事件绑定与启动 ==================== */
function initUI(){
  $('#btn-char').onclick=()=>{ $('#char-drawer').classList.add('open'); $('#scrim').classList.add('show'); renderChar(); };
  $('#char-close').onclick=()=>{ $('#char-drawer').classList.remove('open'); $('#scrim').classList.remove('show'); };
  $('#scrim').onclick=()=>{ $('#char-drawer').classList.remove('open'); $('#scrim').classList.remove('show'); };
  document.querySelectorAll('#tb-nav .tb-btn').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));
  $('#send').onclick=()=>sendMessage($('#input').value);
  $('#input').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMessage(e.target.value); } });
  window.addEventListener('beforeunload',()=>{ if(state&&state.started&&ui.autoSave) saveNow(); });
}
function init(){
  loadCfg();
  document.title = CFG.title+' · AI 角色扮演';
  applyTheme();
  document.documentElement.style.fontSize = ui.fontSize==='s'?'13px':ui.fontSize==='l'?'16px':'15px';
  const saved=loadSave();
  if(saved){
    state=saved;
    renderAll(); renderChat();
    $('#wizard').classList.add('hidden');
    $('#app').classList.remove('hidden');
    window.scrollTo(0,0);
    addSystem('💾 已自动读取上次存档，继续你的故事吧。');
    toast('已读取存档');
  } else {
    draft = { endpoint:cfg.endpoint, key:cfg.key, model:cfg.model, reasoning:cfg.reasoning, maxTokens:cfg.maxTokens, player:{}, talentSel:{}, attrPoints:{}, customTalents:[], cheat:false, points:20, supplements:{}, supCustom:'', notes:'', diff:null };
    renderWizard();
  }
  initUI();
}
/* 测试钩子（供自动化测试使用） */
window.__wg = { CFG, get state(){return state}, get cfg(){return cfg}, get ui(){return ui}, get draft(){return draft},
  applyAIText, triggerDeath, saveCheckpoint, restoreCheckpoint, exportSave, importSave,
  fetchModels, callAI, addMemory, addEncy, renderAll, renderChat, saveNow, applyStatus,
  startGame, openModal, closeModal, extractBalancedJSON };
init();
/*__END__*/
</script>
