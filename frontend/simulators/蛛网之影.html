<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a14">
<title>蛛网之影 · 蜘蛛侠世界观AI角色扮演</title>
<style>
/* ============ 主题变量 ============ */
:root{
  --bg-deep:#070a14; --bg-surface:#0d1220; --bg-elevated:#141a2c; --bg-hover:#1d2540; --bg-inset:#0a0e1a;
  --border:#253050; --border-active:#3c4f80;
  --t:#e9edf9; --t2:#aab4d2; --t3:#6c7796;
  --accent:#ff3b47; --accent-dim:#c22833; --accent-glow:rgba(255,59,71,.16);
  --accent2:#38b6ff; --accent2-dim:#1f7fd0;
  --gold:#f0a828; --gold-dim:#b87a1a;
  --jade:#40c8a0; --jade-dim:#1f8a6e;
  --danger:#ff4757; --success:#2fd06f; --purple:#a58bff; --blue:#4a8ff0;
  --hp:#ff4757; --sp:#4a8ff0; --mp:#a58bff; --exp:#b0d838;
  --rad:5px; --rad2:9px; --rad3:14px;
  --shadow:0 8px 40px rgba(0,0,0,.6);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",Consolas,"Cascadia Code","Courier New",monospace;
}
body[data-theme="crimson"]{
  --bg-deep:#12060a; --bg-surface:#1c0b10; --bg-elevated:#261218; --bg-hover:#321a22; --bg-inset:#16080d;
  --border:#3a1f28; --border-active:#5a2f3c;
  --t:#f9e9ec; --t2:#d4aab4; --t3:#966e7a;
  --accent:#ff2e4d; --accent-dim:#d11f3a; --accent-glow:rgba(255,46,77,.18);
  --accent2:#ffa23c;
  --gold:#f5b544; --gold-dim:#c2852a;
  --jade:#43c8a3; --jade-dim:#21886e;
  --hp:#ff3b52; --sp:#ffa23c; --mp:#ff7ab8; --exp:#e8d23c;
}
body[data-theme="sky"]{
  --bg-deep:#071020; --bg-surface:#0c182c; --bg-elevated:#12203a; --bg-hover:#1a2c4d; --bg-inset:#091426;
  --border:#1e3455; --border-active:#33609a;
  --t:#eaf1fb; --t2:#a9bcd8; --t3:#6b80a0;
  --accent:#00d4f0; --accent-dim:#00a0b8; --accent-glow:rgba(0,212,240,.16);
  --accent2:#3b82f6;
  --gold:#f0a828; --gold-dim:#b87a1a;
  --jade:#40c8a0; --jade-dim:#1f8a6e;
  --hp:#ff4757; --sp:#38b6ff; --mp:#a58bff; --exp:#b0d838;
}
body[data-theme="gold"]{
  --bg-deep:#0a0812; --bg-surface:#12101e; --bg-elevated:#1a1730; --bg-hover:#242040; --bg-inset:#0d0b18;
  --border:#32284e; --border-active:#4a3a70;
  --t:#ece6f5; --t2:#b0a6c8; --t3:#7a6e9a;
  --accent:#f0a828; --accent-dim:#b87818; --accent-glow:rgba(240,168,40,.15);
  --accent2:#40c8a0;
  --gold:#f0a828; --gold-dim:#b87818;
  --jade:#40c8a0; --jade-dim:#208060;
  --hp:#e85058; --sp:#5080e0; --mp:#a070f0; --exp:#a0d030;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg-deep);color:var(--t);
  font-family:var(--font);font-size:13px;line-height:1.6;
  -webkit-font-smoothing:antialiased;user-select:none;
}
input,textarea{user-select:text}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-active);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer}
input,textarea,select{
  background:var(--bg-surface);border:1px solid var(--border);color:var(--t);
  border-radius:var(--rad);padding:8px 10px;font-size:12.5px;font-family:var(--font);outline:none;width:100%;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent2-dim)}
textarea{resize:vertical;min-height:60px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
label{font-size:12px;color:var(--t2)}
fieldset{border:1px solid var(--border);border-radius:var(--rad2);padding:10px 12px;margin-bottom:10px}
legend{font-size:11px;color:var(--t3);padding:0 6px;letter-spacing:1px}

/* ============ 顶栏 ============ */
#app{display:grid;grid-template-rows:46px 1fr;height:100vh;height:100dvh;overflow:hidden}
#topbar{
  display:flex;align-items:center;gap:6px;padding:0 10px;
  background:var(--bg-surface);border-bottom:1px solid var(--border);z-index:20;
}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13.5px;letter-spacing:.5px;color:var(--t);white-space:nowrap}
.logo .spider{color:var(--accent);font-size:15px}
.logo small{font-size:9.5px;color:var(--t3);font-weight:400;letter-spacing:2px}
.top-btn{
  background:transparent;border:1px solid var(--border);color:var(--t2);
  border-radius:var(--rad);padding:5px 10px;font-size:12px;white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s;
}
.top-btn:hover{background:var(--bg-hover);color:var(--t)}
.top-btn.accent{border-color:var(--accent-dim);color:var(--accent)}
.top-btn.accent:hover{background:var(--accent-glow);color:var(--accent)}
.top-btn.gold{border-color:var(--gold-dim);color:var(--gold)}
.top-btn.gold:hover{background:var(--accent-glow);color:var(--gold)}
.top-stat{
  display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--t2);
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;padding:2px 8px;white-space:nowrap;
}
.top-stat b{color:var(--t);font-weight:600}
.mini-bar{width:42px;height:4px;background:var(--bg-inset);border-radius:2px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--hp);border-radius:2px;transition:width .4s}
.mini-bar.rep i{background:var(--gold)}
.mini-bar.exp i{background:var(--accent)}
.top-spacer{flex:1}

/* ============ 主区 ============ */
#center-panel{display:flex;flex-direction:column;min-height:0;background:var(--bg-deep)}
#game-log{flex:1;overflow-y:auto;padding:14px 14px 6px;scroll-behavior:smooth}
.log-entry{
  position:relative;background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:var(--rad2);padding:9px 12px;margin-bottom:9px;font-size:12.8px;line-height:1.75;
  animation:fade .25s ease;border-left:3px solid var(--t3);user-select:text;
}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.log-entry .who{font-size:10.5px;letter-spacing:.5px;color:var(--t3);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.log-entry .who .opts{margin-left:auto;display:none;gap:6px}
.log-entry:hover .who .opts{display:flex}
.log-entry .who .opts button{background:none;border:none;color:var(--t3);font-size:10.5px;padding:0;cursor:pointer}
.log-entry .who .opts button:hover{color:var(--accent)}
.log-entry.narrative{border-left-color:var(--accent2-dim);background:var(--bg-elevated)}
.log-entry.action{border-left-color:var(--gold-dim);font-style:italic;color:var(--t2)}
.log-entry.system{border-left-color:var(--t3);background:var(--bg-surface);font-size:10.8px;font-family:var(--mono);color:var(--t3)}
.log-entry.danger{border-left-color:var(--danger);background:linear-gradient(180deg,var(--bg-elevated),rgba(255,71,87,.07))}
.log-entry.gold{border-left-color:var(--gold);background:linear-gradient(180deg,var(--bg-elevated),rgba(240,168,40,.07))}
.log-entry.death{border-left-color:var(--danger);border-color:var(--danger);background:linear-gradient(180deg,rgba(255,71,87,.16),var(--bg-elevated))}
.log-entry.thinking{border-left-color:var(--purple)}
.log-entry.thinking details summary{cursor:pointer;font-size:11px;color:var(--purple);outline:none}
.log-entry.thinking .tw{white-space:pre-wrap;font-size:11.5px;color:var(--t2);margin-top:6px;max-height:180px;overflow-y:auto}
.log-entry .cursor{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;animation:blink .8s step-end infinite}
@keyframes blink{50%{opacity:0}}
.log-entry .note-tag{display:inline-block;font-size:9.5px;color:var(--t3);border:1px solid var(--border);border-radius:3px;padding:0 4px;margin-right:6px;vertical-align:1px}

/* 快捷行动 */
#quick-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 2px}
.quick-action{
  background:var(--bg-elevated);border:1px solid var(--border);color:var(--t2);
  border-radius:16px;padding:4px 12px;font-size:11.5px;transition:all .18s;
}
.quick-action:hover{border-color:var(--accent-dim);color:var(--accent)}
.quick-action.cheat{display:none;border-style:dashed;border-color:var(--gold-dim);color:var(--gold)}
body.cheat-on .quick-action.cheat{display:inline-block}

/* 输入区 */
#input-area{display:flex;gap:8px;align-items:flex-end;padding:8px 14px 12px}
#input-area textarea{flex:1;min-height:42px;max-height:130px;font-size:13px;line-height:1.6;border-radius:var(--rad2)}
#send-btn{
  background:var(--accent);color:#0a0a0a;border:none;border-radius:var(--rad2);
  padding:10px 20px;font-size:13px;font-weight:700;transition:filter .18s,opacity .18s;white-space:nowrap;
}
#send-btn:hover{filter:brightness(1.15)}
#send-btn:disabled{opacity:.35;cursor:not-allowed}
#stop-btn{display:none;background:var(--bg-elevated);border:1px solid var(--danger);color:var(--danger);border-radius:var(--rad2);padding:10px 14px;font-size:12px;font-weight:600;white-space:nowrap}
#stop-btn.show{display:inline-block}
.input-btns{display:flex;gap:6px;align-items:stretch}
.input-btns .send-btn,.input-btns #send-btn{min-height:42px}
.send-stop{background:var(--bg-elevated);border:1px solid var(--danger);color:var(--danger);border-radius:var(--rad2);padding:10px 14px;font-size:12px;font-weight:600;white-space:nowrap;display:none}
.send-stop.show{display:inline-block}

/* 加载指示 */
#loading-indicator{display:none;align-items:center;gap:8px;padding:2px 14px;font-size:11.5px;color:var(--t3)}
#loading-indicator.show{display:flex}
#loading-indicator .dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:bounce 1s infinite}
#loading-indicator .dot:nth-child(2){animation-delay:.15s}
#loading-indicator .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1);opacity:1}}

/* ============ 抽屉 ============ */
.drawer{
  position:fixed;top:0;height:100%;width:302px;background:var(--bg-surface);
  border-left:1px solid var(--border);z-index:60;transition:transform .22s ease;display:flex;flex-direction:column;
  box-shadow:var(--shadow);
}
#left-panel{left:0;transform:translateX(-102%);border-right:1px solid var(--border);border-left:none}
#right-panel{right:0;transform:translateX(102%)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
.drawer-head .close{margin-left:auto;background:none;border:none;color:var(--t3);font-size:14px}
.drawer-head .close:hover{color:var(--t)}
.drawer-body{flex:1;overflow-y:auto;padding:10px 12px 20px}
#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:opacity .22s}
#drawer-backdrop.show{opacity:1;pointer-events:auto}

/* ============ 卡片与条目 ============ */
.panel-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:10px;margin-bottom:10px}
.panel-card h3{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);margin-bottom:8px;font-weight:600}
.panel-card h3 .sub{float:right;letter-spacing:0;text-transform:none;color:var(--t2)}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:11.5px}
.stat-row .lbl{width:46px;color:var(--t2);flex:none}
.stat-row .bar{flex:1;height:8px;background:var(--bg-inset);border-radius:4px;overflow:hidden}
.stat-row .bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.stat-row .val{width:44px;text-align:right;font-family:var(--mono);font-size:11px;color:var(--t);flex:none}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:560px){.attr-grid{grid-template-columns:1fr}}
.attr-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad);padding:5px 8px;font-size:11.5px}
.attr-item b{font-size:15px;font-family:var(--mono)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--t3);flex:none}
.kv .v{color:var(--t);text-align:right}
.chip{display:inline-block;background:var(--bg-hover);border:1px solid var(--border);color:var(--t2);border-radius:5px;padding:2px 8px;font-size:11px;margin:0 5px 5px 0}
.chip.hot{border-color:var(--gold-dim);color:var(--gold)}
.chip.dead{border-color:var(--danger);color:var(--danger)}
.chip.ok{border-color:var(--jade-dim);color:var(--jade)}
.sect-title{font-size:10px;letter-spacing:1.2px;color:var(--t3);margin:12px 0 6px;font-weight:600}
.fight-line{display:flex;justify-content:space-between;font-size:11.8px;padding:4px 0;color:var(--t2)}
.fight-line b{color:var(--t);font-family:var(--mono)}

/* ============ 模态框 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s ease}
.modal{background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad3);width:480px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:14px}
.modal-head .x{margin-left:auto;background:none;border:none;color:var(--t3);font-size:15px}
.modal-head .x:hover{color:var(--t)}
.modal-body{padding:14px 16px;overflow-y:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
.btn{background:transparent;border:1px solid var(--border);color:var(--t2);border-radius:var(--rad);padding:7px 16px;font-size:12.5px;transition:all .18s}
.btn:hover{background:var(--bg-hover);color:var(--t)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1204;font-weight:700}
.btn.gold:hover{filter:brightness(1.1)}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#04231a;font-weight:700}
.btn.jade:hover{filter:brightness(1.1)}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.small{padding:4px 10px;font-size:11px}

/* 设置页 */
.set-group{border:1px solid var(--border);border-radius:var(--rad2);padding:12px;margin-bottom:12px}
.set-group h4{font-size:11px;letter-spacing:1px;color:var(--gold);margin-bottom:10px;font-weight:700}
.set-row{margin-bottom:9px}
.set-row label{display:block;margin-bottom:3px}
.set-row .hint{font-size:10.5px;color:var(--t3);margin-top:3px}
.set-tools{display:flex;flex-wrap:wrap;gap:8px}
.set-tools .btn{flex:1;min-width:120px;text-align:center}

/* 标签页 */
.tab-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tab-pills button{
  background:var(--bg-surface);border:1px solid var(--border);color:var(--t2);
  border-radius:14px;padding:4px 12px;font-size:11.5px;transition:all .18s;
}
.tab-pills button.on{border-color:var(--accent2-dim);color:var(--accent2);background:var(--accent-glow)}

/* 百科条目 */
.ency-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad2);padding:10px 12px;margin-bottom:8px}
.ency-item h4{font-size:13px;color:var(--accent2);margin-bottom:4px}
.ency-item p{font-size:12px;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.ency-item .tag{font-size:9.5px;color:var(--t3);border:1px solid var(--border);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}

/* 记忆条目 */
.mem-item{display:flex;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad2);padding:8px 10px;margin-bottom:7px;font-size:12px;color:var(--t2)}
.mem-item .mt{flex:none;font-size:9.5px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:3px;padding:1px 6px;height:fit-content;margin-top:2px}
.mem-item .mt.m-事件{color:var(--accent2);border-color:var(--accent2-dim)}
.mem-item .mt.m-人物{color:var(--jade);border-color:var(--jade-dim)}
.mem-item .mt.m-线索{color:var(--purple);border-color:var(--purple)}
.mem-item .mt.m-物品{color:var(--gold);border-color:var(--gold-dim)}
.mem-item .txt{flex:1}
.mem-item .ts{flex:none;font-size:9.5px;color:var(--t3);font-family:var(--mono)}

/* 死亡记录 */
.death-card{border:1px solid var(--danger);border-radius:var(--rad2);background:linear-gradient(180deg,rgba(255,71,87,.1),transparent);padding:10px 12px;margin-bottom:10px}
.death-card h5{color:var(--danger);font-size:12.5px;margin-bottom:4px}
.death-card .dc-cause{font-size:11.5px;color:var(--t2);margin-bottom:6px}
.death-card .dc-eval{font-size:11.8px;color:var(--t);background:var(--bg-surface);border-radius:var(--rad);padding:6px 8px;margin-bottom:6px}
.death-card .dc-adv{font-size:11.8px;color:var(--jade);background:var(--bg-surface);border-radius:var(--rad);padding:6px 8px;margin-bottom:8px}
.death-card .dc-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--t3)}
.ck-card{border:1px solid var(--border);border-radius:var(--rad2);background:var(--bg-surface);padding:8px 10px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.ck-card .ck-info{flex:1;font-size:11.8px;color:var(--t2)}
.ck-card .ck-info b{color:var(--t);font-size:12px}

/* 死亡遮罩 */
#death-overlay{position:fixed;inset:0;z-index:120;background:rgba(20,2,4,.88);display:none;align-items:center;justify-content:center;padding:20px}
#death-overlay.show{display:flex}
.death-box{background:var(--bg-elevated);border:1px solid var(--danger);border-radius:var(--rad3);max-width:520px;width:100%;padding:26px 24px;text-align:center;box-shadow:0 0 60px rgba(255,71,87,.25)}
.death-box .skull{font-size:44px;line-height:1}
.death-box h2{color:var(--danger);font-size:20px;margin:10px 0 4px;letter-spacing:2px}
.death-box .db-sub{font-size:11.5px;color:var(--t3);margin-bottom:14px}
.death-box .db-block{text-align:left;background:var(--bg-surface);border-radius:var(--rad2);padding:10px 12px;margin-bottom:10px;font-size:12.5px}
.death-box .db-block .ttl{font-size:10px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;font-weight:700}
.death-box .db-block.eval .ttl{color:var(--accent2)}
.death-box .db-block.adv .ttl{color:var(--jade)}
.death-box .db-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.death-box .db-actions .btn{min-width:130px}

/* ============ 向导 ============ */
#setup-overlay{position:fixed;inset:0;z-index:200;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,59,71,.12),transparent),var(--bg-deep);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.setup-box{width:640px;max-width:100%;background:var(--bg-surface);border:1px solid var(--border-active);border-radius:var(--rad3);box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:94vh}
.setup-head{padding:16px 20px 8px;text-align:center}
.setup-head .t1{font-size:21px;font-weight:800;letter-spacing:1px}
.setup-head .t1 .sp{color:var(--accent)}
.setup-head .t2{font-size:11px;color:var(--t3);letter-spacing:3px;margin-top:2px}
.setup-progress{display:flex;gap:4px;padding:12px 20px 4px;justify-content:center}
.setup-progress .sp-dot{flex:1;max-width:56px;height:4px;border-radius:2px;background:var(--bg-inset);transition:background .3s}
.setup-progress .sp-dot.on{background:var(--accent)}
.setup-progress .sp-dot.done{background:var(--accent-dim)}
.setup-body{padding:14px 20px 6px;overflow-y:auto;flex:1}
.setup-nav{display:flex;justify-content:space-between;gap:10px;padding:12px 20px 18px}
.setup-nav .btn{min-width:110px}
.wizard-h{font-size:15px;font-weight:700;margin-bottom:2px}
.wizard-sub{font-size:11.5px;color:var(--t3);margin-bottom:12px}
.wizard-h .step-tag{font-size:9.5px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:3px;padding:1px 6px;margin-right:8px;vertical-align:2px;letter-spacing:1px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.option-card{
  background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--rad2);
  padding:12px;cursor:pointer;transition:all .18s;
}
.option-card:hover{border-color:var(--border-active)}
.option-card .oc-t{font-size:13px;font-weight:700;margin-bottom:3px}
.option-card .oc-d{font-size:11px;color:var(--t3);line-height:1.5}
.option-card.selected{border-color:var(--accent);background:var(--accent-glow)}
.option-card.selected .oc-t{color:var(--accent)}
.custom-input{border:1px dashed var(--gold-dim);background:var(--bg-surface);color:var(--gold);margin-top:8px;display:none}
.custom-input.show{display:block}
.attr-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attr-ctrl{display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:7px 10px}
.attr-ctrl .an{width:34px;font-size:11px;color:var(--t2);flex:none}
.attr-ctrl .av{width:40px;text-align:center;font-size:16px;font-weight:800;font-family:var(--mono);flex:none}
.attr-ctrl .am{font-size:9.5px;color:var(--t3);width:44px;flex:none}
.attr-ctrl button{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:var(--bg-hover);color:var(--t);font-size:14px;line-height:1;flex:none}
.attr-ctrl button:hover{border-color:var(--accent-dim);color:var(--accent)}
.attr-ctrl button:disabled{opacity:.3;cursor:not-allowed}
.pool-line{display:flex;align-items:center;gap:10px;margin:10px 0 6px;font-size:12px;color:var(--t2)}
.pool-line b{font-size:15px;color:var(--gold);font-family:var(--mono)}
.pool-line.warn b{color:var(--danger)}
.trait-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trait-chip{
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);
  padding:8px 10px;cursor:pointer;transition:all .15s;position:relative;font-size:12px;
}
.trait-chip .tc-t{font-weight:700;font-size:12px}
.trait-chip .tc-d{font-size:10.5px;color:var(--t3);margin-top:2px;line-height:1.5}
.trait-chip:hover{border-color:var(--border-active)}
.trait-chip.sel{border-color:var(--accent);background:var(--accent-glow)}
.trait-chip.sel .tc-t{color:var(--accent)}
.trait-chip.sel::after{content:"✓";position:absolute;top:6px;right:9px;color:var(--accent);font-weight:800}
.trait-chip.weak.sel{border-color:var(--danger);background:rgba(255,71,87,.08)}
.trait-chip.weak.sel .tc-t{color:var(--danger)}
.trait-chip.weak.sel::after{color:var(--danger)}
.skill-row{display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad);padding:4px 10px;margin-bottom:5px}
.skill-row .sk-n{flex:1;font-size:12px;color:var(--t2)}
.skill-row .sk-n b{color:var(--t);font-weight:600}
.skill-row .sk-lvl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t3)}
.skill-row .sk-lvl button{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--bg-hover);color:var(--t);font-size:11px;line-height:1}
.skill-row .sk-lvl button:hover{border-color:var(--gold-dim);color:var(--gold)}
.skill-row .sk-lvl b{width:16px;text-align:center;font-family:var(--mono);color:var(--gold)}
.chip-pick{display:inline-block;background:var(--bg-elevated);border:1px solid var(--border);border-radius:16px;padding:4px 13px;font-size:11.8px;color:var(--t2);cursor:pointer;margin:0 6px 7px 0;transition:all .15s}
.chip-pick:hover{border-color:var(--border-active)}
.chip-pick.sel{border-color:var(--accent);background:var(--accent-glow);color:var(--accent)}
.radio-line{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.radio-card{flex:1;min-width:150px;background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--rad2);padding:10px 12px;cursor:pointer;transition:all .18s}
.radio-card:hover{border-color:var(--border-active)}
.radio-card .rc-t{font-weight:700;font-size:12.5px}
.radio-card .rc-d{font-size:10.8px;color:var(--t3);margin-top:2px;line-height:1.5}
.radio-card.sel{border-color:var(--accent);background:var(--accent-glow)}
.radio-card.sel .rc-t{color:var(--accent)}
.cheat-switch{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(240,168,40,.12),transparent);border:1px dashed var(--gold-dim);border-radius:var(--rad2);padding:10px 12px;margin-bottom:12px}
.cheat-switch .cs-t{flex:1;font-size:12.5px;color:var(--gold);font-weight:700}
.cheat-switch .cs-d{font-size:10.5px;color:var(--t3)}
.tgl{position:relative;width:42px;height:22px;flex:none}
.tgl input{opacity:0;width:0;height:0}
.tgl .sl{position:absolute;inset:0;background:var(--bg-inset);border:1px solid var(--border);border-radius:20px;transition:.25s;cursor:pointer}
.tgl .sl::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--t3);top:2px;left:2px;transition:.25s}
.tgl input:checked+.sl{background:var(--gold-dim);border-color:var(--gold)}
.tgl input:checked+.sl::before{transform:translateX(20px);background:var(--gold)}
.confirm-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.confirm-grid .panel-card{margin-bottom:0}
.confirm-line{display:flex;justify-content:space-between;gap:8px;font-size:11.8px;padding:3px 0;border-bottom:1px dashed var(--border)}
.confirm-line .k{color:var(--t3);flex:none}
.confirm-line .v{color:var(--t);text-align:right;word-break:break-all}
.confirm-note{background:var(--bg-surface);border-left:3px solid var(--gold-dim);border-radius:var(--rad);padding:8px 10px;font-size:11.5px;color:var(--t2);white-space:pre-wrap;margin-top:10px}

/* ============ Toast ============ */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--bg-elevated);border:1px solid var(--border-active);color:var(--t);
  padding:9px 18px;border-radius:20px;font-size:12.5px;z-index:300;opacity:0;pointer-events:none;
  transition:all .25s;box-shadow:var(--shadow);max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--jade)}
#toast.err{border-color:var(--danger);color:#ffb3b8}

/* ============ 补充样式(向导/状态/弹窗) ============ */
.muted{color:var(--t3);font-size:11px}
.small{font-size:10.5px}
.hidden{display:none!important}
.ok{color:var(--success)}
.warn{color:var(--gold)}
.bad{color:var(--danger)}
.typing{color:var(--t3);font-style:italic}
.nb{white-space:pre-wrap;line-height:1.7}
/* 创建向导 */
.setup-box{position:relative;width:min(680px,94vw);max-height:94vh;margin:2vh auto;background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad3);box-shadow:var(--shadow);display:flex;flex-direction:column}
.setup-head{padding:16px 20px 6px;border-bottom:1px solid var(--border)}
.sh-logo{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:1px}
.sh-sub{font-size:11px;color:var(--t3);margin-top:2px}
.setup-progress{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
.sp-dot{flex:1;min-width:52px;text-align:center;font-size:10px;color:var(--t3);padding:4px 2px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface)}
.sp-dot.on{border-color:var(--accent-dim);color:var(--t2)}
.sp-dot.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.sp-dot span{display:block;font-size:13px;font-weight:700}
.sp-dot em{font-style:normal}
.setup-body{padding:14px 20px 10px;overflow-y:auto;flex:1}
.step-title{font-size:16px;font-weight:800;color:var(--t)}
.step-sub{font-size:11.5px;color:var(--t3);margin:4px 0 12px}
.setup-nav{display:flex;justify-content:space-between;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--border)}
/* 表单 */
.f-label{display:block;font-size:11px;color:var(--t2);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=password],textarea,select{width:100%;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad);color:var(--t);padding:8px 10px;font-size:13px;outline:none;box-sizing:border-box;font-family:var(--font)}
input:focus,textarea:focus,select:focus{border-color:var(--accent-dim)}
.f-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.f-col{flex:1;min-width:130px}
.f-col.grow{flex:2}
.check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--t2);cursor:pointer}
.check input{width:auto}
/* 按钮 */
.btn{background:var(--bg-hover);border:1px solid var(--border-active);color:var(--t);border-radius:var(--rad);padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:600;transition:all .15s;font-family:var(--font)}
.btn:hover{background:var(--bg-hover);border-color:var(--t3)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14100a}
.btn.gold:hover{background:#ffc94a}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#04140f}
.btn.jade:hover{background:#5fe0bc}
.btn.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}
.btn.small{padding:4px 10px;font-size:11px}
.btn.big{padding:11px 20px;font-size:14px}
.send-btn{background:var(--accent);border:none;color:#0d0506;border-radius:var(--rad2);padding:9px 22px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:var(--font);transition:all .15s}
.send-btn:hover{filter:brightness(1.15)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.send-stop{background:var(--bg-hover);border:1px solid var(--border-active);color:var(--t2);border-radius:var(--rad2);padding:9px 16px;font-size:12.5px;cursor:pointer;font-family:var(--font)}
/* 顶栏 */
.tb-left,.tb-right{display:flex;align-items:center;gap:6px}
.tb-stats{display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:8px}
.tb-logo{display:flex;align-items:center;gap:5px;font-weight:800;color:var(--accent);cursor:pointer;font-size:15px;padding:0 6px}
.tb-logo-txt{font-size:13.5px}
/* 选项卡片 */
.mode-cards,.trait-grid,.attr-row,.confirm-grid,.zone-grid,.diff-grid{display:grid;gap:8px}
.mode-cards{grid-template-columns:1fr 1fr}
.trait-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.attr-row{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.confirm-grid{grid-template-columns:1fr 1fr}
.zone-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.diff-grid{grid-template-columns:repeat(3,1fr)}
.option-card,.zone-card,.diff-card{border:1px solid var(--border);border-radius:var(--rad2);padding:10px 12px;cursor:pointer;background:var(--bg-surface);transition:all .15s;text-align:left;color:var(--t);font-family:var(--font)}
.option-card:hover,.zone-card:hover,.diff-card:hover{border-color:var(--t3)}
.option-card.selected,.zone-card.selected,.diff-card.selected{border-color:var(--accent);background:var(--accent-glow);box-shadow:0 0 0 1px var(--accent) inset}
.option-card .oc-name{font-weight:700;font-size:13px}
.option-card .oc-desc{font-size:11px;color:var(--t3);margin-top:3px;line-height:1.5}
.diff-card .dc-name{font-weight:800;font-size:14px;color:var(--gold)}
.diff-card .dc-desc{font-size:11px;color:var(--t3);margin-top:4px;line-height:1.5}
/* 属性控制 */
.attr-ctrl{display:flex;align-items:center;gap:8px;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad2);padding:8px 10px}
.attr-ctrl .am{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-active);background:var(--bg-hover);color:var(--t);cursor:pointer;font-weight:800;line-height:1}
.attr-ctrl .am:hover{border-color:var(--accent);color:var(--accent)}
.attr-ctrl .av{font-family:var(--mono);font-size:15px;font-weight:700;min-width:26px;text-align:center;color:var(--accent)}
.attr-ctrl .al{font-size:11px;color:var(--t2);flex:1}
.attr-ctrl .amod{font-size:10px;color:var(--t3);font-family:var(--mono)}
/* 特质/弱点/技能选择 */
.trait-setup{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad2);padding:8px 10px;cursor:pointer;transition:all .15s}
.trait-setup:hover{border-color:var(--t3)}
.trait-setup.sel{border-color:var(--gold);background:rgba(240,168,40,.08)}
.trait-setup.sel .ts-name{color:var(--gold)}
.trait-setup .ts-name{font-size:12.5px;font-weight:700}
.trait-setup .ts-desc{font-size:10.5px;color:var(--t3);margin-top:2px}
.trait-setup .t-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}
.trait-setup .t-ctrl button{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-active);background:var(--bg-hover);color:var(--jade);cursor:pointer;font-weight:800}
.t-ctrl .slv{font-family:var(--mono);font-size:12px;color:var(--jade);min-width:18px;text-align:center}
/* 徽章与芯片 */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bg-hover);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--t2)}
.chip em{font-style:normal;color:var(--jade);font-family:var(--mono)}
.chip.gold{border-color:var(--gold-dim);color:var(--gold)}
.chip.red{border-color:var(--danger);color:var(--danger)}
.chip.blue{border-color:var(--accent2-dim);color:var(--accent2)}
/* 角色页 */
.hero-card{display:flex;align-items:center;gap:12px;background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad2);padding:14px;margin-bottom:10px}
.hero-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.hero-name{font-size:18px;font-weight:800;color:var(--t)}
.hero-sub{font-size:11px;color:var(--t2);margin-top:2px}
.cond-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
.cond-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad);padding:6px 8px;font-size:11px}
.cond-item span{display:block;color:var(--t3);font-size:9.5px;margin-bottom:2px}
.cond-item b{color:var(--t);font-weight:600}
.sub-sec{font-size:10px;color:var(--t3);letter-spacing:1px;margin:10px 0 4px;text-transform:uppercase;font-weight:700}
.q-item{font-size:11.5px;color:var(--t2);padding:4px 0;border-bottom:1px dashed var(--border)}
.q-item.done{color:var(--t3);text-decoration:line-through}
.mem-mini{font-size:10.5px;color:var(--t2);padding:3px 0;border-bottom:1px dashed var(--border)}
.abil-item{font-size:11.5px;color:var(--t2);padding:4px 0}
.lf-item{font-size:11.5px;color:var(--t2);padding:5px 0;border-bottom:1px dashed var(--border);line-height:1.5}
.lf-item span{color:var(--t3);margin-right:6px;font-size:10px}
.rel-item{font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.rel-item b{color:var(--t)}
.rel-item span{margin-left:6px;font-weight:700}
.rel-item em{display:block;font-style:normal;font-size:10.5px;color:var(--t3)}
.zone-mini{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);padding:4px 6px;border-radius:var(--rad);border:1px solid transparent}
.zone-mini.cur{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--t)}
.zone-title{font-size:15px;font-weight:800;color:var(--t)}
.danger-tag{color:var(--gold);font-size:11px}
/* 百科 */
.en-cat,.mem-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.en-pill{border:1px solid var(--border);background:var(--bg-surface);color:var(--t2);border-radius:20px;padding:4px 12px;font-size:11.5px;cursor:pointer;font-family:var(--font);transition:all .15s}
.en-pill:hover{border-color:var(--t3)}
.en-pill.active{background:var(--jade);border-color:var(--jade);color:#04140f;font-weight:700}
.en-list{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto}
.ency-entry{border:1px solid var(--border);border-radius:var(--rad2);background:var(--bg-surface)}
.ency-entry summary{cursor:pointer;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--t);list-style:none;display:flex;justify-content:space-between;align-items:center}
.ency-entry summary em{font-style:normal;font-size:10px;color:var(--jade);border:1px solid var(--jade-dim);border-radius:10px;padding:1px 8px}
.ency-content{padding:0 12px 10px;font-size:11.5px;color:var(--t2);line-height:1.7;white-space:pre-wrap}
.en-qa{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
.en-qa-title{font-size:11.5px;color:var(--t2);font-weight:700;margin-bottom:6px}
.en-qa-row{display:flex;gap:8px}
.en-qa-row input{flex:1}
.ency-ans{margin-top:8px;background:var(--bg-surface);border-left:3px solid var(--jade);border-radius:var(--rad);padding:10px 12px;font-size:12.5px;color:var(--t);line-height:1.7}
.ency-ans.loading{color:var(--t3)}
.ency-ans.err{border-left-color:var(--danger);color:var(--danger)}
/* 记忆 */
.mem-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.mem-entry{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad2);padding:8px 12px;font-size:12px;color:var(--t2);line-height:1.6}
.mem-entry .mem-type{display:inline-block;font-size:10px;color:var(--jade);border:1px solid var(--jade-dim);border-radius:10px;padding:0 8px;margin-bottom:4px}
.mem-entry em{display:block;font-style:normal;font-size:10px;color:var(--t3);margin-top:4px}
/* 死亡回档 */
.death-card{background:var(--bg-surface);border:1px solid var(--border-active);border-radius:var(--rad2);padding:10px 12px;margin-bottom:8px}
.d-head{font-size:12.5px;font-weight:800;color:var(--danger);display:flex;justify-content:space-between}
.d-head em{font-style:normal;font-size:10px;color:var(--t3);font-weight:400}
.d-reason{font-size:12px;color:var(--t);margin-top:6px}
.d-eval,.d-advice{font-size:11.5px;color:var(--t2);margin-top:4px;line-height:1.6}
.d-advice{color:var(--jade)}
.death-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
/* 死亡结算 */
#death-overlay{position:fixed;inset:0;z-index:500;background:rgba(5,2,4,.92);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.death-box{width:min(560px,94vw);background:var(--bg-elevated);border:1px solid var(--danger);border-radius:var(--rad3);padding:28px 26px;box-shadow:0 0 60px rgba(255,71,87,.25);max-height:90vh;overflow-y:auto}
.death-title{font-size:30px;font-weight:900;color:var(--danger);text-align:center;letter-spacing:4px;margin-bottom:14px}
.death-reason{font-size:13px;color:var(--t);text-align:center;margin-bottom:12px;font-weight:600}
.death-eval,.death-advice{background:var(--bg-surface);border-radius:var(--rad2);padding:10px 12px;font-size:12.5px;line-height:1.7;color:var(--t2);margin-bottom:8px}
.death-advice{border-left:3px solid var(--jade)}
/* 确认页 */
.c-item{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad);padding:8px 10px;font-size:11.5px}
.c-item span{display:block;font-size:9.5px;color:var(--t3);margin-bottom:2px;letter-spacing:1px}
.c-item b{color:var(--t);font-weight:600;line-height:1.5;font-size:11.5px}
.c-item.full{grid-column:1/-1}
/* 日志流 */
.log-entry{position:relative;padding:9px 12px 9px 16px;border-left:3px solid var(--t3);border-radius:0 var(--rad2) var(--rad2) 0;background:var(--bg-elevated);font-size:12.5px;line-height:1.7;color:var(--t);animation:fade .25s ease;word-break:break-word;margin-bottom:8px}
.log-entry.narrative{border-left-color:var(--accent);background:var(--bg-elevated)}
.log-entry.action{border-left-color:var(--gold);background:var(--bg-surface);color:var(--t2);font-style:italic}
.log-entry.system{border-left-color:var(--t3);background:var(--bg-inset);color:var(--t3);font-family:var(--mono);font-size:10.5px}
.log-entry.gold{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(240,168,40,.1),transparent)}
.log-entry.danger,.log-entry.death{border-left-color:var(--danger);background:linear-gradient(90deg,rgba(255,71,87,.12),transparent)}
.log-entry.think{border-left-color:var(--purple)}
details.think{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--rad);padding:6px 10px;margin-bottom:8px}
details.think summary{cursor:pointer;font-size:10.5px;color:var(--purple);font-family:var(--mono)}
details.think .nb{font-size:11px;color:var(--t3);font-family:var(--mono);white-space:pre-wrap}
/* 抽屉 */
.drawer{position:fixed;top:0;bottom:0;width:310px;background:var(--bg-elevated);border-left:1px solid var(--border-active);z-index:150;transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.left{left:0;transform:translateX(-102%);border-right:1px solid var(--border-active);border-left:none}
.drawer.right{right:0;transform:translateX(102%)}
#left-panel.open,#right-panel.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:800;color:var(--t);font-size:14px}
.d-close{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:4px 8px}
.d-close:hover{color:var(--t)}
.drawer-body{padding:12px;overflow-y:auto;flex:1}
#drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:140;opacity:1;pointer-events:auto}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s ease}
.modal{width:min(460px,96vw);max-height:90vh;background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad3);box-shadow:var(--shadow);display:flex;flex-direction:column}
.modal.wide{width:min(680px,96vw)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);font-weight:800;color:var(--t);font-size:15px}
.modal-body{padding:14px 18px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid var(--border)}
.guide-text{font-size:12.5px;color:var(--t2);line-height:1.8;white-space:pre-wrap}
/* 向导组件·JS类名补充 */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode-card{display:flex;flex-direction:column;gap:4px;border:2px solid var(--border);border-radius:var(--rad2);padding:12px;cursor:pointer;background:var(--bg-elevated);transition:all .15s;text-align:left;font-family:var(--font)}
.mode-card:hover{border-color:var(--t3)}
.mode-card.selected{border-color:var(--accent);background:var(--accent-glow)}
.mode-card .oc-icon{font-size:26px}
.oc-name{font-size:14px;font-weight:800;color:var(--t)}
.oc-desc{font-size:11px;color:var(--t3);line-height:1.5}
.cheat-bar{background:linear-gradient(90deg,rgba(240,168,40,.14),transparent);border:1px dashed var(--gold-dim);border-radius:var(--rad2);padding:9px 12px;margin-bottom:12px}
.gold-txt{color:var(--gold);font-family:var(--mono);font-size:14px}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-glow);font-weight:700}
.trait-chip{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:8px 10px;cursor:pointer;transition:all .15s;position:relative;font-size:12px;text-align:left;font-family:var(--font);color:var(--t2)}
.trait-chip b{display:block;font-size:12.5px;color:var(--t)}
.trait-chip span{font-size:10px;color:var(--t3);line-height:1.4}
.trait-chip:hover{border-color:var(--t3)}
.trait-chip.on{border-color:var(--gold);color:var(--gold);background:rgba(240,168,40,.1)}
.trait-chip.on::after{content:'✓';position:absolute;top:4px;right:8px;color:var(--gold);font-weight:800}
.trait-chip.wk.on{border-color:var(--danger);background:rgba(255,71,87,.1)}
.trait-chip.wk.on::after{content:'✓';color:var(--danger)}
.trait-chip.wk.on b{color:var(--danger)}
.attr-ctrl .ac-name{font-size:11.5px;color:var(--t2);flex:1}
.attr-ctrl .ac-val{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);min-width:24px;text-align:center}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.skill-ctrl{display:flex;align-items:center;gap:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad);padding:5px 10px;cursor:pointer;transition:all .15s}
.skill-ctrl.on{border-color:var(--jade);background:rgba(64,200,160,.08)}
.skill-ctrl .sk-name{flex:1;font-size:11.5px;color:var(--t2)}
.skill-ctrl.on .sk-name{color:var(--jade);font-weight:700}
.skill-ctrl .sm{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-active);background:var(--bg-hover);color:var(--t);cursor:pointer;font-weight:800;line-height:1;font-size:11px}
.skill-ctrl .sm:hover{border-color:var(--jade);color:var(--jade)}
.zone-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.zone-card{border:1px solid var(--border);border-radius:var(--rad2);padding:9px 11px;cursor:pointer;background:var(--bg-elevated);transition:all .15s;text-align:left;font-family:var(--font);display:flex;flex-direction:column;gap:2px}
.zone-card:hover{border-color:var(--t3)}
.zone-card.selected{border-color:var(--accent);background:var(--accent-glow)}
.zone-card b{font-size:12.5px;color:var(--t)}
.zone-card .zd{font-size:10px;color:var(--gold)}
.zone-card em{font-style:normal;font-size:10px;color:var(--t3);line-height:1.4}
.diff-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff-card{border:2px solid var(--border);border-radius:var(--rad2);padding:11px 12px;cursor:pointer;background:var(--bg-elevated);transition:all .15s;text-align:left;font-family:var(--font);display:flex;flex-direction:column;gap:3px}
.diff-card:hover{border-color:var(--t3)}
.diff-card.selected{border-color:var(--gold);background:rgba(240,168,40,.1)}
.diff-card b{font-size:14px;font-weight:800;color:var(--gold)}
.diff-card .dd{font-size:10.5px;color:var(--t2)}
.diff-card em{font-style:normal;font-size:10.5px;color:var(--t3);line-height:1.5}
.custom-input{border:1px dashed var(--gold-dim);background:var(--bg-surface);color:var(--gold);margin-top:8px}
.attr-grid .attr-ctrl .am{width:24px;height:24px;border-radius:50%;border:1px solid var(--border-active);background:var(--bg-hover);color:var(--t);cursor:pointer;font-weight:800;line-height:1}
.attr-grid .attr-ctrl .am:hover{border-color:var(--accent);color:var(--accent)}
.s-label{width:46px;color:var(--t2);flex:none;font-size:11px}
.name-row{display:flex;gap:6px;align-items:center}
.name-row input{flex:1;min-width:0}
.name-row .btn{flex:none;white-space:nowrap}
.hero-info{flex:1;min-width:0}
.stat-row.big .bar{height:10px}
.stat-row.big b{font-family:var(--mono)}
/* 响应式 */

'use strict';
/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('localStorage 写入失败',e);}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function nowStr(){const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function attrMod(v){return Math.floor((v-10)/2);}
function toast(msg,type){const t=$('toast');t.textContent=msg;t.className='show'+(type?' '+type:'');clearTimeout(t._tm);t._tm=setTimeout(()=>t.className='hidden',2600);}
function stripTags(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent||'';}

 },
 render(){
   const dots=['API配置','角色配置','补充自定义','备注信息','难度设定','信息确认'].map((n,i)=>
     `<div class="sp-dot ${i+1<=this.step?'on':''} ${i+1===this.step?'cur':''}"><span>${i+1}</span><em>${n}</em></div>`).join('');
   $('setup-progress').innerHTML=dots;
   $('setup-body').innerHTML=this.htmlStep(this.step);
   $('setup-prev').style.visibility=this.step===1?'hidden':'visible';
   const next=$('setup-next');
   next.textContent=this.step===this.MAX?'🚀 开始游戏':'下一步 →';
   this.bindStep(this.step);
 },

   const d=this.draft;

<script>

/* ================= 状态与存档 ================= */
const MAX_HISTORY=36,MAX_LOG=300,MAX_MEM=120,MAX_CP=12,MAX_DEATH=6;
function cloneState(){const c=JSON.parse(JSON.stringify(state));delete c.checkpoints;if(c.deaths)c.deaths.forEach(d=>delete d.snapshot);return c;}
function autosave(){if(cfg.autoSave)lsSet(LS_STATE,state);}
function addCheckpoint(label){
  state.checkpoints.push({id:uid(),ts:nowStr(),label:(label||'存档点').slice(0,36),state:cloneState()});
  if(state.checkpoints.length>MAX_CP)state.checkpoints.shift();
}
function addMemory(type,text){
  if(!text||!state)return;
  const t=String(text).trim().slice(0,200);if(!t)return;
  if(state.memories.some(m=>m.text===t))return;
  state.memories.push({type:type||'事件',text:t,ts:nowStr()});
  if(state.memories.length>MAX_MEM)state.memories.splice(0,state.memories.length-MAX_MEM);
}
function addWiki(title,content){
  if(!title||!state)return;
  const t=String(title).trim().slice(0,40);if(!t)return;
  if(state.wikiExtra.some(w=>w.title===t))return;
  state.wikiExtra.push({cat:'冒险记录',title:t,content:String(content||'').slice(0,600)});
}
function setBusy(b){
  busy=b;

  $('stop-btn').classList.toggle('show',b);

  async callAI(messages,onChunk,opts){
    const body={model:cfg.model,messages,stream:!!opts.onChunk};
    if(cfg.maxTokens>0)body.max_tokens=cfg.maxTokens;
    if(/reasoner/i.test(cfg.model)&&cfg.reasoning)body.reasoning_effort=cfg.reasoning;
    const res=await fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.apiKey},body:JSON.stringify(body),signal:genController?genController.signal:undefined});
    if(!res.ok){let m='HTTP '+res.status;try{const j=await res.json();m=(j.error&&(j.error.message||j.error.code))||m;}catch(e){}throw new Error(m);}
    if(!opts.onChunk){const j=await res.json();return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';}
    return this.readStream(res,onChunk);
  },
  async readStream(res,onChunk){
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='',full='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]')return full;
        try{
          const j=JSON.parse(data);
          const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(!d)continue;
          if(d.reasoning_content){onChunk({type:'reasoning',text:d.reasoning_content});}
          if(d.content){full+=d.content;onChunk({type:'content',text:d.content});}
        }catch(e){}
      }
    }
    return full;
  },

      '【当前状况·实时,必须准确延续】\n第'+s.day+'天 '+s.time+' | 位置:'+s.location+(zoneObj?' ('+zoneObj.name+' 危险度'+zoneObj.danger+')':'')+'\n生命:HP '+s.hp+'/'+s.maxhp+' | 伤势:'+s.wound+(s.conds.length?' | 状态:'+s.conds.join('、'):'')+'\n声望:'+s.rep+' (−10~+10) | 暴露值:'+s.exposure+'/10 | 英雄点:'+s.heroPoints+' | 金钱:$'+s.money+' | XP:'+s.xp+' | Lv'+p.level+'\n当前任务:\n'+questTxt+'\n关键关系:\n'+relTxt,

      '【⟦STATUS⟧字段说明】\n{"hp":数值,"maxhp":数值,"wound":"健康|轻伤|重伤|濒死","conds":["状态1","状态2"],"location":"具体地点","zone":"皇后区|曼哈顿|布鲁克林|布朗克斯|上城/哈莱姆","time":"周X HH:MM","day":天数,"rep":声望,"exposure":暴露值,"heroPoints":英雄点,"money":金额,"xp":经验,"quests":[{"text":"任务内容","done":false}],"inventory":["物品1","物品2"],"relations":{"人名":{"rel":"关系程度","note":"一句话现状"}}}\n每次回复都必须输出⟦STATUS⟧块,状态没变化也要输出当前值。'

  async callTurn(){
    if(busy)return;
    if(!cfg.apiKey){toast('请先在设置中配置 API Key','error');return;}
    const msgs=[{role:'system',content:this.buildSystemPrompt()}].concat(state.history.slice(-MAX_HISTORY));
    const entry=UI.appendLog('narrative','<span class="typing">✍️ AI 正在推演…</span>');
    const bodyEl=entry.querySelector('.nb');
    let reasoning='',content='';
    setBusy(true);
    genController=new AbortController();
    try{
      const full=await this.callAI(msgs,(c)=>{
        if(c.type==='reasoning'){reasoning+=c.text;if(bodyEl)bodyEl.textContent='🧠 思考中…';}
        else{content+=c.text;if(bodyEl)bodyEl.textContent=content;}
        const log=$('game-log');if(log)log.scrollTop=log.scrollHeight;
      },{onChunk:true});
      const parsed=this.parseMarkers(full);
      let finalText=parsed.clean||content||'(空回复)';

      finalBody.innerHTML=UI.formatText(finalText);

        det=document.createElement('details');
        det.className='think';
        det.innerHTML='<summary>🧠 AI 思考过程</summary><div class="nb">'+esc(reasoning)+'</div>';
      }
      entry.innerHTML='';
      if(det)entry.appendChild(det);
      entry.appendChild(finalBody);
      state.log[state.log.length-1].html=entry.innerHTML;
      if(parsed.status)this.applyStatus(parsed.status);
      (parsed.memories||[]).forEach(m=>addMemory(m.type,m.text));
      (parsed.wikis||[]).forEach(w=>addWiki(w.title,w.content));
      state.history.push({role:'assistant',content:full||content});
      if(parsed.deaths&&parsed.deaths.length){this.handleDeath(parsed.deaths[0]);}
      else{
        addCheckpoint('「'+stripTags(state.history[state.history.length-2]?state.history[state.history.length-2].content.slice(0,24):'回合')+'」');
        if(state.history.length>MAX_HISTORY)this.compressHistory();
      }
      autosave();
      UI.renderAll();
    }catch(e){
      entry.remove();
      state.log.pop();
      if(state.history.length&&state.history[state.history.length-1].role==='user')state.history.pop();
      UI.appendLog('system','⚠️ 出错了:'+esc(e.message)+' (已回滚,可重试)');
      toast('AI 调用失败:'+e.message,'error');
    }
    genController=null;
    setBusy(false);
  },
  parseMarkers(t){
    const out={clean:t||'',status:null,deaths:[],memories:[],wikis:[]};
    let m;
    m=t.match(/⟦STATUS⟧([\s\S]*?)⟦\/STATUS⟧/);
    if(m)out.status=this.tryJson(m[1]);
    m=t.match(/⟦DEATH⟧([\s\S]*?)⟦\/DEATH⟧/);
    if(m){const j=this.tryJson(m[1]);if(j)out.deaths.push(j);}
    const mm=[...t.matchAll(/⟦MEMORY⟧([\s\S]*?)⟦\/MEMORY⟧/g)];
    mm.forEach(x=>{const j=this.tryJson(x[1]);if(j&&j.text)out.memories.push(j);});
    const wm=[...t.matchAll(/⟦WIKI⟧([\s\S]*?)⟦\/WIKI⟧/g)];
    wm.forEach(x=>{const j=this.tryJson(x[1]);if(j&&j.title)out.wikis.push(j);});
    out.clean=t.replace(/⟦(STATUS|DEATH|MEMORY|WIKI)⟧[\s\S]*?⟦\/\1⟧/g,'').replace(/\n{3,}/g,'\n\n').trim();
    return out;
  },
  tryJson(s){
    try{const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<=a)return null;return JSON.parse(s.slice(a,b+1));}
    catch(e){return null;}
  },
  applyStatus(j){
    const s=state.status;
    if(j.hp!=null)s.hp=clamp(Math.round(j.hp),0,s.maxhp);
    if(j.maxhp!=null)s.maxhp=Math.max(1,Math.round(j.maxhp));
    if(j.wound)s.wound=j.wound;
    if(Array.isArray(j.conds))s.conds=j.conds;
    if(j.location)s.location=j.location;
    if(j.zone&&ZONES.some(z=>z.id===j.zone))s.zone=j.zone;
    if(j.time)s.time=j.time;
    if(j.day!=null)s.day=Math.max(1,Math.round(j.day));
    if(j.rep!=null)s.rep=clamp(Math.round(j.rep),-10,10);
    if(j.exposure!=null)s.exposure=clamp(Math.round(j.exposure),0,10);
    if(j.heroPoints!=null)s.heroPoints=clamp(Math.round(j.heroPoints),0,6);
    if(j.money!=null)s.money=Math.round(j.money);
    if(j.xp!=null){s.xp=Math.max(0,Math.round(j.xp));const lv=1+Math.floor(s.xp/10);if(lv!==state.player.level){state.player.level=lv;UI.appendLog('gold','🎉 升级!现在是 Lv'+lv+',能力强度'+(lv<=3?'T1':lv<=7?'T2':'T3'));}}
    if(Array.isArray(j.quests)){j.quests.forEach(q=>{if(!q.text)return;const ex=state.quests.find(x=>x.text===q.text);if(ex){if(q.done!=null)ex.done=!!q.done;}else state.quests.push({text:String(q.text).slice(0,80),done:!!q.done});});}
    if(Array.isArray(j.inventory)){j.inventory.forEach(it=>{if(it&&!state.inventory.includes(it))state.inventory.push(String(it).slice(0,40));});}
    if(j.relations&&typeof j.relations==='object'){Object.entries(j.relations).forEach(([k,v])=>{if(v&&typeof v==='object'){const ex=state.relations[k]||{};state.relations[k]={rel:v.rel!==undefined?v.rel:ex.rel,note:v.note!==undefined?v.note:ex.note};}});}
    if(j.note)addMemory('事件',j.note);
    if(s.hp<=0&&!state.dead){s.wound='濒死';}
  },
  handleDeath(d){
    state.dead=true;
    if(!state.deaths)state.deaths=[];
    if(!state.checkpoints)state.checkpoints=[];
    const snap=cloneState();
    if(snap.history.length>=2)snap.history=snap.history.slice(0,-2);
    const rec={id:uid(),ts:nowStr(),reason:d.reason||'未知原因',evaluation:d.evaluation||'(AI未给出点评)',advice:d.advice||'',snapshot:JSON.stringify(snap)};
    state.deaths.push(rec);
    if(state.deaths.length>MAX_DEATH)state.deaths.shift();
    UI.appendLog('death','💀 死亡记录已保存:'+esc(rec.reason));
    if(rec.evaluation)UI.appendLog('system','🧾 AI点评:'+esc(rec.evaluation));
    if(rec.advice)UI.appendLog('system','💡 AI建议:'+esc(rec.advice));
    addMemory('事件','💀 死亡:'+rec.reason);
    autosave();
    UI.showDeathOverlay(rec);
  },
  rollbackFromDeath(pick){
    if(state.deaths.length===0)return;
    const r=state.deaths[state.deaths.length-1];
    UI.hideDeathOverlay();
    if(pick){UI.openDeath();return;}
    this.rollbackTo(r.snapshot,'死亡回档点');
  },
  rollbackTo(snap,label){
    try{
      const s=JSON.parse(snap);
      if(!s.player||!s.status)throw new Error('存档损坏');
      const curDeaths=(state&&state.deaths)?state.deaths:[];
      const curCps=(state&&state.checkpoints)?state.checkpoints:[];
      state=s;
      state.dead=false;
      if(!state.deaths)state.deaths=[];
      if(!state.checkpoints)state.checkpoints=[];
      if(!state.log)state.log=[];
      if(!state.memories)state.memories=[];
      if(!state.wikiExtra)state.wikiExtra=[];
      if(!state.quests)state.quests=[];
      if(!state.relations)state.relations={};
      if(!state.inventory)state.inventory=[];
      if(!state.history)state.history=[];
      // 保留死亡记录:快照中的 + 当前尚未丢失的
      const seen={};
      state.deaths.forEach(d=>seen[d.id]=1);
      curDeaths.forEach(d=>{if(!seen[d.id]){state.deaths.push(d);seen[d.id]=1;}});
      if(state.deaths.length>MAX_DEATH)state.deaths.splice(0,state.deaths.length-MAX_DEATH);
      // 保留时间回溯点
      const seenCp={};
      state.checkpoints.forEach(c=>seenCp[c.id]=1);
      curCps.forEach(c=>{if(!seenCp[c.id]){state.checkpoints.push(c);seenCp[c.id]=1;}});
      if(state.checkpoints.length>MAX_CP)state.checkpoints.splice(0,state.checkpoints.length-MAX_CP);
      UI.renderAll();
      UI.appendLog('system','🕰️ 已回档至「'+(label||'关键时间点')+'」,继续游戏。');
      toast('已回档','ok');
      autosave();
    }catch(e){toast('回档失败:'+e.message,'error');}
  },
  regen(){
    if(busy)return;
    if(state.history.length<2)return;
    const last=state.history[state.history.length-1];
    if(last.role!=='assistant')return;
    state.history.pop();
    while(state.log.length&&['narrative','death'].includes(state.log[state.log.length-1].type))state.log.pop();
    UI.renderLog();
    this.callTurn();
  },
  async compressHistory(){
    if(state.history.length<8)return;
    const keep=14;
    const old=state.history.slice(0,-keep);
    const sys='你是故事摘要器。把下面的对话压缩成要点式故事摘要,保留:关键事件、未完成目标、重要线索、人物关系变化、承诺与代价。300-500字,只输出摘要正文。';
    const msgs=[{role:'system',content:sys}].concat(old);
    try{
      const res=await this.callAI(msgs,null,{onChunk:false});
      const txt=(res||'').replace(/⟦[\s\S]*?⟧/g,'').trim();
      if(txt){state.summary=(state.summary?state.summary+'\n':'')+txt.slice(0,1500);}
      state.history=state.history.slice(-keep);
      addMemory('事件','(旧对话已自动压缩进故事摘要)');
      autosave();
    }catch(e){/* 压缩失败不阻塞游戏 */state.history=state.history.slice(-keep);}
  },
  exportSave(){
    if(!state)return;
    const data={app:'蛛网之影',version:1,exportedAt:nowStr(),cfg:cfg,state:state};
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='蛛网之影_存档_'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('存档已导出','ok');
  },
  importSave(){$('import-file').click();},
  handleImport(file){
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const j=JSON.parse(rd.result);
        const st=j.state||j;
        if(!st.player||!st.status)throw new Error('存档格式不正确');
        state=st;
        if(j.cfg){Object.assign(cfg,j.cfg);lsSet(LS_CFG,cfg);applyTheme(cfg.theme);}
        autosave();
        UI.closeModal('settings-modal');
        Game.enterGame(true);
        toast('存档导入成功','ok');
      }catch(e){toast('导入失败:'+e.message,'error');}
    };
    rd.readAsText(file);
  },
  restartGame(){
    if(!confirm('确定重新开始?当前进度会被清除(可先导出存档备份)。'))return;
    window.__restarting=true; // 阻止 beforeunload 自动存档把旧进度写回
    lsDel(LS_STATE);
    localStorage.removeItem(LS_STATE);
    location.reload();
  }
};

    const all=WIKI.concat(state?state.wikiExtra:[]);
    const cats=['全部'].concat([...new Set(all.map(w=>w.cat))]);
    $('en-cat').innerHTML=cats.map(c=>`<button class="en-pill ${c===cat?'active':''}" onclick="UI.renderEncy('${esc(c)}')">${esc(c)}</button>`).join('');
    const list=cat==='全部'?all:all.filter(w=>w.cat===cat);
    $('en-list').innerHTML=list.length?list.map(w=>`
      <details class="ency-entry"><summary>${esc(w.title)} <em>${esc(w.cat)}</em></summary>
      <div class="ency-content">${esc(w.content).replace(/\n/g,'<br>')}</div></details>`).join(''):'<div class="muted">暂无词条</div>';
  },
  async encyAsk(){
    const q=$('en-q').value.trim();if(!q)return;
    const ans=$('en-answer');
    ans.innerHTML='<div class="ency-ans loading">AI 正在查阅…</div>';
    try{
      const base=WIKI.concat(state?state.wikiExtra:[]).slice(-8).map(w=>'词条['+w.title+']:'+w.content.slice(0,150)).join('\n');
      const msgs=[{role:'system',content:'你是《蛛网之影》蜘蛛侠世界观的百科AI。用简洁准确的中文回答玩家关于世界观、人物、规则的问题,100-200字。可参考以下词条:\n'+base}];
      const txt=await Game.callAI(msgs.concat([{role:'user',content:q}]),null,{onChunk:false});
      ans.innerHTML='<div class="ency-ans">'+UI.formatText((txt||'未得到回答').trim())+'</div>';
      addMemory('线索','百科问答:'+q.slice(0,20)+' → '+(txt||'').slice(0,80));
      autosave();
    }catch(e){ans.innerHTML='<div class="ency-ans err">回答失败:'+esc(e.message)+'</div>';}
  },
  openMem(){this.renderMem('全部');this.openModal('mem-modal');},
  renderMem(f){
    memFilter=f;
    const types=['全部','事件','人物','地点','线索','物品','恩怨','其他'];
    $('mem-filter').innerHTML=types.map(t=>`<button class="en-pill ${t===f?'active':''}" onclick="UI.renderMem('${t}')">${t}</button>`).join('');
    const list=state?state.memories.filter(m=>f==='全部'||m.type===f):[];
    $('mem-list').innerHTML=list.length?list.slice().reverse().map(m=>`
      <div class="mem-entry"><span class="mem-type">${esc(m.type)}</span><div>${esc(m.text)}</div><em>${esc(m.ts)}</em></div>`).join(''):'<div class="muted">暂无记忆</div>';
  },
  openDeath(){this.deathTab(deathTab);this.openModal('death-modal');},
  deathTab(t){
    deathTab=t;
    document.querySelectorAll('#death-tabs .en-pill').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='deaths')||(i===1&&t==='checkpoints')));
    const box=$('death-list');
    if(t==='deaths'){
      if(!state||!state.deaths.length){box.innerHTML='<div class="muted">暂无死亡记录。在游戏中阵亡后,AI会点评你的表现并生成回档点。</div>';return;}
      box.innerHTML=state.deaths.slice().reverse().map((d,i)=>`
        <div class="death-card">
          <div class="d-head">💀 第${state.deaths.length-i}次死亡 <em>${esc(d.ts)}</em></div>
          <div class="d-reason">原因:${esc(d.reason)}</div>
          <div class="d-eval">🧾 点评:${esc(d.evaluation)}</div>
          ${d.advice?`<div class="d-advice">💡 建议:${esc(d.advice)}</div>`:''}
          <button class="btn gold small" onclick="Game.rollbackTo(deathSnap('${d.id}'),'第${state.deaths.length-i}次死亡回档点')">⏪ 回档到此处</button>
        </div>`).join('');
    }else{
      if(!state||!state.checkpoints.length){box.innerHTML='<div class="muted">暂无时间回溯点。每回合结束会自动生成。</div>';return;}
      box.innerHTML=state.checkpoints.slice().reverse().map((c,i)=>`
        <div class="death-card">
          <div class="d-head">🕰️ ${esc(c.label)} <em>${esc(c.ts)}</em></div>
          <button class="btn jade small" onclick="Game.rollbackTo(cpSnap('${c.id}'),'${esc(c.label)}')">⏪ 回溯到此处</button>
        </div>`).join('');
    }
  },
  showDeathOverlay(rec){
    $('d-reason').textContent='死因:'+(rec.reason||'未知');
    $('d-eval').innerHTML='🧾 <b>AI 点评:</b>'+esc(rec.evaluation||'(无)');
    $('d-advice').innerHTML='💡 <b>建议:</b>'+esc(rec.advice||'(无)');
    $('death-overlay').classList.remove('hidden');
  },
  hideDeathOverlay(){$('death-overlay').classList.add('hidden');}
};
function deathSnap(id){const r=state.deaths.find(d=>d.id===id);return r?r.snapshot:'';}
function cpSnap(id){const c=state.checkpoints.find(c=>c.id===id);return c?JSON.stringify(c.state):'';}
/* ================= 启动 ================= */
function autoGrow(){
  const t=$('chat-input');
  t.style.height='auto';
  t.style.height=Math.min(110,t.scrollHeight)+'px';
}
function boot(){
  applyTheme(cfg.theme);
  $('chat-input').addEventListener('input',autoGrow);
  $('chat-input').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();Game.send();}
  });
  $('import-file').addEventListener('change',e=>{
    if(e.target.files&&e.target.files[0])Game.handleImport(e.target.files[0]);
    e.target.value='';
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      if(!$('death-overlay').classList.contains('hidden')){UI.hideDeathOverlay();}
      else if(!$('settings-modal').classList.contains('hidden')){UI.closeModal('settings-modal');}
      else if(!$('guide-modal').classList.contains('hidden')){UI.closeModal('guide-modal');}
      else if(!$('ency-modal').classList.contains('hidden')){UI.closeModal('ency-modal');}
      else if(!$('mem-modal').classList.contains('hidden')){UI.closeModal('mem-modal');}
      else if(!$('death-modal').classList.contains('hidden')){UI.closeModal('death-modal');}
      else{UI.closeAllDrawers();}
    }
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();if(state){Game.exportSave();}}
  });
  window.addEventListener('beforeunload',()=>{if(state&&!window.__restarting)autosave();});
  const saved=lsGet(LS_STATE,null);
  if(saved&&saved.player&&saved.status){
    state=saved;
    if(!state.deaths)state.deaths=[];
    if(!state.checkpoints)state.checkpoints=[];
    if(!state.log)state.log=[];
    if(!state.memories)state.memories=[];
    if(!state.wikiExtra)state.wikiExtra=[];
    if(!state.quests)state.quests=[];
    if(!state.relations)state.relations={};
    if(!state.inventory)state.inventory=[];
    if(!state.history)state.history=[];
    if(!state.summary)state.summary='';
    Game.enterGame(true);
  }else{
    W.init();
  }
}
boot();
</script>
