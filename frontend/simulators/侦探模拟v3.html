<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>迷雾侦探 · AI推理探案</title>
<style>
/* ============ 迷雾侦探 · 卷宗主题 ============ */
:root{
  --bg-deep:#0a0d13; --bg-surface:#10141d; --bg-elevated:#161b26; --bg-hover:#1e2433;
  --border:#242b3c; --border-active:#3a435c;
  --t:#e9e6de; --t2:#a9a596; --t3:#6e6b5e;
  --gold:#e8b44a; --gold-dim:#a87f2a; --gold-glow:rgba(232,180,74,0.14);
  --jade:#5fb8a6; --jade-dim:#2e7a6c; --jade-glow:rgba(95,184,166,0.12);
  --r:#e05a5a; --gr:#58c878; --purple:#a78bfa; --blue:#6a9fe8;
  --rad:6px; --rad2:10px; --rad3:16px;
  --tr:180ms ease;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","Cascadia Code","Consolas",monospace;
  --serif:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:radial-gradient(1200px 700px at 70% -10%,rgba(232,180,74,0.05),transparent 60%),var(--bg-deep);color:var(--t);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-active);border-radius:3px}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{background:var(--bg-surface);border:1px solid var(--border);color:var(--t);border-radius:var(--rad);padding:8px 12px;outline:none;transition:border var(--tr)}
input:focus,textarea:focus,select:focus{border-color:var(--gold-dim)}
textarea{resize:none}
.sel{user-select:text}
#app{height:100vh;height:100dvh;position:relative}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg-deep);z-index:10}
.screen.active{display:flex}

/* ============ 顶栏 ============ */
.topbar{height:46px;flex-shrink:0;background:var(--bg-surface);display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--border);z-index:20}
.topbar .logo{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--gold);letter-spacing:2px;white-space:nowrap}
.topbar .logo span{font-family:var(--font);color:var(--t3);font-weight:400;font-size:10px;margin-left:5px;letter-spacing:1px}
.topbar .spacer{flex:1}
.top-btn{padding:5px 11px;border-radius:var(--rad);font-size:11px;border:1px solid var(--border);color:var(--t2);transition:all var(--tr);display:flex;align-items:center;gap:4px;white-space:nowrap;background:none}
.top-btn:hover{background:var(--bg-hover);color:var(--t);border-color:var(--border-active)}
.top-btn.gold{border-color:var(--gold-dim);color:var(--gold)}
.top-btn.gold:hover{background:var(--gold-glow)}
.top-btn.jade{border-color:var(--jade-dim);color:var(--jade)}
.top-btn.jade:hover{background:var(--jade-glow)}
.top-btn.danger{border-color:var(--r);color:var(--r)}
.top-btn.danger:hover{background:rgba(224,90,90,0.12)}
.badge-completed{font-size:10px;color:var(--gr);border:1px solid var(--gr);border-radius:20px;padding:2px 9px;white-space:nowrap}
.badge-new{font-size:10px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:20px;padding:2px 9px;white-space:nowrap}

/* ============ 页头（子页面） ============ */
.page-head{height:46px;flex-shrink:0;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;z-index:20;position:relative}
.page-head .ph-title{position:absolute;left:50%;transform:translateX(-50%);font-size:13px;font-weight:600;color:var(--t);white-space:nowrap}
.page-head .ph-sub{position:absolute;left:50%;transform:translateX(-50%);top:30px;font-size:9px;color:var(--t3);white-space:nowrap}
.back-btn{display:flex;align-items:center;gap:3px;padding:4px 10px;border-radius:var(--rad);font-size:11px;border:1px solid var(--border);color:var(--t2);transition:all var(--tr)}
.back-btn:hover{background:var(--bg-hover);color:var(--t);border-color:var(--border-active)}
.back-btn.right{margin-left:auto}
.back-btn.left{margin-right:auto}

/* ============ 页卡 / 列表 ============ */
.page-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:12px 14px;transition:border var(--tr),background var(--tr);position:relative}
.card:hover{border-color:var(--border-active)}
.card.disabled{opacity:0.62}
.card .c-title{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.card .c-sub{font-size:10.5px;color:var(--t2);margin-top:3px;line-height:1.6}
.card .c-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:9px}
.card .c-tag{position:absolute;top:10px;right:12px;font-size:9.5px;color:var(--t3);border:1px solid var(--border);border-radius:12px;padding:1px 8px}
.chip{display:inline-block;font-size:10px;color:var(--gold);border:1px solid var(--gold-dim);border-radius:20px;padding:1.5px 9px;margin-right:5px;margin-top:4px;white-space:nowrap}
.chip.jade{color:var(--jade);border-color:var(--jade-dim)}
.chip.gray{color:var(--t3);border-color:var(--border-active)}
.chip.red{color:var(--r);border-color:var(--r)}
.btn{padding:7px 16px;border-radius:var(--rad);font-size:12px;font-weight:500;border:1px solid var(--border);color:var(--t2);transition:all var(--tr);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:none}
.btn:hover{background:var(--bg-hover);color:var(--t);border-color:var(--border-active)}
.btn.gold{background:var(--gold);color:#16120a;border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#ffc94a;color:#16120a}
.btn.jade{background:var(--jade);color:#06201b;border-color:var(--jade);font-weight:600}
.btn.jade:hover{background:#6fd4c0;color:#06201b}
.btn.danger{color:var(--r);border-color:var(--r)}
.btn.danger:hover{background:rgba(224,90,90,0.12);color:var(--r)}
.btn.ghost{border-color:transparent;color:var(--t3)}
.btn.ghost:hover{color:var(--t);background:var(--bg-hover)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn.sm{padding:4px 11px;font-size:11px}
.btn.lg{padding:11px 26px;font-size:13.5px;border-radius:var(--rad2)}
.empty-tip{text-align:center;color:var(--t3);font-size:11.5px;padding:26px 0;line-height:1.8}

/* ============ 页签 ============ */
.tabbar{height:48px;flex-shrink:0;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:stretch;padding:0 6px;gap:2px;overflow-x:auto;z-index:15}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:var(--t3);transition:color var(--tr);position:relative;white-space:nowrap}
.tab .tab-ico{font-size:14px}
.tab:hover{color:var(--t2)}
.tab.active{color:var(--gold)}
.tab.active::after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:2px;background:var(--gold);border-radius:2px}

/* ============ 聊天 ============ */
#log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex;flex-direction:column;gap:4px;animation:fade 240ms ease;max-width:100%}
.msg.narrator{background:var(--bg-elevated);border-left:3px solid var(--gold-dim);border-radius:var(--rad2);padding:10px 14px}
.msg.system{background:var(--bg-surface);border-left:3px solid var(--t3);border-radius:var(--rad2);padding:8px 12px;font-size:10.5px;color:var(--t3);font-family:var(--mono)}
.msg .m-head{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--t2)}
.msg .m-name{font-weight:600}
.msg .m-meta{font-size:9.5px;color:var(--jade);border:1px solid var(--jade-dim);border-radius:12px;padding:1px 8px;background:var(--jade-glow)}
.msg .m-text{font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.narrator .m-text{white-space:normal}
.msg .m-time{font-size:9px;color:var(--t3);font-family:var(--mono)}
.msg.me{align-items:flex-end}
.msg.me .m-bubble{background:var(--bg-elevated);border:1px solid var(--gold-dim);border-radius:12px 12px 3px 12px;padding:9px 13px;font-size:12.5px;line-height:1.7;max-width:82%;white-space:pre-wrap;word-break:break-word}
.msg.npc{max-width:96%}
.msg.npc .m-head{align-items:flex-start}
.msg.npc .m-bubble{background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--jade);border-radius:3px 12px 12px 12px;padding:9px 13px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-width:100%}
.msg.reason-ai .m-bubble{background:var(--bg-elevated);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:3px 12px 12px 12px;padding:9px 13px;font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dim),var(--border-active));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;color:#1a1509}
.record-btn{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:10.5px;color:var(--gold);border:1px dashed var(--gold-dim);border-radius:14px;padding:3px 11px;transition:all var(--tr)}
.record-btn:hover{background:var(--gold-glow)}
.typing-dots{display:inline-flex;gap:3px;padding:4px 2px}
.typing-dots span{width:5px;height:5px;background:var(--gold);border-radius:50%;animation:bounce 1s infinite}
.typing-dots span:nth-child(2){animation-delay:0.15s}
.typing-dots span:nth-child(3){animation-delay:0.3s}
@keyframes bounce{0%,80%,100%{transform:scale(0.5)}40%{transform:scale(1)}}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

/* ============ 输入区 ============ */
#input-area{flex-shrink:0;padding:10px 14px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
#input-area textarea{flex:1;resize:none;min-height:40px;max-height:110px;font-size:12.5px;line-height:1.5;border-radius:var(--rad2);background:var(--bg-deep);padding:9px 12px}
#input-area textarea::placeholder{color:var(--t3)}
#send-btn{padding:10px 20px;background:var(--gold);color:#16120a;border-radius:var(--rad2);font-weight:600;font-size:12.5px;transition:all var(--tr);white-space:nowrap}
#send-btn:hover{background:#ffc94a}
#send-btn:disabled{opacity:0.35;cursor:not-allowed}
.input-hint{flex-shrink:0;padding:4px 16px 2px;font-size:9.5px;color:var(--t3)}

/* ============ 详情页 ============ */
.detail-sec{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:13px 15px}
.detail-sec h4{font-size:11px;color:var(--gold);letter-spacing:1.5px;margin-bottom:8px;font-weight:600}
.detail-sec p,.detail-sec li{font-size:12px;color:var(--t2);line-height:1.85}
.detail-sec ul{padding-left:17px}
.detail-sec .k{color:var(--t)}
.detail-sec .num{font-family:var(--mono);color:var(--gold)}
.section-line{height:1px;background:var(--border);margin:12px 0}
.detail-title{font-family:var(--serif);font-size:19px;color:var(--gold);letter-spacing:1px;margin-bottom:2px}
.detail-sub{font-size:11px;color:var(--t3);margin-bottom:12px}

/* ============ 弹窗 ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,10,0.8);z-index:100;display:none;align-items:center;justify-content:center;animation:fade 200ms ease}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad3);padding:20px;width:480px;max-width:94vw;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.6)}
.modal h2{font-size:15px;color:var(--gold);margin-bottom:13px;font-family:var(--serif);letter-spacing:1px}
.modal label{font-size:10.5px;color:var(--t3);display:block;margin-bottom:4px;letter-spacing:0.5px}
.modal input,.modal select,.modal textarea{width:100%;margin-bottom:12px;padding:8px 11px;font-size:12.5px}
.modal textarea{min-height:70px}
.modal select{background:var(--bg-surface)}
.modal .btn-row{display:flex;gap:7px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.modal .hint{font-size:9.5px;color:var(--t3);margin-top:-8px;margin-bottom:11px;line-height:1.7}
.modal .divider{border-top:1px solid var(--border);margin:14px 0 12px;padding-top:12px}
.modal .status{font-size:10.5px;color:var(--t2);margin:-6px 0 10px;min-height:15px}

/* ============ 设置浮钮 ============ */
.float-gear{position:fixed;top:12px;right:12px;z-index:90;width:34px;height:34px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-active);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold);transition:all var(--tr);box-shadow:0 3px 14px rgba(0,0,0,0.45)}
.float-gear:hover{background:var(--bg-hover);border-color:var(--gold-dim);transform:rotate(25deg)}

/* ============ 创建流程 ============ */
#screen-setup{background:radial-gradient(900px 500px at 50% -10%,rgba(232,180,74,0.07),transparent 60%),var(--bg-deep)}
.setup-wrap{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:26px 14px 40px}
.setup-wrap h1{font-family:var(--serif);font-size:26px;color:var(--gold);letter-spacing:5px;margin-bottom:4px}
.setup-wrap .sub{font-size:11px;color:var(--t3);margin-bottom:20px;letter-spacing:2px}
.step-dots{display:flex;gap:8px;margin-bottom:22px}
.step-dot{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--t3);cursor:pointer;padding:4px 10px;border-radius:20px;border:1px solid var(--border)}
.step-dot .n{width:17px;height:17px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--border-active);display:flex;align-items:center;justify-content:center;font-size:9.5px}
.step-dot.active{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-glow)}
.step-dot.active .n{background:var(--gold);color:#16120a;border-color:var(--gold)}
.step-dot.done .n{background:var(--jade);color:#06201b;border-color:var(--jade)}
.setup-box{width:460px;max-width:94vw;display:none;flex-direction:column;gap:11px}
.setup-box.active{display:flex}
.setup-box .step-title{font-size:14px;color:var(--t2);text-align:center;font-weight:600}
.setup-box .step-hint{font-size:10.5px;color:var(--t3);text-align:center;margin-bottom:4px}
.setup-box input,.setup-box select,.setup-box textarea{width:100%;text-align:left;font-size:13.5px;padding:10px 14px;background:var(--bg-elevated);border:1px solid var(--border-active);border-radius:var(--rad2)}
.setup-box textarea{min-height:80px}
.setup-box label{font-size:10px;color:var(--t3);letter-spacing:0.5px;margin-bottom:-6px}
.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.option-card{padding:13px 11px;text-align:center;background:var(--bg-elevated);border:2px solid var(--border);border-radius:var(--rad2);cursor:pointer;transition:all var(--tr);font-size:12px}
.option-card:hover{border-color:var(--gold-dim);background:var(--bg-hover)}
.option-card.selected{border-color:var(--gold);background:var(--gold-glow);color:var(--gold)}
.option-card .oc-icon{font-size:22px;display:block;margin-bottom:3px}
.option-card .oc-name{font-weight:600}
.setup-nav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* ============ 结算 ============ */
#page-verdict{background:radial-gradient(900px 600px at 50% -10%,rgba(232,180,74,0.09),transparent 60%),var(--bg-deep)}
.verdict-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:30px 18px 40px;gap:14px}
.verdict-title{font-family:var(--serif);font-size:26px;letter-spacing:4px;color:var(--gold)}
.verdict-title.fail{color:var(--t2)}
.score-ring{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0}
.score-ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg-deep)}
.score-inner{position:relative;z-index:1;text-align:center}
.score-inner b{font-size:40px;font-family:var(--mono);color:var(--gold)}
.score-inner span{font-size:11px;color:var(--t3);display:block;margin-top:-4px}
.rating-tag{font-size:15px;font-weight:700;color:var(--gold);border:1px solid var(--gold-dim);border-radius:24px;padding:6px 22px;background:var(--gold-glow);letter-spacing:2px}
.verdict-card{width:min(620px,94vw);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:16px 18px}
.verdict-card h4{font-size:11px;color:var(--gold);letter-spacing:1.5px;margin-bottom:8px}
.verdict-card p,.verdict-card li{font-size:12.5px;color:var(--t2);line-height:1.85}
.verdict-card ul{padding-left:18px}
.verdict-actions{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap;justify-content:center}

/* ============ Toast ============ */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--border-active);padding:9px 18px;border-radius:var(--rad2);font-size:12.5px;z-index:300;pointer-events:none;opacity:0;transition:opacity 300ms ease;max-width:88vw}
#toast.show{opacity:1}
#toast.success{border-color:var(--gr)}
#toast.error{border-color:var(--r)}

/* ============ 响应式 ============ */
@media(max-width:768px){
  .topbar{padding:0 8px;gap:5px}
  .topbar .logo{font-size:13px;letter-spacing:1px;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .logo span{display:none}
  .top-stat{display:none}
  .top-btn{padding:6px 9px;font-size:10.5px;min-height:32px}
  .tab{min-width:56px;font-size:9px}
  .tab .tab-n{right:calc(50% - 30px);top:4px}
  #log{padding:12px 10px}
  #log .msg .m-text{font-size:13.5px}
  #input-area{padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  #input-area textarea{font-size:16px;min-height:44px}
  #send-btn{min-width:64px;font-size:14px;padding:11px 16px;min-height:44px}
  .page-body{padding:12px 10px}
  .modal{width:96vw;padding:15px}
  .modal .btn{min-height:40px;padding:9px 16px}
  .setup-box{width:94vw}
  .setup-box input,.setup-box select,.setup-box textarea{font-size:16px}
  .setup-nav .btn{min-height:46px}
  .back-btn{min-height:34px}
  .btn{min-height:38px}
  .btn.sm{min-height:30px}
  .ph-title{font-size:12.5px;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cc-title{font-size:14px}
  .submit-bar .btn{min-height:46px;flex:1}
  .case-card,.card{padding:11px 12px}
  .detail-sec{padding:11px 12px}
  .verdict-body{padding:22px 12px 40px}
  .score-ring{width:128px;height:128px}
  .score-inner b{font-size:34px}
  .float-gear{top:10px;right:10px}
}
@media(max-width:420px){
  .tab{min-width:52px}
  .tab-ico{font-size:12px}
  .setup-wrap h1{font-size:22px}
  .step-dot{font-size:9.5px;padding:4px 7px}
}
.spacer{flex:1}
.sec-title{font-family:var(--serif);font-size:16px;color:var(--gold);letter-spacing:2px;margin:2px 0 4px}
.sec-sub{font-size:10.5px;color:var(--t3);margin-bottom:8px}

/* 案件卡片 */
.case-card{background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--rad2);padding:14px 15px;transition:border var(--tr),transform var(--tr);position:relative}
.case-card:hover{border-color:var(--gold-dim);transform:translateY(-1px)}

.cc-icon.lg{width:52px;height:52px;font-size:26px;border-color:var(--gold-dim)}
.cc-title{font-family:var(--serif);font-size:15.5px;font-weight:700;color:var(--t);letter-spacing:0.5px}

.cc-badge{font-size:10px;color:var(--gr);border:1px solid var(--gr);border-radius:20px;padding:2px 10px;white-space:nowrap;margin-left:auto}

.pcard-top{display:flex;align-items:center;gap:10px}
.avatar-lg{width:42px;height:42px;border-radius:var(--rad2);background:linear-gradient(135deg,var(--gold-dim),var(--border-active));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#1a1509;flex-shrink:0}
.pname{font-size:14px;font-weight:700}
.pname .prole{font-size:10px;color:var(--jade);border:1px solid var(--jade-dim);border-radius:12px;padding:1px 7px;margin-left:6px;font-weight:400;vertical-align:2px}
.pmeta{font-size:10px;color:var(--t3);margin-top:2px}
.pbrief{font-size:11.5px;color:var(--t2);line-height:1.7;margin-top:8px}
.pcard-foot{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:9px}
.dead-tag{font-size:10px;color:var(--r);border:1px solid var(--r);border-radius:12px;padding:1px 8px}
.asked-tag{font-size:10px;color:var(--jade);border:1px solid var(--jade-dim);border-radius:12px;padding:1px 8px}

/* 页签计数 & 顶栏信息 */
.tab-n{position:absolute;top:6px;right:calc(50% - 34px);min-width:15px;height:15px;border-radius:8px;background:var(--gold);color:#16120a;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.top-stat{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;border:1px solid var(--border-active);font-size:10.5px;color:var(--t2);white-space:nowrap}
.top-stat b{color:var(--gold)}

/* 提交栏 */
.submit-bar{flex-shrink:0;padding:10px 16px;background:var(--bg-surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px}

/* 详情信息行 */
.info-row{display:flex;gap:8px;font-size:12px;color:var(--t2);line-height:1.8}
.info-row .k{color:var(--t3);flex-shrink:0}
.detail-hero{display:flex;align-items:center;gap:12px;margin-bottom:12px}

     knowledge:'①19:00-19:30她在公共化妆间做头发（化妆师老郑全程在场）；②19:10前后她透过走廊看到沈惊鸿往东边白蝶化妆间方向走，「大概两三分钟就回来了」——这是她能提供的直接线索；③19:50-20:10中场她在走廊东侧补妆，没看到任何人进出白蝶化妆间；④第二幕她在台上，白蝶没上场她还在心里骂「又摆谱」；⑤她恨白蝶揭穿她假唱，但只想过顶替她演女一号，没想过杀人。',

function caseObj(id){return CASES.find(c=>c.id===id);}
function caseState(id){if(!S.cases[id])S.cases[id]={started:false,completed:false,sceneLog:[],inventory:[],testimony:[],conclusions:[],reasonLog:[],chars:{},verdict:null,memory:[]};else if(!S.cases[id].memory)S.cases[id].memory=[];return S.cases[id];}
function charState(cid,cid2){const cs=caseState(cid);if(!cs.chars[cid2])cs.chars[cid2]={log:[],asked:false};return cs.chars[cid2];}

   ================================================================ */
function chatEndpoint(){let b=S.api.baseUrl.trim().replace(/\/+$/,'');return /\/chat\/completions$/.test(b)?b:b+'/chat/completions';}
function modelsEndpoint(){let b=S.api.baseUrl.trim().replace(/\/+$/,'');return /\/models$/.test(b)?b:b+'/models';}
async function fetchModels(){const r=await fetch(modelsEndpoint(),{headers:{'Authorization':'Bearer '+S.api.key}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();return (d.data||[]).map(m=>typeof m==='string'?m:m.id).filter(Boolean);}
function thinkingSuffix(msgs){
  const t=S.api.thinking;
  if(t==='fast'){const last=msgs[msgs.length-1];if(last)last.content+='\n（请快速简洁作答，不要长篇大论。）';}
  else if(t==='deep'){const last=msgs[msgs.length-1];if(last)last.content+='\n（请深入分析、仔细推理，在回答中体现思考的层次与细节。）';}
}
async function callAI(messages,{stream=true,onDelta,temp=0.8}={}){
  const cfg=S.api;
  if(!cfg.key)throw new Error('未配置 API Key，请先到设置中填写。');
  const body={model:cfg.model,messages:JSON.parse(JSON.stringify(messages)),temperature:temp,stream};
  thinkingSuffix(body.messages);
  body.max_tokens=cfg.maxTokens==='unlimited'?8192:parseInt(cfg.maxTokens)||4096;
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),90000);
  let r;
  try{
    r=await fetch(chatEndpoint(),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body),signal:ctrl.signal});
  }catch(e){clearTimeout(to);throw new Error(e.name==='AbortError'?'请求超时（90秒），请检查网络或端点':'网络错误：'+e.message);}
  clearTimeout(to);
  if(!r.ok){let msg='HTTP '+r.status;try{const e=await r.json();if(e.error&&e.error.message)msg=e.error.message;}catch(e){}throw new Error(msg);}
  if(!stream){const d=await r.json();const c=d.choices&&d.choices[0];let content=(c&&c.message&&c.message.content)||'';const reasoning=(c&&c.message&&c.message.reasoning_content)||'';if(!content.trim()&&reasoning)content=reasoning;return {content,reasoning};}
  const reader=r.body.getReader();const dec=new TextDecoder();let buf='',content='',reasoning='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf('\n'))>=0){
      const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
      if(!line.startsWith('data:'))continue;
      const data=line.slice(5).trim();
      if(data==='[DONE]')continue;
      let j;try{j=JSON.parse(data);}catch(e){continue;}
      if(j.error)throw new Error(j.error.message||'流式响应错误');
      const delta=j.choices&&j.choices[0]&&j.choices[0].delta;
      if(delta){
        if(delta.reasoning_content)reasoning+=delta.reasoning_content;
        if(delta.content){content+=delta.content;if(onDelta)onDelta(delta.content);}
      }
    }
  }
  if(!content.trim()&&reasoning)content=reasoning;
  return {content,reasoning};
}

}

function reasonSystem(c){
  const cs=caseState(c.id);
  const inv=cs.inventory.map(i=>i.name).join('、')||'无';

  return `你是《${c.title}》案件中侦探（${playerDesc()}）的推理助手。\n【本案真相（仅供你判断玩家推理是否正确，绝不可直接告知玩家）】\n${c.truth}\n【调查记忆】${mem}\n【玩家当前掌握】道具：${inv}；证词：${tes}；结论：${conc}\n\n【职责】\n- 帮助玩家梳理线索、指出矛盾、提出调查方向；玩家推理正确时给予肯定（可以说「方向对」），错误时婉转指出并说明理由。\n- 绝不直接说出凶手/手法/真相，不替玩家下结论；用引导式语言（「注意某人的时间线」「这个痕迹说明……」）。\n- 中文回复，简洁有力，不啰嗦，禁止 AI 腔。`;

function judgeSystem(c){

}

function fmtText(t){return esc(t).replace(/\n/g,'<br>');}
function parseMeta(text){
  const m=String(text||'').match(/^【([^】]+)】\s*(?:\n|$)/);
  if(m)return {meta:m[1].trim(),rest:String(text).slice(m[0].length).trim()};
  return {meta:null,rest:String(text||'').trim()};
}
function parseItems(text){
  const m=String(text||'').match(/\[\[ITEMS\]\]([\s\S]*?)\[\[\/ITEMS\]\]/);
  if(!m)return {text:String(text||'').trim(),items:[],testimonies:[]};
  const clean=String(text).replace(/\[\[ITEMS\]\][\s\S]*?\[\[\/ITEMS\]\]/g,'').trim();
  try{
    const d=JSON.parse(m[1].trim());
    return {text:clean,items:Array.isArray(d.items)?d.items:[],testimonies:Array.isArray(d.testimonies)?d.testimonies:[]};
  }catch(e){return {text:clean,items:[],testimonies:[]};}
}
function parseFacts(text){
  const m=String(text||'').match(/\[\[FACTS\]\]([\s\S]*?)\[\[\/FACTS\]\]/);
  if(!m)return {text:String(text||'').trim(),facts:[]};
  const clean=String(text).replace(/\[\[FACTS\]\][\s\S]*?\[\[\/FACTS\]\]/g,'').trim();
  try{
    const d=JSON.parse(m[1].trim());
    return {text:clean,facts:Array.isArray(d.facts)?d.facts.map(String).filter(Boolean):[]};
  }catch(e){return {text:clean,facts:[]};}
}
function addFacts(cs,facts){
  if(!cs.memory)cs.memory=[];
  const added=[];
  (facts||[]).forEach(f=>{
    const t=String(f).trim();if(!t)return;
    if(cs.memory.some(x=>x.text===t))return;
    cs.memory.push({text:t,time:nowStr()});added.push(t);
  });
  return added;
}
function factsToConclusions(cs,facts){
  (facts||[]).forEach(t=>{
    const nm=t.length>18?t.slice(0,18)+'…':t;
    cs.conclusions.push({id:uid(),name:nm,desc:'【自动记录 · 认罪/承认】'+t,time:nowStr(),auto:true});
  });
}
function addItems(cs,items,testimonies){
  const added={items:[],testimonies:[]};
  (items||[]).forEach(it=>{
    if(!it||!it.name)return;
    const n=String(it.name).trim();if(!n)return;
    const ex=cs.inventory.find(x=>x.name===n);
    if(ex){if(!ex.desc&&it.desc)ex.desc=String(it.desc).trim();return;}
    cs.inventory.push({id:uid(),name:n,desc:String(it.desc||'').trim(),time:nowStr()});added.items.push(n);
  });
  (testimonies||[]).forEach(t=>{
    if(!t||!t.name)return;
    const n=String(t.name).trim();if(!n)return;
    const ex=cs.testimony.find(x=>x.name===n);
    if(ex){if(!ex.desc&&t.desc)ex.desc=String(t.desc).trim();return;}
    cs.testimony.push({id:uid(),name:n,desc:String(t.desc||'').trim(),time:nowStr()});added.testimonies.push(n);
  });
  return added;
}

function startStream(kind,name,letter){
  const log=$('#log');if(!log)return null;
  const dots=log.querySelector('.typing-dots');if(dots&&dots.parentElement)dots.parentElement.remove();
  const el=document.createElement('div');
  if(kind==='npc'){el.className='msg npc';el.innerHTML=`<div class="m-head"><div class="avatar">${esc(letter||'')}</div><span class="m-name">${esc(name)}</span></div><div class="m-bubble"></div>`;}
  else if(kind==='reason'){el.className='msg reason-ai';el.innerHTML=`<div class="m-head"><span class="m-name">🧠 推理助手</span></div><div class="m-bubble"></div>`;}
  else{el.className='msg narrator';el.innerHTML=`<div class="m-head"><span class="m-name">${esc(name||'现场')}</span></div><div class="m-text"></div>`;}
  log.appendChild(el);log.scrollTop=log.scrollHeight;
  return el;
}
function appendStream(el,t){if(!el||!el.isConnected)return;const x=el.querySelector('.m-bubble,.m-text');if(x){x.textContent+=t;el.parentElement.scrollTop=el.parentElement.scrollHeight;}}
function finishStream(el,content){if(el&&el.isConnected){const x=el.querySelector('.m-bubble,.m-text');if(x)x.textContent=content;}}
function pushGains(cs,added,af){
  const a=[];
  if(added&&added.items&&added.items.length)a.push('📦 证物：'+added.items.join('、'));
  if(added&&added.testimonies&&added.testimonies.length)a.push('📜 证词：'+added.testimonies.join('、'));
  if(af&&af.length)a.push('🧠 记忆：'+af.join('；'));
  if(a.length)showToast(a.join('　'));
}

async function sendScene(){
  if(UI.busy)return;
  const inp=$('#scene-in');const txt=inp.value.trim();if(!txt)return;
  const c=caseObj(NAV.caseId),cs=caseState(c.id);
  cs.sceneLog.push({role:'user',content:txt,time:nowStr()});
  inp.value='';UI.busy=true;save();renderAll();
  const msgs=[{role:'system',content:sceneSystem(c)}];
  cs.sceneLog.slice(-16).forEach(m=>msgs.push({role:m.role,content:m.content}));
  const bubble=startStream('narrator','现场');
  try{
    const res=await callAI(msgs,{stream:true,onDelta:t=>appendStream(bubble,t)});
    const {text,items,testimonies}=parseItems(res.content);
    const pf=parseFacts(text);
    const {meta,rest}=parseMeta(pf.text);
    const added=addItems(cs,items,testimonies);
    const af=addFacts(cs,pf.facts);
    if(af.length)factsToConclusions(cs,af);
    cs.sceneLog.push({role:'assistant',content:rest||pf.text||text,meta:meta||null,time:nowStr()});
    UI.busy=false;save();renderAll();pushGains(cs,added,af);
  }catch(err){
    UI.busy=false;cs.sceneLog.pop();save();renderAll();
    showToast('❌ '+err.message,'error');
  }
}

async function sendChar(first){
  if(UI.busy)return;
  const c=caseObj(NAV.caseId);if(!c)return;
  const cs=caseState(c.id);
  const p=c.participants.find(x=>x.id===NAV.charId);if(!p)return;
  const ch=charState(c.id,p.id);
  let txt='';
  if(!first){const inp=$('#chat-in');txt=inp.value.trim();if(!txt)return;inp.value='';}
  ch.asked=true;
  const msgs=[{role:'system',content:npcSystem(c,p)}];
  if(first){
    msgs.push({role:'user',content:'（'+(S.player?S.player.name:'侦探')+'走进来要向你了解情况。请以'+p.name+'的口吻说出见到对方的第一句话，必须以【情绪：XX｜小动作：XX】开头，然后换行说话，说完停下等对方提问。不要解释你的心理。）'});
  }else{
    ch.log.push({role:'user',content:txt,time:nowStr()});
    ch.log.slice(-20).forEach(m=>msgs.push({role:m.role,content:m.content}));
    const lm=[...ch.log].reverse().find(m=>m.meta);
    if(lm)msgs.push({role:'system',content:'（你上一轮的情绪表现为：'+lm.meta+'。请保持连贯。）'});
  }
  UI.busy=true;save();renderAll();
  const bubble=startStream('npc',p.name,p.name[0]);
  try{
    const res=await callAI(msgs,{stream:true,onDelta:t=>appendStream(bubble,t)});
    const {text,items,testimonies}=parseItems(res.content);
    const pf=parseFacts(text);
    const {meta,rest}=parseMeta(pf.text);
    const added=addItems(cs,items,testimonies);
    const af=addFacts(cs,pf.facts);
    if(af.length)factsToConclusions(cs,af);
    ch.log.push({role:'assistant',content:rest||pf.text||text,meta:meta||null,time:nowStr()});
    UI.busy=false;save();renderAll();pushGains(cs,added,af);
  }catch(err){
    UI.busy=false;save();renderAll();
    showToast('❌ '+err.message,'error');
  }
}

      <div class="rating-tag">${esc(v.rating||'')}</div>`:''}
      ${v.solved?`<div class="verdict-card"><h4>📋 结案评语</h4><p class="sel">${fmtText(v.comment||'')}</p></div>`
      :`<div class="verdict-card"><h4>📋 缺口与错误</h4><ul>${(v.gaps||[]).map(g=>`<li>${fmtText(g)}</li>`).join('')}</ul></div>
      <div class="verdict-card"><h4>💡 提示</h4><p>继续调查：补充证据、询问人物、完善你的结论后再来提交。</p></div>`}
      <div class="verdict-actions">
        ${v.solved?`<button class="btn lg gold" data-act="verdict-complete">✅ 完成</button><button class="btn lg jade" data-act="verdict-continue">🔍 继续探索</button>`
        :`<button class="btn lg gold" data-act="verdict-continue">🔍 继续调查</button>`}
      </div>
    </div>
  </div>`;
}
function askSubmit(){
  const cs=caseState(NAV.caseId);
  if(!cs.conclusions.length){showToast('⚠️ 请先添加结论再提交','error');return;}
  UI.confirm={title:'⚖️ 提交破案结论',body:'将把你当前的 '+cs.conclusions.length+' 条结论作为最终答案，交给终审 AI 判定（会消耗一次 API 调用）。确认提交？',okText:'提交判定',onOk:submitCase};
  UI.modal='confirm';renderAll();
}
function extractJSON(t){
  let s=String(t||'').replace(/```json|```/g,'').trim();
  const m=s.match(/\{[\s\S]*\}/);
  if(m)s=m[0];
  return JSON.parse(s);
}
async function submitCase(){
  const c=caseObj(NAV.caseId),cs=caseState(c.id);
  const concl=cs.conclusions.map((x,i)=>(i+1)+'. '+x.name+'：'+x.desc).join('\n')||'（无）';
  const userMsg='【侦探档案】'+playerDesc()
    +'\n【侦探提交的全部结论】\n'+concl
    +'\n【调查过程摘要】\n道具：'+(cs.inventory.map(i=>i.name).join('、')||'无')
    +'\n证词：'+(cs.testimony.map(t=>t.name).join('、')||'无')
    +'\n近期行动：\n'+(cs.sceneLog.slice(-10).filter(m=>m.role==='user').map(m=>'· '+m.content).join('\n')||'（无）')
    +'\n\n请按判定规则输出 JSON。';
  NAV.screen='verdict';renderAll();
  try{
    const res=await callAI([{role:'system',content:judgeSystem(c)},{role:'user',content:userMsg}],{stream:false,temp:0.2});
    const j=extractJSON(res.content);
    cs.verdict={solved:!!j.solved,score:Math.round(Number(j.score)||0),rating:String(j.rating||''),comment:String(j.comment||''),gaps:Array.isArray(j.gaps)?j.gaps.map(String):[],time:nowStr()};
    save();renderAll();
  }catch(err){
    NAV.screen='conc';renderAll();
    showToast('❌ 判定失败：'+err.message,'error');
  }
}
function verdictComplete(){
  const cs=caseState(NAV.caseId);
  cs.completed=true;save();NAV.screen='cases';renderAll();
  showToast('🏆 案件已完成！');
}
/* ---- 设置 / 存档 ---- */
function saveSettings(){
  S.api.baseUrl=$('#set-base').value.trim()||DEFAULTS.baseUrl;
  S.api.key=$('#set-key').value.trim();
  S.api.model=$('#set-model').value||S.api.model;
  S.api.maxTokens=$('#set-tokens').value;
  S.api.thinking=$('#set-thinking').value;
  save();UI.modal=null;renderAll();showToast('✅ 设置已保存');
}
function fetchModelsWith(base,key){
  let b=String(base||'').trim().replace(/\/+$/,'');
  const ep=/\/models$/.test(b)?b:b+'/models';
  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),20000);
  return fetch(ep,{headers:{'Authorization':'Bearer '+key},signal:ctrl.signal})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(d=>(d.data||[]).map(m=>typeof m==='string'?m:m.id).filter(Boolean))
    .catch(e=>{clearTimeout(to);throw new Error(e.name==='AbortError'?'请求超时':'网络错误：'+e.message);})
    .finally(()=>clearTimeout(to));
}
async function refreshModels(scope){
  const base=(scope?$('#api-base'):$('#set-base')).value.trim()||S.api.baseUrl;
  const key=(scope?$('#api-key'):$('#set-key')).value.trim()||S.api.key;
  const status=scope?null:$('#set-status');
  if(!key){if(status)status.textContent='⚠️ 请先填写 API Key';else showToast('⚠️ 请先填写 API Key','error');return;}
  try{
    const models=await fetchModelsWith(base,key);
    S.api.models=models;
    if(!models.includes(S.api.model))S.api.model=models[0]||S.api.model;
    const sel=scope?$('#api-model'):$('#set-model');
    if(sel){sel.innerHTML=models.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');sel.value=S.api.model;}
    if(status)status.textContent='✅ 拉取成功，共 '+models.length+' 个模型';
    else showToast('✅ 模型列表已更新');
  }catch(err){
    if(status)status.textContent='❌ '+err.message;
    else showToast('❌ '+err.message,'error');
  }
}
async function testConn(){
  const st=$('#set-status');if(st)st.textContent='⏳ 测试中…';
  const base=$('#set-base').value.trim()||S.api.baseUrl;
  const key=$('#set-key').value.trim()||S.api.key;
  try{
    const models=await fetchModelsWith(base,key);
    if(st)st.textContent='✅ 连接成功 · 模型：'+models.slice(0,5).join('、')+(models.length>5?' 等':'');
  }catch(err){if(st)st.textContent='❌ '+err.message;}
}
function exportSave(){
  const data={type:'detective-ai-save',version:1,savedAt:new Date().toISOString(),...S};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='迷雾侦探-存档-'+(S.player?S.player.name:'未命名')+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1200);
  showToast('💾 存档已导出');
}
function importSave(){$('#import-file').click();}
function askRestart(){
  UI.confirm={title:'🔄 重新开始',body:'将清除角色与全部案件进度（仅保留 API 配置），并回到角色配置界面。确定？',danger:true,okText:'重置',onOk:restartGame};
  UI.modal='confirm';renderAll();
}
function restartGame(){
  S.player=null;S.cases={};save();
  UI.modal=null;UI.confirm=null;
  NAV={screen:'setup',setupStep:'role'};
  renderAll();showToast('🔄 已重置，请重新配置角色');
}
document.getElementById('import-file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d||!d.api)throw new Error('无效存档文件');
      S=d;if(!S.cases)S.cases={};save();
      UI.modal=null;UI.confirm=null;
      if(!S.player)NAV={screen:'setup',setupStep:S.api.key?'role':'api'};
      else NAV={screen:'cases'};
      renderAll();showToast('✅ 存档已导入');
    }catch(err){showToast('❌ 导入失败：'+err.message,'error');}
  };
  r.readAsText(f);
  e.target.value='';
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;
  const id=e.target&&e.target.id;
  if(id==='scene-in'){e.preventDefault();sendScene();}
  else if(id==='chat-in'){e.preventDefault();sendChar(false);}
  else if(id==='reason-in'){e.preventDefault();sendReason();}
});
/* ---- 启动 ---- */
function boot(){
  const saved=loadSave();
  S=saved||{api:{...DEFAULTS},player:null,cases:{}};
  if(!S.cases)S.cases={};
  if(!S.api)S.api={...DEFAULTS};
  if(!S.api.models||!S.api.models.length)S.api.models=[...DEFAULTS.models];
  if(!S.player){NAV.screen='setup';NAV.setupStep=S.api.key?'role':'api';}
  else NAV.screen='cases';
  renderAll();
  if(NAV.screen==='setup'&&NAV.setupStep==='api'&&S.api.key&&!UI.modelsFetched){UI.modelsFetched=true;refreshModels(true);}
}
boot();
</script>
